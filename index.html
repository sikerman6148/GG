<style>
:root{--bg1:#bfe9ff;--bg2:#d7f2d4;--card:#fff;--tx:#1d2b1f;--sub:#68796b;--bd:#cfe0cf;--in:#f2f7f1;--bad:#d32f2f;--gd:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f2233;--bg2:#12251a;--card:#1d2a21;--tx:#eaf3ea;--sub:#9db0a0;--bd:#33463a;--in:#142019;--bad:#ef5350;--gd:#81c784}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(var(--bg1),var(--bg2)) fixed}
main{max-width:480px;margin:0 auto;padding:14px 14px 30px}
.hero{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#66bb6a,#1b5e20);box-shadow:0 8px 0 #134a17,0 14px 22px rgba(0,40,0,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.hero svg{width:62px;height:62px;border-radius:16px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.hero b{font-size:30px;letter-spacing:3px;text-shadow:0 3px 0 rgba(0,0,0,.25)}.hero small{display:block;opacity:.9;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 0 rgba(0,70,0,.12),0 12px 20px rgba(0,50,0,.12),inset 0 2px 0 rgba(255,255,255,.6)}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
input,select{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--in);color:var(--tx);box-shadow:inset 0 3px 6px rgba(0,0,0,.14);outline:0}
input:focus{border-color:#43a047}
button{width:100%;font-size:18px;font-weight:700;padding:15px;border:0;border-radius:14px;margin-top:14px;color:#fff;background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 6px 0 #1b5e20,0 10px 16px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #1b5e20}
button.g{background:linear-gradient(#cfd8dc,#90a4ae);color:#263238;text-shadow:none;box-shadow:0 5px 0 #607d8b,0 8px 12px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.6)}
button.r{background:linear-gradient(#ef5350,#b71c1c);box-shadow:0 6px 0 #7f0f0f,0 10px 16px rgba(0,0,0,.25)}
button.o{background:linear-gradient(#ffb74d,#e65100);box-shadow:0 6px 0 #a83a00,0 10px 16px rgba(0,0,0,.25)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{flex:1}
.sub{color:var(--sub);font-size:13px}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;margin-right:8px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.A{background:linear-gradient(#42a5f5,#1565c0)}.B{background:linear-gradient(#ffb74d,#e65100)}
.team{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;margin-top:8px;background:var(--in);box-shadow:inset 0 2px 4px rgba(0,0,0,.1);font-size:15px}
.pi{display:flex;align-items:center;gap:10px;margin-top:10px}.pi input{flex:1}
.dot{width:34px;height:34px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.5)}
.lose{color:var(--bad);font-weight:800}.win{color:var(--gd);font-weight:800}
.msg{margin-top:12px;padding:12px;border-radius:12px;text-align:center;background:var(--in);box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 0;border-bottom:1px dashed var(--bd)}tr:last-child td{border:0}td:last-child{text-align:right;font-weight:800}
.err{color:var(--bad);font-size:14px;margin-top:10px;font-weight:600}
.guide{background:var(--in);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7}
.sc td,.sc th{text-align:center;padding:4px 2px;font-size:13px}.sc td:last-child{text-align:center;font-weight:400}.sc input{padding:6px 2px;font-size:15px;text-align:center;border-radius:8px;box-shadow:none}
details summary{font-weight:700;cursor:pointer;margin-bottom:8px}
.spin{width:46px;height:46px;border:6px solid var(--bd);border-top-color:#43a047;border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.par{width:auto;flex:1;margin:0;padding:12px 0;font-size:18px;color:var(--tx);text-shadow:none;background:linear-gradient(#fff,#dfe8de);box-shadow:0 4px 0 #b7c7b6,0 6px 10px rgba(0,0,0,.15),inset 0 2px 0 #fff}
.par.on{color:#fff;background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 4px 0 #1b5e20,0 6px 10px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.par:active{transform:translateY(3px)}
.st{width:48px;height:48px;padding:0;margin:0;font-size:28px;line-height:1;border-radius:50%;flex:none;background:linear-gradient(#ffb74d,#e65100);box-shadow:0 5px 0 #a83a00,0 8px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4)}
.st.m{background:linear-gradient(#42a5f5,#1565c0);box-shadow:0 5px 0 #0d3f86,0 8px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4)}
.sv{width:78px;text-align:center;line-height:1.1}.sv b{font-size:28px;display:block}.sv small{font-size:12px;font-weight:700;color:var(--sub)}
.pi .n{flex:1;font-size:17px;font-weight:600}
.sm{width:auto;margin:0;padding:6px 10px;font-size:13px;border-radius:10px}

<script>
const P=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],COL=['#e53935','#1e88e5','#fb8c00','#8e24aa'],ME='한진욱';
const LOGO='<svg viewBox="0 0 108 108"><rect width="108" height="108" fill="#8FD3F4"/><rect width="108" height="40" fill="#B9E6FA"/><path d="M0,70 Q54,50 108,70 L108,108 L0,108z" fill="#43A047"/><path d="M0,90 Q54,76 108,90 L108,108 L0,108z" fill="#2E7D32"/><ellipse cx="54" cy="92" rx="22" ry="4" fill="#0003"/><path d="M44,70 L64,70 L58,92 L50,92z" fill="#E0A526"/><circle cx="54" cy="52" r="20" fill="#fff" stroke="#CFD8DC" stroke-width="1.5"/><g fill="#CFD8DC"><circle cx="46" cy="45" r="2.5"/><circle cx="57" cy="42" r="2.5"/><circle cx="51" cy="54" r="2.5"/><circle cx="63" cy="53" r="2.5"/><circle cx="44" cy="60" r="2.5"/><circle cx="58" cy="63" r="2.5"/></g></svg>';
const $=id=>document.getElementById(id),won=n=>Number(n).toLocaleString('ko-KR')+'원';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dot=i=>`<span class="dot" style="background:${COL[i]}">${i+1}</span>`,sg=d=>(d>0?'+':'')+d;
let HIST=[];try{HIST=JSON.parse(localStorage.getItem('gg_hist')||'[]')}catch(e){}
const Z=()=>({r:0,h:0,sc:[],pars:[],cur:{par:4,d:[0,0,0,0]},holes:[]});
let S={scr:'setup',names:['','','',''],fine:10000,tie:5000,rounds:9,date:today(),course:'',me:0,hcp:{},...Z(),err:'',note:'',ask:false,del:-1,open:false,start:''};
try{const p=JSON.parse(localStorage.getItem('gg_pref')||'null');if(p){S.names=p.names;if(p.rounds)S.rounds=p.rounds;if(p.hcp)S.hcp=p.hcp}}catch(e){}
const nm=i=>S.names[i],PK=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
function hl(){PK.forEach(([a,b],k)=>{const g=i=>($('n'+i).value.trim()||'선수'+(i+1)),e=$('hl'+k);if(e)e.textContent=g(a)+' · '+g(b)})}
function mh(){const H=[];S.sc.forEach((rd,r)=>{if(rd.length===2)for(let k=0;k<2;k++)H.push({par:S.pars[2*r+k],s:rd[k]})});return H}
function calc(H=S.holes){
 const n=Math.floor(H.length/2),fines=[0,0,0,0],rs=[];
 for(let r=0;r<n;r++){const [A,B]=P[r%3],sm=T=>T.reduce((a,i)=>a+H[2*r].s[i]+H[2*r+1].s[i],0),hc=T=>S.hcp[T[0]+'-'+T[1]]||0,ra=sm(A),rb=sm(B),ha=hc(A),hb=hc(B),a=ra-ha,b=rb-hb,lose=a>b?A:b>a?B:null;
  if(lose)lose.forEach(i=>fines[i]+=S.fine);else fines.forEach((_,i)=>fines[i]+=S.tie);rs.push({A,B,a,b,lose,ra,rb,ha,hb})}
 const tot=[0,1,2,3].map(i=>H.reduce((a,h)=>a+h.s[i],0)),pt=H.reduce((a,h)=>a+h.par,0);
 return{rs,fines,tot,pt,n}
}
function readForm(man){
 const n=[0,1,2,3].map(i=>$('n'+i).value.trim()),f=$('fine').value,tv=$('tie').value,rd=Number($('rd').value);
 const ok=n.every(x=>x)&&new Set(n).size===4,on=S.names.slice();S.names=n;S.fine=Number(f)||0;S.tie=Number(tv)||0;S.date=$('dt').value||'';S.course=$('cs').value.trim();S.me=Number($('me').value);
 if(n.indexOf(ME)>=0)S.me=n.indexOf(ME);
 if(man&&!ok){S.err='네 명의 이름을 서로 다르게 모두 입력해 주세요.';draw(true);return false}
 if(f===''||tv===''||S.fine<0||S.tie<0){S.err='진 팀 벌금과 비겼을 때 벌금을 입력해 주세요.';draw(true);return false}
 if(man){if(!(rd>=1)){S.err='라운드 수를 확인해 주세요.';draw(true);return false}S.rounds=Math.floor(rd)}
 try{localStorage.setItem('gg_pref',JSON.stringify({names:ok?n:on,fine:S.fine,rounds:S.rounds,hcp:S.hcp}))}catch(e){}
 S.err='';return true
}
function startManual(){if(!readForm(true))return;if(!S.date)S.date=today();Object.assign(S,Z(),{sc:[[]],scr:'hcp',next:'play',hcp:{},start:today(),ask:false,note:''});draw()}
function go(){
 if(S.scr==='play'){
  S.note='';S.err='';const c=S.cur;S.pars[S.r*2+S.h]=c.par;S.sc[S.r][S.h]=c.d.map(x=>c.par+x);S.cur={par:4,d:[0,0,0,0]};
  if(S.h===0)S.h=1;else S.scr='round';return draw();
 }
 if(S.scr==='round'){
  if(S.r+1>=S.rounds){S.holes=mh();S.note='';S.open=false;S.scr='res'}else{S.r++;S.h=0;S.sc[S.r]=[];S.scr='play'}
  draw();
 }
}
function setPar(p){S.cur.par=p;draw(true)}
function adj(i,k){S.cur.d[i]=Math.max(-2,Math.min(8,S.cur.d[i]+k));draw(true)}
function lab(d){return d<=-3?'알바트로스':d==-2?'이글':d==-1?'버디':d==0?'파':d==1?'보기':d==2?'더블보기':d==3?'트리플보기':'+'+d}
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,1800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function analyze(file){
 if(!file)return;if(S.scr==='setup'&&!readForm(false))return;
 const sample=window.claude?await claude.use('sample'):null;
 if(!sample){S.err='사진 분석은 Claude 앱에서 이 앱의 링크를 열었을 때만 쓸 수 있어요. 홀별 입력은 그대로 쓸 수 있어요.';return draw(true)}
 const prev=S.scr,auto=prev==='setup'&&!(S.names.every(x=>x)&&new Set(S.names).size===4);S.scr='busy';draw();
 try{
  const blob=await shrink(file);
  const d=await sample.json(`첨부한 사진은 골프 스코어카드입니다. ${auto?'카드에 적힌 선수 4명의 이름을 행 순서대로(위에서 아래, 또는 왼쪽에서 오른쪽) 읽어 players에 넣고, 타수도 같은 순서로 맞추세요. 이름이 보이지 않으면 "선수1"처럼 쓰세요.':`선수 4명의 이름은 카드의 행 순서대로 다음과 같다고 가정합니다: ${S.names.join(', ')}. 이름이 카드에 적혀 있으면 이름으로 맞추고, 아니면 행 순서대로 맞추세요.`}
각 홀의 파(par)와 4명의 실제 타수를 읽어 아래 JSON만 출력하세요(설명·코드블록 금지).
{"players":["이름1","이름2","이름3","이름4"],"date":"YYYY-MM-DD 또는 null","course":"구장명 또는 null","holes":[{"par":4,"scores":[선수1타수,선수2타수,선수3타수,선수4타수]}]}
holes는 1번 홀부터 순서대로 전부(보통 18개)입니다. 타수가 '+1','-1' 같은 파 대비 표기이면 파를 더해 실제 타수로 환산하세요. 읽을 수 없는 칸은 null.`,{images:[blob],cache:false});
  let miss=0,H=(d.holes||[]).map(h=>{const par=[3,4,5,6].includes(h.par)?h.par:4;return{par,s:[0,1,2,3].map(i=>{const v=Number(h.scores&&h.scores[i]);if(!(v>0)){miss++;return par}return Math.round(v)})}});
  if(H.length<1)throw 0;
  if(prev==='setup')Object.assign(S,Z(),{start:today(),ask:false});
  let nmNote='';
  if(auto){const pl=Array.isArray(d.players)?d.players:[],nn=[0,1,2,3].map(i=>String(pl[i]||'').trim()||`선수${i+1}`);S.names=nn.map((x,i)=>nn.indexOf(x)<i?x+(i+1):x);const k=S.names.indexOf(ME);if(k>=0)S.me=k;else nmNote=` 이름에서 ${ME}님을 찾지 못해 ${S.names[S.me]} 선수를 내 기록으로 저장해요(결과 화면에서 바꿀 수 있어요).`;nmNote=` 선수: ${S.names.join(', ')}.`+nmNote}
  const old=S.pars.length;H=H.slice(0,S.rounds*2);
  H.forEach((x,i)=>{S.pars[i]=x.par;(S.sc[i>>1]=S.sc[i>>1]||[])[i&1]=x.s});
  const K=S.pars.length;S.r=K>>1;S.h=K&1;if(!S.sc[S.r])S.sc[S.r]=[];S.cur={par:4,d:[0,0,0,0]};S.err='';
  S.note=`스코어카드에서 ${H.length}홀을 반영했어요.`+nmNote+(old>H.length?' 카드 이후에 입력한 홀은 그대로 유지했어요.':'')+(miss?` 읽지 못한 ${miss}칸은 파로 채웠으니 결과 화면에서 확인하세요.`:'');
  if(!S.date&&d.date)S.date=d.date;if(!S.course&&d.course)S.course=d.course;if(!S.date)S.date=today();
  const tgt=K>=S.rounds*2?'res':'play';if(tgt==='res'){S.holes=mh();S.open=false}if(prev==='setup'){S.hcp={};S.next=tgt;S.scr='hcp'}else S.scr=tgt;
  draw();
 }catch(e){S.scr=prev;S.err=e&&e.code==='not_granted'?'분석 권한을 허용해야 사진을 분석할 수 있어요.':'스코어카드를 읽지 못했어요. 글자가 선명하게 나오도록 다시 촬영하거나 올려 주세요.';draw()}
}
function hcpDone(){PK.forEach(([a,b],k)=>{const v=parseFloat($('hc'+k).value);S.hcp[a+'-'+b]=isNaN(v)?0:v});S.scr=S.next;draw()}
function early(){S.holes=mh();S.note='';S.open=false;S.scr='res';draw()}
function setH(i,j,v){v=Math.round(Number(v));if(!(v>0))return draw(true);if(j<0)S.holes[i].par=v;else S.holes[i].s[j]=v;draw(true)}
function save(){const c=calc(),m=S.me;HIST.push({date:S.date,course:S.course||'-',score:c.tot[m],diff:c.tot[m]-c.pt,holes:S.holes.length,full:true});try{localStorage.setItem('gg_hist',JSON.stringify(HIST))}catch(e){}}
function finish(sv){if(sv&&S.scr==='res')save();Object.assign(S,Z(),{scr:'setup',fine:10000,tie:5000,date:today(),course:'',err:'',note:'',ask:false,del:-1,start:''})}
function delOne(i){HIST.splice(i,1);try{localStorage.setItem('gg_hist',JSON.stringify(HIST))}catch(e){}S.del=-1;draw(true)}
function stats(){
 const L=HIST.map((x,i)=>({x,i})).filter(o=>o.x.full),H=L.map(o=>o.x);let h=`<div class="card"><h2>📊 ${ME} 기록</h2>`;
 if(!H.length)return h+'<div class="sub">아직 기록이 없어요. 게임을 마치고 "게임 종료·결과 저장"을 누르면 날짜별 구장과 점수가 여기에 쌓입니다.</div></div>';
 const n=H.length,avg=H.reduce((a,x)=>a+x.score,0)/n,ad=H.reduce((a,x)=>a+x.diff,0)/n,bx=(t,v)=>`<div class="msg" style="flex:1;margin:0">${t}<br><b style="font-size:22px">${v}</b></div>`;
 h+=`<div class="row">${bx('평균 타수',avg.toFixed(1))}${bx('파 대비',sg(+ad.toFixed(1)))}${bx('게임 수',n)}</div><table style="margin-top:10px">`+L.slice().reverse().slice(0,20).map(({x,i})=>`<tr><td style="text-align:left"><b>${x.date}</b><br><span class="sub">${x.course}</span></td><td style="text-align:right">${x.score}타 <span class="${x.diff>0?'lose':x.diff<0?'win':''}">(${sg(x.diff)})</span></td><td style="text-align:right;width:56px"><button class="g sm" onclick="S.del=${i};draw(true)">삭제</button></td></tr>`+(S.del===i?`<tr><td colspan="3" style="text-align:left"><div class="msg" style="margin:0">${x.date} ${x.course} 기록만 삭제할까요?<br><span class="sub">되돌릴 수 없어요.</span></div><div class="row"><button class="g" onclick="S.del=-1;draw(true)">취소</button><button class="r" onclick="delOne(${i})">삭제</button></div></td></tr>`:'')).join('')+'</table></div>';
 return h
}
const hadj=(r,A)=>{const raw=A?r.ra:r.rb,h=A?r.ha:r.hb;return h?`${raw-h}타 <span class="sub">(${raw}${h>0?'−'+h:'+'+(-h)})</span>`:`${raw}타`};
const tl=(k,T,x='')=>`<div class="team"><span><span class="chip ${k}">${k}팀</span><b>${nm(T[0])} · ${nm(T[1])}</b></span>${x}</div>`;
const board=()=>{const f=calc(mh()).fines;return '<div class="card"><h2>💰 누적 벌금</h2><table>'+[0,1,2,3].map(i=>`<tr><td>${dot(i)}</td><td style="text-align:left;padding-left:10px">${nm(i)}</td><td>${won(f[i])}</td></tr>`).join('')+'</table></div>'};
const msgs=()=>(S.note?`<div class="card"><div style="color:var(--gd);font-weight:600;font-size:14px">${S.note}</div></div>`:'')+(S.err?`<div class="card"><div class="err" style="margin:0">⚠️ ${S.err}</div></div>`:'');
const scanCard=()=>`<div class="card"><h2>📸 스코어카드로 반영</h2><div class="guide">라운드가 끝날 때마다, 몇 라운드 뒤에, 또는 18홀이 모두 끝난 뒤에 올려도 돼요. 카드에 적힌 홀의 점수가 자동 입력되고, 이어서 입력하거나 18홀이면 결과가 바로 나와요.</div><div class="row"><button class="o" onclick="$('fc').click()">📷 촬영</button><button class="g" onclick="$('fg').click()">🖼 파일 올리기</button></div></div>`;
const endbtn=()=>S.ask?`<div class="card"><div class="msg">게임을 중도 종료할까요?<br><span class="sub">중도 종료한 게임은 기록에 포함되지 않고, 진행 중인 게임은 사라집니다.</span></div><div class="row"><button class="g" onclick="S.ask=false;draw(true)">취소</button><button class="r" onclick="finish(false);draw()">중도 종료</button></div></div>`:'<button class="g" onclick="S.ask=true;draw(true)">⏹ 게임 종료</button>';
function draw(keep){
 const e=S.err?`<div class="err">⚠️ ${S.err}</div>`:'';
 let h=`<div class="hero">${LOGO}<div><b>GG</b><small>Golf Game · 골프 내기</small></div></div>`;
 if(S.scr==='setup'){
  h+=stats()+`<div class="card"><h2>📅 라운딩 정보</h2><label>날짜</label><input id="dt" type="date" value="${S.date}"><label>구장명</label><input id="cs" value="${S.course}" placeholder="예: 서울CC">
  <h2 style="margin-top:18px">👥 참가자</h2>`+[0,1,2,3].map(i=>`<div class="pi">${dot(i)}<input id="n${i}" value="${S.names[i]}" placeholder="선수 ${i+1} 이름"></div>`).join('')+
  `<label>🙋 나(${ME})는 몇 번 선수?</label><select id="me">${[0,1,2,3].map(i=>`<option value="${i}" ${S.me===i?'selected':''}>선수 ${i+1}</option>`).join('')}</select><label>💵 진 팀 벌금 (진 팀 인당, 원)</label><input id="fine" type="number" inputmode="numeric" value="${S.fine}"><label>🤝 비겼을 때 벌금 (네 명 각자, 원)</label><input id="tie" type="number" inputmode="numeric" value="${S.tie}">
  <label>🔁 라운드 수 (1라운드 = 2홀)</label><input id="rd" type="number" inputmode="numeric" value="${S.rounds}"><div class="sub" style="margin-top:8px">다음 화면에서 팀 핸디를 설정할 수 있어요 · 합산 타수가 큰 팀이 각자 진 팀 벌금 · 무승부는 네 명 모두 비겼을 때 벌금</div>${e}<button onclick="startManual()">⛳ 게임 시작 (홀별 입력)</button></div>
  <div class="card"><h2>📸 선택: 스코어카드로 한 번에 분석</h2><div class="guide">게임을 마친 뒤 스코어카드를 <b>카메라로 촬영</b>하거나 <b>캡처/사진 파일</b>을 올리면 홀별 입력 없이 결과를 한 번에 계산해요. 게임 도중에도 올릴 수 있어요. 위의 <b>날짜·구장명·벌금</b>만 입력하면 <b>참가자 이름은 카드에서 자동으로 읽어요</b>. (이름을 미리 입력해 두면 그 이름으로 맞춰요.)</div><button class="o" onclick="$('fc').click()">📷 카메라로 촬영</button><button class="g" onclick="$('fg').click()">🖼 사진·캡처 파일 올리기</button></div>`;
 }else if(S.scr==='hcp'){
  h+=`<div class="card"><h2>🎯 팀 핸디 설정</h2><div class="sub">핸디를 줄 팀 칸에 숫자를 입력하세요. 그 두 명이 한 팀일 때 합산 타수에서 핸디만큼 빼고 비교해요. 없으면 비워 두세요.</div>${S.note?`<div style="color:var(--gd);font-weight:600;font-size:14px;margin-top:8px">${S.note}</div>`:''}`+PK.map(([a,b],k)=>`<div class="pi"><span class="n">${dot(a)} ${dot(b)} ${nm(a)} · ${nm(b)}</span><input id="hc${k}" type="number" inputmode="decimal" step="0.5" placeholder="0" value="${S.hcp[a+'-'+b]||''}" style="flex:none;width:90px;text-align:center"></div>`).join('')+`<button onclick="hcpDone()">${S.next==='res'?'결과 보기 🏆':'⛳ 게임 시작'}</button><button class="g" onclick="S.scr='setup';draw()">← 이전</button></div>`;
 }else if(S.scr==='busy'){h+='<div class="card" style="text-align:center"><div class="spin"></div><h2>스코어카드 분석 중…</h2><div class="sub">보통 10~30초 걸려요. 잠시만 기다려 주세요.</div></div>'}
 else if(S.scr==='play'){
  const [A,B]=P[S.r%3],hole=S.r*2+S.h+1;
  h+=msgs()+`<div class="card"><div class="row"><h2 style="margin:0">${S.r+1}라운드 / ${S.rounds}</h2><span class="sub">${S.h+1}번째 홀</span></div>${tl('A',A)}${tl('B',B)}</div>
  <div class="card"><h2>⛳ ${hole}번 홀 · 기본 파</h2><div class="row">`+[3,4,5].map(p=>`<button class="par ${S.cur.par===p?'on':''}" onclick="setPar(${p})">파${p}</button>`).join('')+`</div><h2 style="margin-top:18px">🏌️ 타수 입력 <span class="sub">(파 기준 ± 버튼)</span></h2>`+[0,1,2,3].map(i=>`<div class="pi">${dot(i)}<span class="n">${nm(i)}</span><button class="st m" onclick="adj(${i},-1)">−</button><span class="sv"><b>${S.cur.par+S.cur.d[i]}</b><small>${lab(S.cur.d[i])}</small></span><button class="st" onclick="adj(${i},1)">+</button></div>`).join('')+
  `<button onclick="go()">${S.h===0?'다음 홀로 ▶':'라운드 결과 보기 🏁'}</button></div>`+board()+scanCard()+endbtn();
 }else if(S.scr==='round'){
  const c=calc(mh()),L=c.rs[S.r],st=T=>`<b class="${L.lose===T?'lose':L.lose?'win':''}">${hadj(L,T===L.A)} ${L.lose===T?'패':L.lose?'승':'무'}</b>`;
  h+=msgs()+`<div class="card"><h2>📋 ${S.r+1}라운드 결과</h2>${tl('A',L.A,st(L.A))}${tl('B',L.B,st(L.B))}<div class="msg">${L.lose?`<span class="lose">${L.lose.map(nm).join(', ')}</span> 각자 <b>${won(S.fine)}</b> 납부`:`🤝 무승부 — 네 명 모두 각자 <b>${won(S.tie)}</b> 납부`}</div></div>`+board()+
  `<button onclick="go()">${S.r+1>=S.rounds?'최종 결과 보기 🏆':'다음 라운드 ▶'}</button>`+(S.r+1<S.rounds?'<button class="g" onclick="early()">📊 여기까지로 결과 확정</button>':'')+scanCard()+endbtn();
 }else{
  const c=calc(),o=[0,1,2,3].sort((a,b)=>c.fines[a]-c.fines[b]),t=[0,1,2,3].sort((a,b)=>c.tot[a]-c.tot[b]),M=['🥇','🥈','🥉','4️⃣'];
  h+=`<div class="card"><h2>📋 ${S.date} · ${S.course||'구장명 없음'}</h2><div class="sub">${S.holes.length}홀 · ${c.n}라운드 · 진 팀 ${won(S.fine)} · 무승부 ${won(S.tie)}</div><label>🙋 내 기록으로 저장할 선수</label><select onchange="S.me=Number(this.value);draw(true)">${[0,1,2,3].map(i=>`<option value="${i}" ${S.me===i?'selected':''}>${nm(i)}</option>`).join('')}</select>${S.note?`<div class="err">${S.note}</div>`:''}</div>
  <div class="card"><h2>🏆 벌금 순위 <span class="sub">(적게 낸 사람이 1위)</span></h2><table>`+o.map((i,k)=>`<tr><td>${M[k]}</td><td style="text-align:left;padding-left:8px">${dot(i)} ${nm(i)}</td><td class="${k===0?'win':''}">${won(c.fines[i])}</td></tr>`).join('')+`</table><div class="msg">벌금 총액 <b>${won(c.fines.reduce((a,b)=>a+b,0))}</b></div></div>
  <div class="card"><h2>⛳ ${S.holes.length}홀 총 합산 점수</h2><div class="sub">기준 파 합계 ${c.pt}타 · 타수가 적은 순</div><table>`+t.map(i=>{const d=c.tot[i]-c.pt;return`<tr><td>${dot(i)}</td><td style="text-align:left;padding-left:8px">${nm(i)}</td><td>${c.tot[i]}타 <span class="${d>0?'lose':d<0?'win':''}">(${sg(d)})</span></td></tr>`}).join('')+`</table></div>
  <div class="card"><h2>🔁 라운드별 결과</h2>`+c.rs.map((r,k)=>{const L=r.lose,nn=T=>T.map(nm).join('·');return`<div class="team"><span><b>${k+1}R</b> <span class="chip A">A</span>${nn(r.A)} ${hadj(r,1).replace(/타/g,'')}<br><span class="chip B">B</span>${nn(r.B)} ${hadj(r,0).replace(/타/g,'')}</span><span style="text-align:right">${L?`<span class="lose">${nn(L)}</span><br>각 ${won(S.fine)}`:`무승부<br>전원 ${won(S.tie)}`}</span></div>`}).join('')+`</div>
  <div class="card"><details ${S.open?'open':''} ontoggle="S.open=this.open"><summary>✏️ 스코어 확인·수정</summary><div class="sub" style="margin-bottom:6px">칸을 고치면 결과가 바로 다시 계산돼요.</div>${[0,1,2,3].map(i=>`<div class="pi" style="margin:4px 0">${dot(i)}<input value="${nm(i)}" onchange="S.names[${i}]=this.value.trim()||S.names[${i}];draw(true)"></div>`).join('')}<table class="sc"><tr><th>홀</th><th>파</th>`+[0,1,2,3].map(i=>`<th>${dot(i)}</th>`).join('')+'</tr>'+S.holes.map((x,i)=>`<tr><td>${i+1}</td><td><input type="number" inputmode="numeric" value="${x.par}" onchange="setH(${i},-1,this.value)"></td>`+x.s.map((v,j)=>`<td><input type="number" inputmode="numeric" value="${v}" onchange="setH(${i},${j},this.value)"></td>`).join('')+'</tr>').join('')+`</table></details></div>`+
  (S.ask?`<div class="card"><div class="msg">게임을 종료하고 결과를 저장할까요?<br><span class="sub">${ME}님 기록(${S.date}, ${c.tot[S.me]}타)이 저장돼요.</span></div><div class="row"><button class="g" onclick="S.ask=false;draw(true)">취소</button><button onclick="finish(true);draw()">저장·종료</button></div></div>`:`<button onclick="S.ask=true;draw(true)">✅ 게임 종료 · 결과 저장</button><button class="g" onclick="finish(false);draw()">저장하지 않고 닫기</button>`);
 }
 $('app').innerHTML=h;if(!keep)window.scrollTo(0,0);
 try{['play','round','res'].includes(S.scr)?localStorage.setItem('gg_game',JSON.stringify(S)):S.scr==='busy'||localStorage.removeItem('gg_game')}catch(e){}
}
['fc','fg'].forEach(id=>$(id).addEventListener('change',ev=>{const f=ev.target.files[0];ev.target.value='';analyze(f)}));
const D=JSON.parse(JSON.stringify(S));
try{const g=JSON.parse(localStorage.getItem('gg_game')||'null');if(g&&['play','round','res'].includes(g.scr)){S={...S,...g,ask:false};if(!S.hcp||typeof S.hcp!=='object')S.hcp={};calc(S.scr==='res'?S.holes:mh());if(S.scr!=='res'&&!S.sc[S.r])throw 0}}catch(e){try{localStorage.removeItem('gg_game')}catch(_){}S=JSON.parse(JSON.stringify(D))}
const chk=()=>{if(S.scr!=='setup'&&S.scr!=='busy'&&S.start!==today()){finish(true);return true}};
chk();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&chk())draw()});
try{draw()}catch(e){try{localStorage.removeItem('gg_game')}catch(_){}S=JSON.parse(JSON.stringify(D));try{draw()}catch(e2){$('app').innerHTML='<div class="card"><h2>화면을 불러오지 못했어요</h2><button onclick="try{localStorage.removeItem(\'gg_game\');localStorage.removeItem(\'gg_pref\')}catch(e){};location.reload()">저장 데이터 초기화 후 다시 열기</button></div>'}}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
