@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a120e;--bg2:#101a15;--card:#17211b;--tx:#e9f1eb;--sub:#93a69a;--bd:#27352c;--in:#111b15;--bad:#f2625b;--gd:#6fcf97;--p1:#1f8e55;--p2:#15733f;--pg:rgba(0,0,0,.45);--sbg:#1f2c24;--stx:#e9f1eb;--sbd:#30423a;--hero1:#0a3f27;--hero2:#16794a;--seg:#121c16;--segon:#2b3d32;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em;background:linear-gradient(var(--bg1),var(--bg2) 520px) fixed,var(--bg2)}
main{max-width:480px;margin:0 auto;padding:14px 14px 34px}
.hero{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:14px;border-radius:22px;color:#fff;background:radial-gradient(120% 140% at 0 0,rgba(255,255,255,.16),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--hero1),var(--hero2)),var(--hero1);box-shadow:0 10px 26px rgba(12,90,53,.28),inset 0 -3px 0 rgba(224,184,74,.9)}
.hero svg{width:60px;height:60px;border-radius:16px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 6px 14px rgba(0,0,0,.28)}
.hero b{font-size:29px;letter-spacing:2px;font-weight:800}.hero small{display:block;opacity:.88;font-size:13px;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 6px;letter-spacing:.01em}
input,select{width:100%;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--in);color:var(--tx);outline:0;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p1);background:var(--card);box-shadow:0 0 0 4px rgba(27,138,79,.16)}
input:disabled{opacity:.7}
button{width:100%;font-size:17px;font-weight:700;letter-spacing:-.01em;padding:15px;border:0;border-radius:15px;margin-top:12px;color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 8px 18px var(--pg),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .08s,box-shadow .15s,filter .15s}
button:active{transform:scale(.98);filter:brightness(.94);box-shadow:0 3px 8px var(--pg),inset 0 1px 0 rgba(255,255,255,.15)}
button.g{background:var(--sbg);color:var(--stx);border:1px solid var(--sbd);box-shadow:0 1px 2px rgba(16,40,24,.08)}
button.g:active{box-shadow:none}
button.r{background:linear-gradient(180deg,#e5484d,#c4262b);box-shadow:0 8px 18px rgba(196,38,43,.28),inset 0 1px 0 rgba(255,255,255,.22)}
button.o{background:linear-gradient(180deg,#f7c455,#e9a01a);color:#2a1b00;box-shadow:0 8px 18px rgba(233,160,26,.34),inset 0 1px 0 rgba(255,255,255,.45)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{flex:1}
.sub{color:var(--sub);font-size:13px;line-height:1.5}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:800;color:#fff;margin-right:8px;letter-spacing:.01em}
.A{background:linear-gradient(180deg,#2a67dc,#1a4fc0)}.B{background:linear-gradient(180deg,#c9660c,#a94a06)}
.team{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:14px;margin-top:8px;background:var(--in);border:1px solid var(--bd);font-size:15px}
.pi{display:flex;align-items:center;gap:10px;margin-top:10px}.pi input{flex:1}
.dot{width:34px;height:34px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.lose{color:var(--bad);font-weight:800}.win{color:var(--gd);font-weight:800}
.msg{margin-top:12px;padding:13px 14px;border-radius:14px;text-align:center;background:var(--in);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 0;border-bottom:1px solid var(--bd)}tr:last-child td{border:0}td:last-child{text-align:right;font-weight:800}
.err{color:var(--bad);font-size:14px;margin-top:10px;font-weight:700}
.guide{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.7}
.sc td,.sc th{text-align:center;padding:4px 2px;font-size:13px}.sc td:last-child{text-align:center;font-weight:400}.sc input{padding:6px 2px;font-size:15px;text-align:center;border-radius:9px;box-shadow:none}
details summary{font-weight:800;cursor:pointer;margin-bottom:8px}
.spin{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--p1);border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.par{width:auto;flex:1;margin:0;padding:12px 0;font-size:17px;font-weight:700;color:var(--stx);background:var(--sbg);border:1px solid var(--sbd);box-shadow:0 1px 2px rgba(16,40,24,.08)}
.par.on{color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));border-color:transparent;box-shadow:0 6px 14px var(--pg),inset 0 1px 0 rgba(255,255,255,.22)}
.par:active{transform:scale(.97)}
.st{width:48px;height:48px;padding:0;margin:0;font-size:26px;font-weight:500;line-height:1;border-radius:50%;flex:none;background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff;box-shadow:0 6px 14px var(--pg),inset 0 1px 0 rgba(255,255,255,.25)}
.st.m{background:var(--sbg);color:var(--stx);border:1px solid var(--sbd);box-shadow:0 1px 3px rgba(16,40,24,.12)}
.sv{width:78px;text-align:center;line-height:1.1}.sv b{font-size:28px;font-weight:800;display:block;letter-spacing:-.02em}.sv small{font-size:12px;font-weight:700;color:var(--sub)}

function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}

def('QRMath',function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

def('QRPolynomial',function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

});

async function tgRead(file,names){const sample=window.claude?await claude.use('sample'):null;if(!sample)throw{code:'noai'};const K=names.length,blob=await shrink(file),sj=names.map((_,j)=>`${j+1}번째줄타수`).join(',');
  const d=await sample.json(`첨부한 사진은 골프 스코어카드입니다. 선수 ${K}명의 이름은 다음과 같습니다(번호 0~${K-1}): ${names.map((n,i)=>i+':'+n).join(', ')}. 카드에 보이는 선수 줄의 순서(위에서 아래, 또는 왼쪽에서 오른쪽)대로 players에 넣고, 각 줄이 위 이름 중 누구인지 who(0~${K-1})로 알려 주세요. 이름이 보이지 않거나 맞출 수 없으면 who는 null.\n각 홀의 파와 타수를 읽어 아래 JSON만 출력하세요(설명·코드블록 금지).\n{"players":[{"name":"카드에 적힌 이름","who":0}],"holes":[{"par":4,"scores":[${sj}]}]}\nholes는 1번 홀부터 순서대로 전부(보통 18개)입니다. scores는 players 줄 순서와 같아야 합니다. 타수가 '+1','-1' 같은 파 대비 표기이면 파를 더해 실제 타수로 환산하세요. 읽을 수 없는 칸은 null.`,{images:[blob],cache:false});
  let who=(d.players||[]).slice(0,K).map(p=>Number.isInteger(p&&p.who)&&p.who>=0&&p.who<K?p.who:null);const okm=who.length===K&&who.every(v=>v!=null)&&new Set(who).size===K;if(!okm)who=[...Array(K).keys()];
  let miss=0;const H=(d.holes||[]).map(h=>{const par=[3,4,5,6].includes(h.par)?h.par:4,s=Array(K).fill(par);who.forEach((w,j)=>{const v=Number(h.scores&&h.scores[j]);if(!(v>0)){miss++}else s[w]=Math.round(v)});return{par,s}});
  if(H.length<1)throw 0;
  return{holes:H,note:(okm?'':'스코어카드의 이름을 명단과 맞추지 못해 입력한 순서대로 가정했어요. 아래에서 확인해 주세요. ')+(miss?`읽지 못한 ${miss}칸은 파로 채웠어요. 아래에서 확인·수정하세요.`:'')}}
async function analyzeTG(file){if(S.tmT===-1)return analyzeSheet(file);const g=S.tmT,G=S.tm.g[g];if(!window.claude){S.err='사진 분석은 Claude 앱에서 이 앱의 링크를 열었을 때만 쓸 수 있어요.';return draw(true)}
 const prev=S.scr;S.scr='busy';draw();
 try{const r=await tgRead(file,G.names);S.tm.cards[g]={holes:r.holes,note:r.note};S.tm.hid=null;if(S.tm.saved)delete S.tm.saved[g];tmSave();S.err='';S.scr='tm_up';S.tmOpen=S.tmOpen||{};S.tmOpen[g]=true;draw()}
 catch(e){S.scr=prev;S.err=e&&e.code==='not_granted'?'분석 권한을 허용해야 사진을 분석할 수 있어요.':'스코어카드를 읽지 못했어요. 글자가 선명하게 나오도록 다시 촬영하거나 올려 주세요.';draw()}}
async function analyzeSheet(file){const sample=window.claude?await claude.use('sample'):null;if(!sample){S.err='사진 분석은 Claude 앱에서 이 앱의 링크를 열었을 때만 쓸 수 있어요.';return draw(true)}
 const prev=S.scr;S.scr='busy';draw();
 try{const blob=await shrink(file),d=await sample.json(`첨부한 사진은 골프장에서 보내준 대회 결과서(전체 참가자 성적표)입니다. 모든 선수 줄을 읽어 아래 JSON만 출력하세요(설명·코드블록 금지).\n{"players":[{"name":"이름","total":총타수,"out":전반타수 또는 null,"in":후반타수 또는 null,"holes":[1번 홀부터 18번 홀까지 타수] 또는 null}]}\ntotal은 18홀 합계 타수(그로스)입니다. 순위·네트·핸디·상금 칸과 헷갈리지 마세요. 표에 홀별 타수가 없으면 holes는 null입니다. 읽을 수 없는 값은 null입니다.`,{images:[blob],cache:false});
  const rows=(d.players||[]).map(p=>{let t=Number(p.total);const h=Array.isArray(p.holes)&&p.holes.length>=18?p.holes.slice(0,18).map(Number):null,hv=h&&h.every(v=>v>0)?h.map(v=>Math.round(v)):null;if(!(t>0)&&Number(p.out)>0&&Number(p['in'])>0)t=Number(p.out)+Number(p['in']);if(!(t>0)&&hv)t=hv.reduce((a,b)=>a+b,0);return{n:String(p.name||'').trim().slice(0,10),t:t>0?Math.round(t):null,h:hv}}).filter(r=>r.n);
  if(!rows.length)throw 0;const T=S.tm;if(!T.sheet)T.sheet={rows:[]};rows.forEach(r=>{const k=T.sheet.rows.findIndex(x=>tmNorm(x.n)===tmNorm(r.n));if(k>=0)Object.assign(T.sheet.rows[k],{t:r.t,h:r.h});else T.sheet.rows.push(r)});
  T.hid=null;tmSave();S.err='';S.scr='tm_sheet';draw();window.scrollTo(0,0)}
 catch(e){S.scr=prev;S.err=e&&e.code==='not_granted'?'분석 권한을 허용해야 사진을 분석할 수 있어요.':'결과서를 읽지 못했어요. 글자가 선명하게 나오도록 다시 촬영하거나 올려 주세요.';draw()}}

function tmPars(){const T=S.tm;for(const g in T.cards){const H=T.cards[g].holes;if(H.length>=18)return H.slice(0,18).map(q=>q.par)}return null}
function tmPickHid(){const pars=tmPars();if(!pars)return null;const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},half=(lo,hi)=>{const idx=[];for(let i=lo;i<hi;i++)idx.push(i);const by=p=>idx.filter(i=>pars[i]===p);let r=[...sh(by(4)).slice(0,4),...sh(by(3)).slice(0,1),...sh(by(5)).slice(0,1)];if(r.length<6)r=r.concat(sh(idx.filter(i=>!r.includes(i))).slice(0,6-r.length));return r};return half(0,9).concat(half(9,18)).sort((a,b)=>a-b)}

function tmStat(sc,pars){let gross=0,b=0,pa=0,bo=0,db=0;const sp=[];sc.forEach((v,h)=>{const d=v-pars[h];gross+=v;if(v===1)sp.push('홀인원('+(h+1)+'번 홀)');else if(d<=-3)sp.push('알바트로스('+(h+1)+'번 홀)');else if(d===-2)sp.push('이글('+(h+1)+'번 홀)');if(d===-1)b++;else if(d===0)pa++;else if(d===1)bo++;else if(d>=2)db++});
 const o={gross,b,pa,bo,db,sp,holes:sc.length},T=S.tm;if(T.hid&&sc.length>=18){let t=0,ph=0;T.hid.forEach(h=>{t+=sc[h];ph+=pars[h]});const nh=Math.round(Math.max(0,Math.min(24,(t-ph)*1.2))*10)/10;o.nph=nh;o.npn=Math.round((gross-nh)*10)/10;o.hidt=t}return o}
function tmPlayersBase(){const T=S.tm,P=[];T.g.forEach((G,g)=>G.names.forEach((n,i)=>{const c=T.cards[g],p={k:g+'_'+i,g,i,name:n,hc:G.hc[i],has:!!c};if(c){const H=c.holes,st=tmStat(H.map(q=>q.s[i]),H.map(q=>q.par));Object.assign(p,st,{net:st.gross-p.hc})}P.push(p)}));return P}
function tmPlayers(){const T=S.tm,base=tmPlayersBase();if(!T.sheet||!T.sheet.rows||!T.sheet.rows.length)return base;const pars=tmPars(),P=[],used=new Set();
 T.sheet.rows.forEach((r,idx)=>{if(!(r.t>0))return;const m=base.find(p=>!used.has(p.k)&&tmNorm(p.name)===tmNorm(r.n));let p;
  if(m){used.add(m.k);p=Object.assign({},m,{has:true,gross:r.t,net:r.t-m.hc,sheet:true})}else{const hc=r.hc>0?r.hc:TMH;p={k:'s'+idx,g:-1,i:idx,name:r.n,hc,has:true,gross:r.t,net:r.t-hc,sheet:true}}
  if(r.h&&pars){const st=tmStat(r.h,pars);Object.assign(p,st,{gross:r.t,net:r.t-p.hc});if(st.nph!==undefined)p.npn=Math.round((r.t-st.nph)*10)/10}else if(p.nph!==undefined)p.npn=Math.round((p.gross-p.nph)*10)/10;
  P.push(p)});

function tmAwards(P){const have=P.filter(p=>p.has),res={},taken=new Set(),U=!!S.tm.uniq,pool=()=>U?have.filter(p=>!taken.has(p.k)):have,
 give=(nm,L)=>L.forEach(p=>{(res[p.k]=res[p.k]||[]).push(nm);taken.add(p.k)}),
 minBy=(L,f,tb)=>{if(!L.length)return[];const v=Math.min(...L.map(f));let W=L.filter(p=>Math.abs(f(p)-v)<1e-9);if(tb&&W.length>1){const t=Math.min(...W.map(tb));W=W.filter(p=>Math.abs(tb(p)-t)<1e-9)}return W},
 maxBy=(L,f)=>{if(!L.length)return[];const v=Math.max(...L.map(f));return L.filter(p=>Math.abs(f(p)-v)<1e-9)};

 return res}

async function tmZip(str){const u=new TextEncoder().encode(str);if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(u);w.close();const z=new Uint8Array(await new Response(cs.readable).arrayBuffer());return Uint8Array.from([1,...z])}catch(e){}}return Uint8Array.from([0,...u])}

async function tmDecodeBitmap(bmp){for(const k of[1,.75,.5,1.5,.35]){const W=Math.round(bmp.width*k),H=Math.round(bmp.height*k);if(W*H>3e7||W<50||H<50)continue;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.drawImage(bmp,0,0,W,H);const d=x.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000|0;const r=QRD.decode(g,W,H);if(r)return r;await new Promise(r=>setTimeout(r,0))}return null}

const HELP=[
['🧭 Claude vs 크롬(웹브라우저) 한눈에 비교',`<p>이 앱은 <b>두 가지 방법</b>으로 열 수 있어요. 점수 입력과 내기 정산은 어디서 열어도 똑같고, 차이는 아래와 같아요.</p><table class="cmp"><tr><th>기능</th><th>Claude에서 연 앱</th><th>크롬 등 웹브라우저</th></tr><tr><td>홀별 점수 입력, 모든 내기 정산</td><td>○</td><td>○</td></tr><tr><td>스코어만 관리 ✍ 직접 입력 (파·타수·퍼트)</td><td>○</td><td>○</td></tr><tr><td>스코어카드 사진 분석 (촬영·파일 올리기)</td><td>○</td><td>✕</td></tr><tr><td>단체전 조별 카드·골프장 결과서 읽기</td><td>○</td><td>✕</td></tr><tr><td>단체전 안내문·시상결과 이미지 만들기</td><td>○</td><td>○</td></tr><tr><td>시상결과 이미지를 올려 내 이력 저장</td><td>○</td><td>○</td></tr><tr><td>말로 입력 (마이크)</td><td>✕ 막힘</td><td>○</td></tr><tr><td>이미지 복사·공유</td><td>길게 눌러 공유 (복사는 막힐 수 있어요)</td><td>복사·길게 눌러 공유</td></tr><tr><td>필요한 것</td><td>Claude 계정</td><td>없음</td></tr><tr><td>기록이 저장되는 곳</td><td>Claude 화면 전용</td><td>그 브라우저 전용</td></tr></table><p style="margin-top:10px">두 방법의 <b>기록은 서로 따로 저장돼요.</b> 옮기려면 한쪽에서 <b>백업 저장</b> → 다른 쪽에서 <b>백업 복원</b>을 하세요.</p><p><b>추천</b>: 스코어카드를 사진으로 읽어야 하는 <b>운영자</b>는 Claude로, 나머지 <b>동반자</b>는 크롬 링크로 쓰면 돼요.</p>`],
['🤖 Claude로 앱 쓰는 방법',`<ol><li>Claude 앱(또는 claude.ai)에서 이 앱이 들어 있는 대화를 열고, 앱을 눌러 열어요.</li><li>시작 화면에서 평소처럼 이름·날짜·구장을 입력해요.</li><li>사진 분석이 필요한 기능(<b>나중에 일괄 입력</b>, <b>스코어만 관리</b>, 단체전의 <b>조별 스코어카드·골프장 결과서 올리기</b>)에서 <b>📷 카메라로 촬영</b>이나 <b>🖼 파일 올리기</b>를 눌러요. Claude가 점수를 읽어 줘요.</li><li>읽은 점수는 표에서 확인하고 틀린 칸은 고쳐요.</li></ol><p><b>알아두세요</b></p><ul><li>Claude 화면 안에서는 폰의 <b>공유 창과 마이크가 막혀</b> 있어요. 이미지는 <b>길게 눌러 "이미지 공유"</b>로 보내고, 점수는 − / + 로 입력하세요.</li><li>이름·기록은 크롬에서 연 앱과 <b>따로 저장</b>돼요.</li><li>Claude 계정이 있는 사람만 열 수 있어요. 동반자에게는 크롬 링크를 알려 주세요.</li></ul>`],
['🌐 크롬(웹브라우저)으로 앱 쓰는 방법',`<ol><li>크롬(아이폰은 Safari)에서 앱 주소 <b>sikerman6148.github.io/GG/golf.html</b>을 열어요. 카톡으로 받은 링크나 QR코드를 눌러도 돼요. 카톡 안에서 열렸다면 "다른 브라우저로 열기"를 쓰세요.</li><li>홈 화면에 두려면 크롬 ⋮ → 홈 화면에 추가 (아이폰은 공유 버튼 → 홈 화면에 추가).</li><li>가입이나 설치 없이 바로 쓸 수 있어요.</li></ol><p><b>알아두세요</b></p><ul><li><b>스코어카드 사진 분석은 안 돼요.</b> 대신 홀별 점수를 직접 입력하고, <b>스코어만 관리 → ✍ 직접 입력</b>으로 총 타수나 홀별 점수를 기록해요. 단체전 참가자는 <b>점수 직접 입력</b>으로 이력에 저장해요.</li><li>운영자가 공유한 <b>시상결과 이미지</b>는 크롬에서도 올려서 이력에 저장할 수 있어요.</li><li><b>말로 입력</b>은 마이크 허용을 눌러야 하고 인터넷이 필요해요.</li><li>기록은 이 브라우저에 저장돼요. 사이트 데이터를 지우면 사라지니 <b>백업 저장</b>을 해 두세요.</li></ul>`],
['📲 앱 열기·홈 화면에 추가',`<p>링크나 QR코드를 누르면 바로 열려요. 설치나 가입은 필요 없어요. 홈 화면에 아이콘을 만들어 두면 더 편해요.</p><p><b>안드로이드 (Chrome)</b><br>오른쪽 위 ⋮ → 홈 화면에 추가 → 추가</p><p><b>아이폰 (Safari)</b><br>공유 버튼 → 홈 화면에 추가 → 추가</p><p>카톡 안에서 열렸다면 "다른 브라우저로 열기"로 다시 여세요. 골프장은 신호가 약할 수 있으니 라운드 전에 앱을 미리 열어 두고, 라운드 중에는 앱을 끄지 마세요.</p>`],
['👤 처음 한 번: 내 이름 입력',`<p>맨 위 "기록 관리" 카드에 내 이름을 쓰고 <b>입력</b> → <b>확정</b>을 누르세요. 이름은 앱을 처음 쓸 때 <b>한 번만</b> 입력할 수 있고 나중에 바꿀 수 없어요. 평균 타수와 기록이 이 이름으로 쌓여요.</p><ul><li>게임할 때 참가자 이름에도 같은 이름을 쓰면 내 기록으로 저장돼요.</li><li>기록은 <b>삭제</b> 버튼으로 하나씩 지울 수 있어요.</li><li>기록·평균 점수는 <b>⛳ 필드</b>와 <b>🖥 스크린</b>이 따로 관리돼요. 기록 관리 카드의 탭으로 바꿔 볼 수 있어요.</li><li><b>백업 저장</b>으로 이름·이력을 파일로 보관해 두면, 앱을 새로 설치하거나 폰을 바꿔도 <b>백업 복원</b>으로 되살릴 수 있어요.</li></ul>`],
['📝 게임 시작 전 입력 (3단계)',`<ol><li><b>라운딩 정보</b>: 날짜와 구장 이름을 쓰고, <b>필드/스크린</b> 경기 방식, <b>인원수(2~4인)</b>와 <b>명단</b>(내 이름도 직접 입력)을 입력한 뒤 <b>입력</b>으로 확정해요. 바꾸려면 ✏️ 수정을 눌러요. 구장은 이름만 쓰고 오른쪽에서 CC나 GC를 고르면 돼요.</li><li><b>게임 선택</b>: 처음에는 접혀 있어요. <b>🎮 게임 선택</b> 글씨를 누르면 펼쳐져요. 개인대항과 팀별대항에서 각각 한 가지씩 골라요. 하나만 골라도 돼요. 고르면 아래에 게임 설명이 나와요. 접어 두어도 지금 고른 게임은 한 줄로 보여요.</li><li><b>참가자 입력</b>: 게임 화면에는 라운딩 정보에서 입력한 명단이 그대로 나와요. 필요한 금액·핸디만 입력하세요. <b>팀별내기</b>는 명단에서 <b>A조/B조</b>를 골라요.</li></ol><p>마지막으로 <b>게임 시작 (홀별 입력)</b>을 누르세요. 시작이 안 되면 빨간 안내 문구를 따라 하세요.</p>`],
['🎮 게임 종류',`<ul><li><b>개인별순위</b>: 핸디를 뺀 총 타수로 순위를 매기고 순위별 상·벌을 정해요.</li><li><b>타당내기</b>: 1타당 금액으로 두 사람씩 타수 차이만큼 돈을 주고받아요.</li><li><b>팀로테이션 · 벌금게임</b>: 2홀씩 팀을 바꿔 겨루고 진 팀이 벌금을 내요.</li><li><b>팀로테이션 · 벌점게임</b>: 진 팀이 벌점을 받고, 벌점 순으로 정해 둔 총액을 나눠 내요.</li><li><b>팀로테이션 · 빼먹기게임</b>: 미리 모은 상금을 홀마다 이긴 팀이 가져가요.</li><li><b>팀별내기</b>: A팀과 B팀의 합산 타수로 승부하고 상·벌을 정해요.</li></ul><p>팀 게임은 4명이 기본이고, 3명이면 가상 선수가 자동으로 들어가요. 자세한 내용은 아래 <b>3인 게임</b> 항목을 보세요.</p>`],
['👥 3인 게임 (가상 선수)',`<p>팀로테이션(벌금·벌점·빼먹기게임)과 팀별내기는 3명이서도 칠 수 있어요. 개인별순위와 타당내기는 3명 그대로 계산해요.</p><ol><li>라운딩 정보에서 <b>인원수를 3인</b>으로 고르고 3명 이름을 입력해요.</li><li>팀 게임을 고르면 <b>🤖 가상 선수 설정</b>이 나와요. <b>동수·동우·동미</b> 중 한 명을 4번째 선수로 골라요.</li><li>평균 타수는 동수 82타, 동우 90타, 동미 98타가 기본이고, <b>−/+ 로 위아래 4타까지</b> 바꿀 수 있어요 (예: 동수 78~86타).</li></ol><p><b>가상 선수 점수는 이렇게 만들어져요</b></p><ul><li>라운딩 정보의 <b>코스 파</b>(기본 파72 = 파3 4홀·파4 10홀·파5 4홀, 파71·파73은 파3·파5 홀 수를 직접 입력)를 바탕으로, 게임을 시작할 때 <b>파3·파4·파5 종류별로</b> 버디·파·보기·더블 개수를 <b>확률로 무작위</b> 미리 나눠 순서를 섞어 둬요. 버디는 파5에서, 더블 이상은 파3에서 조금 더 잘 나오게 나눠요.</li><li>홀마다 입력자가 <b>파3·파4·파5 버튼</b>을 누르면 그 종류의 점수를 순서대로 꺼내 넣어요. 코스 구성대로 치면 18홀 합계는 평균 타수와 같아요. 9홀 게임은 홀 수에 비례해 줄여요.</li><li><b>동수</b>: 버디 최대 2개, 더블보기 최대 2개, 트리플보기 최대 1개. 나머지 홀은 평균에 맞게 파와 보기.</li><li><b>동우</b>: 버디 최대 1개, 더블보기 최대 4개, 트리플보기 최대 2개. 나머지 홀은 파와 보기.</li><li><b>동미</b>: 버디는 평균 4게임에 1개꼴, 양파(파의 2배 타수)는 최대 3개. 나머지 홀은 파·보기·더블보기.</li><li>홀별 입력 화면에 가상 선수 점수가 미리 들어 있어요. − / + 로 그 홀만 고칠 수 있지만, 고치면 합계가 평균과 달라질 수 있어요.</li><li>실제로 고른 파3·파5 홀 수가 라운딩 정보와 다르면 합계가 평균과 조금 차이 날 수 있어요.</li><li>가상 선수 점수는 <b>홀별 승패 판정에만</b> 쓰여요. 벌금게임·벌점게임·빼먹기게임의 <b>벌금·벌점·상금은 실제 선수끼리만 계산</b>하고, 가상 선수는 내지도 받지도 않아요. (진 팀에 가상 선수가 있으면 실제 선수만 벌금을 내요.)</li><li>가상 선수 점수는 내 기록과 평균 타수에도 들어가지 않아요.</li></ul><p><b>팀 구성</b>: 3명 + 가상 선수가 2명씩 팀을 이루고, 팀로테이션은 2홀마다 짝이 바뀌어요. 팀별내기는 A조·B조 중 한쪽에 가상 선수가 들어가요.</p>`],
['⛳ 홀별 점수 입력, 내기 시작·종료',`<ol><li>파3~파6 중 파를 눌러요.</li><li>선수마다 − / + 로 타수를 맞춰요. 처음 값은 파예요. <b>말로 입력</b>도 돼요(인터넷 필요).</li><li><b>다음 홀로</b>를 누르면 저장되고 다음 홀로 넘어가요.</li><li>오른쪽 위 ◀ ▶ 로 지난 홀을 보고 고칠 수 있어요.</li></ol><p><b>내기 시작·종료</b>: 처음에는 점수만 기록돼요. 내기를 시작할 홀에서 <b>이 홀부터 내기 시작</b>을 누르면 그 홀부터 계산이 시작돼요. 끝낼 때는 <b>여기까지로 결과 확정 (내기 종료)</b>을 누르고 몇 번 홀까지인지 고르세요. 그 뒤 홀은 점수만 입력해요. 시작을 깜빡했다면 ◀ 로 그 홀로 돌아가 누르면 돼요.</p>`],
['🎲 배판과 정산 보기',`<p>내기 중인 홀마다 <b>단판 / 2배판 / 3배판 / 4배판</b>을 고를 수 있어요. 그 홀 금액에 배수가 곱해지고 다음 홀은 다시 단판이에요. (벌금·벌점 게임은 2홀 라운드 중 높은 배수로 계산해요.)</p><ul><li><b>타당내기</b>: <b>홀별 정산 보기</b>로 누가 누구에게 얼마를 줄지 이름 순서대로 볼 수 있어요. 핸디는 시작 전에 정산한 것으로 보고 빼요.</li><li><b>빼먹기게임</b>: <b>홀당 정산 보기</b>로 이긴 팀, 인당 상금, 누적 상금, 상금 잔여액을 봐요. 팀 편성 방식(뽑기·좌타우타·전홀순위·전홀팀유지)은 홀마다 고르고, 비기면 상금이 이월돼요. 상금이 떨어지면 추가할지 물어봐요.</li></ul>`],
['💾 결과 저장과 공유',`<p>종료 홀까지 입력하면 결과 화면이 나와요. <b>게임 종료 · 결과 저장</b> → <b>저장·종료</b>를 누르면 내 기록에 저장돼요.</p><ol><li>시작 화면의 기록 목록에서 <b>보기</b>를 눌러요.</li><li><b>결과 이미지 복사</b>를 누르고 카톡 입력창을 길게 눌러 붙여넣기 하면 이미지로 올라가요.</li><li>점수를 고치려면 <b>결과 관리</b>, 더 이상 못 고치게 하려면 <b>결과 확정하기</b>를 눌러요.</li></ol>`],
['⛳ 코스 파 · 9홀×2 · 구간 결산',`<p>라운딩 정보에서 <b>코스 파</b>를 고르고, 필요하면 <b>9홀×2</b>를 체크해요.</p><ul><li><b>코스 파</b>: 기본은 파72(파3 4홀·파4 10홀·파5 4홀)이고 그대로 두면 따로 입력할 필요가 없어요. 파71·파73이면 파3·파5 홀 수를 입력해요. 가상 선수 점수 계산에 쓰여요.</li><li><b>9홀×2 체크</b>: 같은 9홀을 두 번 돌 때 써요. 체크하면 10번 홀부터(후반 9홀)는 전반 9홀의 파가 같은 순서로 <b>자동으로 들어가서 타수만 입력</b>하면 돼요. 9홀이 끝나면 1회차 결산이 나와요.</li><li>체크하지 않으면 <b>18홀을 이어서</b> 쳐요 (구간 결산 없음). 타당내기는 9번 홀이 끝나면 전반 정산 화면이 나와요.</li></ul><p>구간 결산은 <b>정산 확인용</b>이고 게임은 끝나지 않아요. <b>다음 홀로</b>를 누르면 이어서 쳐요. 끝난 구간 결산은 홀별 입력 화면의 <b>📊 구간 결산</b>에서 다시 볼 수 있고, 최종 결과 화면에서도 <b>구간별 결산</b>으로 볼 수 있어요.</p><p>팀로테이션 게임에서 9홀 구간은 2홀씩 묶으면 9번 홀이 10번 홀과 한 라운드가 돼요. 이 라운드는 10번 홀이 끝나는 다음 구간 결산에 들어가요.</p>`],
['🗺 코스 정보 · 홀별 파 · 홀 지도',`<p>코스 이름(라운딩 정보)을 정하면 그 코스의 <b>홀별 파</b>를 점수 입력 화면에 자동으로 넣어 줘요. 홀마다 파 버튼을 누르지 않아도 돼요.</p><ul><li><b>직접 저장</b>: 라운딩 정보의 <b>⛳ 코스 홀별 파 · 지도</b> 카드에서 <b>✍ 홀별 파 입력</b>을 눌러 홀별 파를 한 번 넣어 두면, 같은 코스를 고를 때 스코어만 관리·홀별 점수 입력·모든 게임에서 홀별 파가 처음 값으로 들어가요.</li><li><b>자동 기억</b>: 따로 입력하지 않아도, 점수를 저장하면(홀별 입력 게임·사진으로 읽은 카드·스코어만 관리) 그때 쓴 홀별 파를 그 코스의 파로 기억해요. 모든 홀이 파4인 기록은 기억하지 않아요.</li><li><b>인터넷에서 찾기</b>: <b>🔎</b>를 누르면 오픈스트리트맵(OpenStreetMap)에서 골프장을 찾아 홀 지도와 홀별 파를 가져와요. 지도에 홀 정보가 올라 있는 코스만 되고 <b>없는 코스도 많아요</b>. 지도에 파가 없으면 홀 길이로 추정한 값을 보여 주니 스코어카드와 맞는지 확인하고 저장하세요. 라운딩 정보를 <b>입력으로 확정할 때 자동으로 한 번</b> 찾아보고(아직 저장된 정보가 없을 때), 이때 구장 이름이 오픈스트리트맵 서버로 전송돼요. 이 기능은 <b>크롬(GitHub) 링크에서만</b> 돼요. Claude 앱 안에서는 인터넷 접속이 막혀 있어요.</li><li><b>홀 지도</b>: 홀별 점수 입력 화면 오른쪽 위의 <b>🗺</b> 버튼을 누르면 그 홀의 지도(티→그린 모양, 벙커·물·그린, 길이)가 나와요. 지도 데이터가 없는 코스는 네이버지도·카카오맵·구글지도에서 골프장을 여는 링크가 나와요. <b>🛰 위성사진</b>은 구글지도의 위성 화면을 열어요.</li><li>저장한 코스 정보는 백업 저장·복원에 같이 들어가요. 코스 카드의 <b>이 코스 정보 지우기</b>로 지울 수 있어요.</li></ul>`],
['📸 나중에 일괄 입력·스코어만 관리',`<p><b>나중에 일괄 입력</b>: 게임 시작 대신 이 버튼으로 시작하면, 경기 후 스코어카드를 촬영하거나 파일로 올려 한 번에 입력해요. 읽은 점수를 확인·수정하고 <b>스코어 최종 확정</b>으로 끝내요.</p><p><b>스코어만 관리</b>: 내기 없이 평균 스코어와 기록만 남기고 싶을 때, 라운딩 정보 아래 <b>스코어만 관리</b>를 눌러 스코어카드를 올려요. 저장하면 기록 관리에 쌓여요.</p><p>사진 분석은 Claude에서 연 앱에서만 돼요. 일반 링크로 연 앱에서는 홀별 입력을 쓰거나, 스코어만 관리의 <b>✍ 직접 입력</b>(파·타수·퍼트)을 쓰세요. 자세한 내용은 <b>📈 스코어 직접 입력 · 퍼트 · 통계</b> 항목을 보세요.</p>`],
['📈 스코어 직접 입력 · 퍼트 · 통계',`<p><b>스코어만 관리 → ✍ 직접 입력</b>은 사진 분석이 안 되는 크롬 등에서도 쓸 수 있어요. 먼저 <b>홀 수(18/9)</b>를 고르고 두 가지 중 하나를 써요.</p><ul><li><b>① 총 타수만 빠르게</b>: 내 총 타수와 코스 파 합계(기본 72)만 입력해요. 가장 빠르지만 홀별 정보가 없어서 <b>퍼트·그린적중 통계에는 들어가지 않아요</b>.</li><li><b>② 홀별로 입력</b>: 아래 순서로 입력해요.</li></ul><p><b>홀별 입력 방법</b></p><ol><li>홀마다 <b>파 · 타수</b> 숫자 양옆의 <b>− / +</b> 버튼으로 맞춰요. 처음에는 <b>파 4 · 타수는 파와 같은 값</b>이 들어 있어요.</li><li><b>퍼트는 처음에 '없음'</b>으로 표시돼요. 퍼트를 기록하려면 표 맨 위의 <b>'퍼트'를 눌러요</b>. 누르면 모든 홀이 <b>퍼트 2</b>로 시작하고 − / +로 바꿀 수 있어요. 입력 중에 <b>'퍼트'를 다시 누르면 전체 없음</b>으로 돌아가요(입력했던 퍼트는 지워져요). 퍼트를 누르지 않고 저장하면 퍼트 정보 없이 저장되고 <b>퍼트·그린적중 통계에서는 빠져요</b>.</li><li>한계: <b>파는 3~6</b>, <b>타수는 1 이상</b>(위쪽 제한 없음), <b>퍼트는 0 이상</b>(위쪽 제한 없음). 한계에 닿으면 − 또는 + 버튼이 잠겨요.</li><li>파를 바꿀 때 타수를 아직 건드리지 않았다면(파와 같은 값이면) <b>타수도 같이</b> 바뀌어요. 이미 고친 타수는 그대로예요.</li><li>다 입력하고 <b>📋 저장 (스코어카드 확인)</b>을 누르면 전반·후반 <b>스코어카드</b>(파·타수·퍼트·그린적중 ●○, 합계)가 나와요.</li><li>틀린 칸은 <b>그 칸을 눌러 바로 고쳐요</b> (파·타수·퍼트 모두). 합계는 바로 다시 계산돼요. 퍼트가 타수보다 많은 홀이 있으면 확정이 막혀요.</li><li><b>✅ 확정</b>을 누르면 스코어가 확정되어 <b>기록에 저장</b>돼요. 확정된 기록은 수정할 수 없어요. 기록 보기에서 홀별 퍼트·그린적중 표도 볼 수 있어요.</li></ol><p><b>게임 중에도 퍼트를 입력할 수 있어요.</b> 홀별 입력 화면에서 <b>사용자 이름과 같은 선수의 타수 입력 줄 바로 아래</b>에 <b>'퍼트 없음'</b> 버튼이 있어요(다른 선수에게는 없어요).</p><ul><li><b>'퍼트'를 눌러야</b> 입력돼요. 누르면 <b>퍼트 2</b>로 시작하고 − / +로 바꿀 수 있어요. 퍼트는 그 홀의 내 타수보다 많을 수 없어요. 다음 홀은 다시 2로 시작해요.</li><li>게임 도중에 처음 누르면 지난 홀의 퍼트는 기본값 2로 채워져요(◀ 이전 홀에서 고칠 수 있어요).</li><li><b>입력 중에 '퍼트'를 누르면 ‘한 번 더 누르면 전체 없음’</b>으로 바뀌고, 한 번 더 누르면 지금까지 입력한 퍼트가 모두 지워져요.</li><li>퍼트를 입력한 게임은 스코어만 관리 기록과 <b>똑같은 방식으로 통계에 들어가요</b>. 퍼트를 누르지 않은 게임은 그린적중률·평균 퍼트에서 빠져요.</li></ul><p><b>기록 관리의 통계</b> (기록 관리 카드 아래 📈 통계 · 필드/스크린 따로)</p><ul><li><b>🏆 베스트 스코어</b>: 전 경기 중 가장 낮은 스코어. <b>😓 워스트 스코어</b>: 가장 높은 스코어.</li><li><b>🎯 평균스코어</b>: <b>최근 20경기에서 최저타와 최고타를 하나씩 빼고</b> 남은 경기(20경기면 18경기)의 평균이에요.</li><li><b>🟢 그린적중률</b>: 위 경기에서 (타수 − 퍼트)가 <b>파−2 이하</b>인 홀(규정 타수로 그린에 올린 홀)의 비율이에요. 따로 입력할 필요는 없어요.</li><li><b>🛡 평균 파세이브율</b>: 한 경기의 <b>파세이브율 = (GIR 실패 홀 중 파 이상으로 막은 홀 수 ÷ GIR 실패 홀 수) × 100%</b>이고, 위 경기들의 파세이브율을 평균해요. GIR(그린적중)은 (타수 − 퍼트)가 파−2 이하인 홀(파3은 1, 파4는 2, 파5는 3 이하)이에요. 그래서 퍼트를 입력한 기록만 계산하고, GIR을 하나도 놓치지 않은 경기는 빠져요.</li><li><b>⛳ 평균 퍼트</b>: 위 경기의 한 경기당 평균 퍼트 수예요.</li><li><b>📊 산포(6σ)</b>: 위 경기 스코어의 <b>표준편차(σ)에 6을 곱한 값</b>이에요. 평균 ±3σ가 내 스코어가 대부분 들어오는 범위예요. (σ는 표본 표준편차예요)</li></ul><p><b>계산 기준</b></p><ul><li><b>18홀 기록만</b> 계산해요 (9홀 기록은 제외).</li><li>총 타수만 저장했거나 사진으로 읽은 기록은 퍼트 정보가 없어서 <b>그린적중률·평균 퍼트에서는 빠져요</b> (스코어 통계에는 들어가요). 화면에 "퍼트를 입력한 N경기 기준"으로 표시돼요.</li><li>경기가 3회 미만이면 최저·최고를 빼지 않아요. 산포는 2경기부터 나와요.</li><li>통계 값 옆의 <b>(N경기)</b>는 그 값을 계산한 경기 수예요. <b>그린적중률·평균 파세이브율·평균 퍼트는 항상</b> 표시하고(퍼트를 입력한 경기만 셈), 베스트·워스트·평균스코어·산포는 <b>18경기가 아닐 때</b> 표시해요.</li><li>기존 <b>평균 타수</b>(모든 경기의 단순 평균)와 <b>평균스코어</b>는 계산 방식이 달라 값이 다를 수 있어요.</li></ul>`],
['🏌️ 단체전',`<p>화면 맨 위의 <b>🏌️ 단체전</b> 탭을 누르세요. <b>🎮 개인·팀 대항</b>(개인대항·팀별대항은 함께 고를 수 있어요)과 <b>화면이 따로</b>이고, 두 탭을 언제든 오갈 수 있어요. 진행 중인 게임이나 단체전 입력은 탭을 바꿔도 그대로 남아요. 단체전 탭에서 날짜·구장을 확정하고 <b>운영자</b>인지 <b>참가자</b>인지 고르세요.</p><p><b>운영자</b></p><ol><li>운영자 이름, <b>대회 요강</b>(대회명, <b>이동</b>(출발 시간·이동 시간 5분 단위), <b>비용</b>(화폐단위 선택), <b>중식 장소</b> 등), 조의 개수, 조별 코스·티오프 시간, 이름(조는 2~4명), 조장·차량운행자(차량 탑승자·캐디백), 평균 핸디(기본 85), <b>비고</b>, <b>대회 규정</b>(기본 규정을 고치거나 추가·삭제)을 입력해요. <b>안내문출력</b>을 누르면 저장되고 안내문 이미지가 만들어져요(이미지를 길게 눌러 카톡으로 공유).</li><li>경기가 끝나면 조별 스코어카드를 <b>촬영하거나 파일로 올려요</b>. 골프장에서 받은 <b>전체 인원 결과서</b>를 올리면 조별 카드보다 <b>우선</b> 반영돼요.</li><li><b>결산결과</b>에서 순위, 버디·파·보기 개수, 홀인원·이글, 시상을 확인하고 시상 칸은 눌러서 고쳐요. <b>시상결과출력</b>으로 이미지를 만들어 공유해요.</li><li>운영자 이름이 내 사용자 이름과 같고 내가 선수로 있으면 전체 인원 결과가 내 이력에 자동 저장돼요.</li></ol><p><b>참가자</b></p><ol><li>우리 조 명단만 입력해요.</li><li>우리 조 스코어카드를 촬영하거나 파일로 올리면 이미지를 <b>길게 눌러 단톡방에 보낼 수 있고</b>, 읽은 점수는 내 이력에 저장돼요. 사진 분석을 못 쓰면 점수를 직접 입력해 저장해요.</li><li>운영자가 공유한 <b>시상결과 이미지</b>는 단체전 탭의 <b>시상결과 저장</b>으로 올리면 내 이력에 저장돼요.</li></ol><p><b>수정해서 다시 보내기</b>: 안내문은 <b>안내문 수정하기</b> 후 안내문출력을 다시 누르고, 시상결과는 고친 뒤 시상결과출력을 다시 누르면 <b>(수정 N차)</b> 표시가 붙은 새 이미지가 만들어져요.</p><p>신페리오는 몰래 정한 12개 홀 점수로 그날 핸디를 계산하는 방식이에요. 스코어카드·결과서 사진 분석은 Claude에서 연 앱에서만 돼요.</p>`],
['❓ 자주 묻는 질문',`<ul><li><b>점수를 잘못 넣었어요</b>: ◀ 로 그 홀로 돌아가 고쳐요. 저장 후에는 기록 보기의 결과 관리에서 고쳐요.</li><li><b>게임을 기록 없이 닫고 싶어요</b>: 화면 맨 아래 <b>중도 종료</b>를 눌러요.</li><li><b>마이크가 안 돼요</b>: 마이크 허용을 누르고 인터넷을 확인하세요. 안 되면 − / + 로 입력해요.</li><li><b>앱이 예전 화면이에요</b>: 앱을 완전히 끄고 다시 열거나 화면을 아래로 당겨 새로고침하세요.</li><li><b>기록이 사라졌어요</b>: 기록은 각자 폰에만 저장돼요. 브라우저의 사이트 데이터를 지우면 함께 지워져요.</li></ul>`]];

/* 홀 구성: 9+9(다른 9홀 두 개) · 6+6+6(다른 6홀 세 개) · 9x2(같은 9홀 두 번). 구간이 끝날 때마다 그 구간 결산을 볼 수 있음(게임은 계속) */
const LAYS={'18':'18홀 연속','9x2':'18홀 (9홀×2)'};
const layV=()=>S.lay==='9x2'?'9x2':'18',segSz=()=>9;
function segEnds(N){N=N||Math.max(1,Number(S.rounds)||18);if(layV()!=='9x2')return[N];const z=segSz(),e=[];for(let k=z;k<N;k+=z)e.push(k);e.push(N);return e}
function segList(){const e=segEnds();return e.map((b,i)=>[i?e[i-1]:0,b])}
function segName(i){const L=layV(),[a,b]=segList()[i]||[0,0],n=segList().length;if(n<2)return '전체';if(L==='9x2')return (i+1)+'회차 9홀';if(L==='9+9'&&n===2)return (i?'후반':'전반')+' 9홀';return (i+1)+'구간'}
const segHit=()=>{const h=S.holes.length,e=segEnds();return e.indexOf(h)>=0&&h<e[e.length-1]&&S.bs!=null&&S.bs<=h&&!S.batch};

function crsLearn(pars){if(!S.course||!pars||pars.length<9)return;if(pars.filter(p=>p!==4).length<2)return;const k=crsKey();if(!k)return;const r=CRS[k];
 if(r&&(r.s==='manual'||(r.s==='osm'&&r.p&&r.p.length&&r.p.every(Boolean))))return;if(r&&r.p&&r.p.length>pars.length&&r.s==='learned')return;
 CRS[k]=Object.assign({},r||{},{n:S.course,p:pars.slice(0,18),s:'learned',t:Date.now()});crsSaveAll()}
const geoD=(a,b)=>{const R=6371000,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t,x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const geoLen=g=>{let L=0;for(let i=1;i<g.length;i++)L+=geoD(g[i-1],g[i]);return L};
function geoPD(p,g){const kx=Math.cos(p[0]*Math.PI/180)*111320,ky=110540,X=q=>[(q[1]-p[1])*kx,(q[0]-p[0])*ky];let m=1e9;for(let i=1;i<g.length;i++){const a=X(g[i-1]),b=X(g[i]),dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((-a[0])*dx+(-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));m=Math.min(m,Math.hypot(a[0]+t*dx,a[1]+t*dy))}return m}
const geoSimp=(g,n)=>{const r=q=>[Math.round(q[0]*1e5)/1e5,Math.round(q[1]*1e5)/1e5];if(g.length<=n)return g.map(r);const o=[];for(let i=0;i<n;i++)o.push(r(g[Math.round(i*(g.length-1)/(n-1))]));return o};
/* OpenStreetMap 홀 데이터(golf=hole: ref·par, tee→green 선, green·fairway·tee·bunker·water 면)를 코스 정보로 바꾼다 */
function crsBuild(E,c){const holes={},feats=[];let dup=false;
 E.forEach(e=>{if(!e.geometry||!e.tags)return;const g=e.geometry.map(p=>[p.lat,p.lon]);if(e.tags.golf==='hole'){const n=parseInt(e.tags.ref,10);if(!(n>=1&&n<=36)||g.length<2)return;if(holes[n])dup=true;else holes[n]={g,tags:e.tags}}else if(g.length>=3)feats.push({k:e.tags.golf,g})});
 const ns=Object.keys(holes).map(Number).sort((a,b)=>a-b);
 if(!ns.length)return{err:'이 골프장에는 홀 정보(지도 데이터)가 올라 있지 않아요.'};
 if(dup||ns[ns.length-1]>18)return{err:'27·36홀처럼 여러 코스가 한 골프장으로 묶여 있어서 자동으로 나누지 못했어요.'};
 const N=ns[ns.length-1]>9?18:9,p=Array(N).fill(null),sg=Array(N).fill(null),inf=[],h={};
 const KM={green:'g',fairway:'f',tee:'t',bunker:'b',water_hazard:'w',lateral_water_hazard:'w'};
 ns.forEach(n=>{const H=holes[n],L=Math.round(geoLen(H.g));let par=parseInt(H.tags.par,10);if(!(par>=3&&par<=6)){par=NaN;for(const k in H.tags)if(/^par:/.test(k)){const v=parseInt(H.tags[k],10);if(v>=3&&v<=6){par=v;break}}}
