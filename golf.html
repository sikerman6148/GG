<title>BG-Betting Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%238FD3F4'/%3E%3Cpath d='M0,70 Q54,50 108,70 L108,108 L0,108z' fill='%2343A047'/%3E%3Cpath d='M44,70 L64,70 L58,92 L50,92z' fill='%23E0A526'/%3E%3Ccircle cx='54' cy='52' r='20' fill='%23fff' stroke='%23CFD8DC' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{--bg1:#bfe9ff;--bg2:#d7f2d4;--card:#fff;--tx:#1d2b1f;--sub:#68796b;--bd:#cfe0cf;--in:#f2f7f1;--bad:#d32f2f;--gd:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f2233;--bg2:#12251a;--card:#1d2a21;--tx:#eaf3ea;--sub:#9db0a0;--bd:#33463a;--in:#142019;--bad:#ef5350;--gd:#81c784}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(var(--bg1),var(--bg2)) fixed}
main{max-width:480px;margin:0 auto;padding:14px 14px 30px}
.hero{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#66bb6a,#1b5e20);box-shadow:0 8px 0 #134a17,0 14px 22px rgba(0,40,0,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.hero svg{width:62px;height:62px;border-radius:16px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.hero b{font-size:30px;letter-spacing:3px;text-shadow:0 3px 0 rgba(0,0,0,.25)}.hero small{display:block;opacity:.9;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 0 rgba(0,70,0,.12),0 12px 20px rgba(0,50,0,.12),inset 0 2px 0 rgba(255,255,255,.6)}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
input,select{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--in);color:var(--tx);box-shadow:inset 0 3px 6px rgba(0,0,0,.14);outline:0}
input:focus{border-color:#43a047}
button{width:100%;font-size:18px;font-weight:700;padding:15px;border:0;border-radius:14px;margin-top:14px;color:#fff;background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 6px 0 #1b5e20,0 10px 16px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #1b5e20}
