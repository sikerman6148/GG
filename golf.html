<title>BG-Betting Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%238FD3F4'/%3E%3Cpath d='M0,70 Q54,50 108,70 L108,108 L0,108z' fill='%2343A047'/%3E%3Cpath d='M44,70 L64,70 L58,92 L50,92z' fill='%23E0A526'/%3E%3Ccircle cx='54' cy='52' r='20' fill='%23fff' stroke='%23CFD8DC' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bg1:#bfe9ff;--bg2:#d7f2d4;--card:#fff;--tx:#1d2b1f;--sub:#68796b;--bd:#cfe0cf;--in:#f2f7f1;--bad:#d32f2f;--gd:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f2233;--bg2:#12251a;--card:#1d2a21;--tx:#eaf3ea;--sub:#9db0a0;--bd:#33463a;--in:#142019;--bad:#ef5350;--gd:#81c784}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(var(--bg1),var(--bg2)) fixed}
main{max-width:480px;margin:0 auto;padding:14px 14px 30px}
.hero{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#43a047,#1b5e20);box-shadow:0 8px 0 #134a17,0 14px 22px rgba(0,40,0,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.hero svg{width:62px;height:62px;border-radius:16px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.hero b{font-size:30px;letter-spacing:3px;text-shadow:0 3px 0 rgba(0,0,0,.25)}.hero small{display:block;opacity:.9;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 0 rgba(0,70,0,.12),0 12px 20px rgba(0,50,0,.12),inset 0 2px 0 rgba(255,255,255,.6)}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
input,select{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--in);color:var(--tx);box-shadow:inset 0 3px 6px rgba(0,0,0,.14);outline:0}
input:focus{border-color:#43a047}

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}

	gexp : function(n) {
	
		while (n < 0) {

		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};

	QRMath.EXP_TABLE[i] = 1 << i;

	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

});

 return `<div class="card"><h2>📊 단체전 결산결과</h2><div class="sub">${T.date} · ${T.course} · 운영자 ${T.op||'-'} · 올린 조 ${Object.keys(T.cards).length}/${T.g.length} · ${L.length}명</div>${none.length?`<div class="err">스코어카드가 없는 선수 ${none.length}명은 제외했어요: ${none.slice(0,6).map(p=>p.name+'('+(p.g+1)+'조)').join(', ')}${none.length>6?' 외':''}</div>`:''}<label>순위 기준</label><select onchange="tmSort(this.value)"><option value="gross" ${T.sort==='gross'||!T.sort?'selected':''}>타수순 (점수가 낮은 순)</option><option value="net" ${T.sort==='net'?'selected':''}>핸디 감안순 (점수 − 핸디)</option><option value="np" ${T.sort==='np'?'selected':''}>신페리오순</option></select><label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" style="width:22px;height:22px;flex:none;padding:0" ${T.uniq?'checked':''} onchange="tmUniq(this.checked)"> 한 사람이 한 가지 상만 받기 (앞선 상 우선)</label></div>`
 +`<div class="card"><div style="overflow-x:auto"><table class="tmt"><tr><th>순위</th><th>이름</th><th>핸디</th><th>점수</th><th>핸디감안</th><th>신페리오 네트(핸디)</th><th>버디</th><th>파</th><th>보기</th><th>더블+</th><th>특이사항</th><th>시상내용 (눌러서 수정)</th></tr>`
 +L.map(p=>`<tr><td>${p.rank<=3?medal[p.rank-1]:p.rank}</td><td>${p.name} <span class="sub">${p.g+1}조</span></td><td>${p.hc}</td><td><b>${p.gross}</b></td><td>${fmt(p.net)}</td><td>${p.npn!==undefined?p.npn+' ('+p.nph+')':'-'}</td><td>${p.b}</td><td>${p.pa}</td><td>${p.bo}</td><td>${p.db}</td><td>${p.sp.length?'<b style="color:var(--bad)">'+p.sp.join(', ')+'</b>':'-'}</td><td><input value="${tmAwText(p,aw).replace(/"/g,'&quot;')}" placeholder="시상 없음" onchange="tmOv('${p.k}',this.value)"></td></tr>`).join('')
 +`</table></div><div class="sub" style="margin-top:8px">← 옆으로 밀어서 모두 볼 수 있어요. 시상 칸을 눌러 지우거나 새 상을 직접 쓰면 돼요.</div><button class="g" onclick="tmOvReset()">↺ 시상을 자동값으로 되돌리기</button></div>`
 +`<div class="card"><h2>🎲 신페리오 방식</h2>${T.hid?`<div class="sub">히든 12홀: <b>${T.hid.map(h=>h+1).join(', ')}번 홀</b> (파4 8개, 파3·파5 각 2개, 전·후반 균등)</div>`:'<div class="sub">18홀 스코어카드가 있어야 계산돼요.</div>'}<div class="sub" style="margin-top:6px;line-height:1.6">핸디 = (히든 12홀 합계 × 1.5 − 72) × 0.8 (히든 파 합계 48 기준), 최대 24.0 (20오버 한도) · 네트 = 총 타수 − 핸디 · 네트가 같으면 핸디가 낮은 사람이 우승해요.</div><button class="g" onclick="tmHid()">🎲 히든 홀 다시 뽑기</button></div>`
 +`<div class="card"><h2>📤 공유·저장</h2>${S.tmMsg?`<div class="msg">${S.tmMsg}</div>`:''}<button onclick="tmImg()">🖼 시상결과출력 (이미지 복사)</button>${tmSaveNote()}${S.tmImgUrl?`<img src="${S.tmImgUrl}" style="width:100%;margin-top:10px;border-radius:8px">`:''}</div>`
 +`<button class="g" onclick="S.scr='tm_up';draw()">← 스코어카드 올리기로</button><button class="g" onclick="tmBack()">← 초기 화면으로</button>`};
function infoConfirm(){snap();const miss=[];if(!S.date)miss.push('날짜');if(!S.course)miss.push('구장명');if(miss.length){S.infoOk=false;S.infoErr=miss.join('·')+'을(를) 입력해 주세요.'}else{S.infoOk=true;S.infoErr='';S.err=''}draw(true)}
function infoEdit(){snap();S.infoOk=false;S.infoErr='';draw(true)}
const HELP=[
['📲 앱 열기·홈 화면에 추가',`<p>링크나 QR코드를 누르면 바로 열려요. 설치나 가입은 필요 없어요. 홈 화면에 아이콘을 만들어 두면 더 편해요.</p><p><b>안드로이드 (Chrome)</b><br>오른쪽 위 ⋮ → 홈 화면에 추가 → 추가</p><p><b>아이폰 (Safari)</b><br>공유 버튼 → 홈 화면에 추가 → 추가</p><p>카톡 안에서 열렸다면 "다른 브라우저로 열기"로 다시 여세요. 골프장은 신호가 약할 수 있으니 라운드 전에 앱을 미리 열어 두고, 라운드 중에는 앱을 끄지 마세요.</p>`],
['👤 처음 한 번: 내 이름 입력',`<p>맨 위 "기록 관리" 카드에 내 이름을 쓰고 <b>입력</b> → <b>확정</b>을 누르세요. 이름은 앱을 처음 쓸 때 <b>한 번만</b> 입력할 수 있고 나중에 바꿀 수 없어요. 평균 타수와 기록이 이 이름으로 쌓여요.</p><ul><li>게임할 때 참가자 이름에도 같은 이름을 쓰면 내 기록으로 저장돼요.</li><li>기록은 <b>삭제</b> 버튼으로 하나씩 지울 수 있어요.</li><li><b>백업 저장</b>으로 이름·이력을 파일로 보관해 두면, 앱을 새로 설치하거나 폰을 바꿔도 <b>백업 복원</b>으로 되살릴 수 있어요.</li></ul>`],
['📝 게임 시작 전 입력 (3단계)',`<ol><li><b>라운딩 정보</b>: 날짜와 구장 이름을 쓰고 <b>입력</b>으로 확정해요. 구장은 이름만 쓰고 오른쪽에서 CC나 GC를 고르면 돼요.</li><li><b>게임 선택</b>: 개인대항과 팀별대항에서 각각 한 가지씩 골라요. 하나만 골라도 돼요. 고르면 아래에 게임 설명이 나와요.</li><li><b>참가자 입력</b>: 참가 인원과 이름, 필요한 금액·핸디를 입력해요.</li></ol><p>마지막으로 <b>게임 시작 (홀별 입력)</b>을 누르세요. 시작이 안 되면 빨간 안내 문구를 따라 하세요.</p>`],
['🎮 게임 종류',`<ul><li><b>개인별순위</b>: 핸디를 뺀 총 타수로 순위를 매기고 순위별 상·벌을 정해요.</li><li><b>타당내기</b>: 1타당 금액으로 두 사람씩 타수 차이만큼 돈을 주고받아요.</li><li><b>팀로테이션 · 벌금게임</b>: 2홀씩 팀을 바꿔 겨루고 진 팀이 벌금을 내요.</li><li><b>팀로테이션 · 벌점게임</b>: 진 팀이 벌점을 받고, 벌점 순으로 정해 둔 총액을 나눠 내요.</li><li><b>팀로테이션 · 상금게임</b>: 미리 모은 상금을 홀마다 이긴 팀이 가져가요.</li><li><b>팀별내기</b>: A팀과 B팀의 합산 타수로 승부하고 상·벌을 정해요.</li></ul><p>팀 게임은 4명이 기본이고, 3명이면 가상 선수가 자동으로 들어가요.</p>`],
['⛳ 홀별 점수 입력, 내기 시작·종료',`<ol><li>파3~파6 중 파를 눌러요.</li><li>선수마다 − / + 로 타수를 맞춰요. 처음 값은 파예요. <b>말로 입력</b>도 돼요(인터넷 필요).</li><li><b>다음 홀로</b>를 누르면 저장되고 다음 홀로 넘어가요.</li><li>오른쪽 위 ◀ ▶ 로 지난 홀을 보고 고칠 수 있어요.</li></ol><p><b>내기 시작·종료</b>: 처음에는 점수만 기록돼요. 내기를 시작할 홀에서 <b>이 홀부터 내기 시작</b>을 누르면 그 홀부터 계산이 시작돼요. 끝낼 때는 <b>여기까지로 결과 확정 (내기 종료)</b>을 누르고 몇 번 홀까지인지 고르세요. 그 뒤 홀은 점수만 입력해요. 시작을 깜빡했다면 ◀ 로 그 홀로 돌아가 누르면 돼요.</p>`],
['🎲 배판과 정산 보기',`<p>내기 중인 홀마다 <b>단판 / 2배판 / 3배판 / 4배판</b>을 고를 수 있어요. 그 홀 금액에 배수가 곱해지고 다음 홀은 다시 단판이에요. (벌금·벌점 게임은 2홀 라운드 중 높은 배수로 계산해요.)</p><ul><li><b>타당내기</b>: <b>홀별 정산 보기</b>로 누가 누구에게 얼마를 줄지 이름 순서대로 볼 수 있어요. 핸디는 시작 전에 정산한 것으로 보고 빼요.</li><li><b>상금게임</b>: <b>홀당 정산 보기</b>로 이긴 팀, 인당 상금, 누적 상금, 상금 잔여액을 봐요. 팀 편성 방식(뽑기·좌타우타·전홀순위·전홀팀유지)은 홀마다 고르고, 비기면 상금이 이월돼요. 상금이 떨어지면 추가할지 물어봐요.</li></ul>`],
['💾 결과 저장과 공유',`<p>종료 홀까지 입력하면 결과 화면이 나와요. <b>게임 종료 · 결과 저장</b> → <b>저장·종료</b>를 누르면 내 기록에 저장돼요.</p><ol><li>시작 화면의 기록 목록에서 <b>보기</b>를 눌러요.</li><li><b>결과 이미지 복사</b>를 누르고 카톡 입력창을 길게 눌러 붙여넣기 하면 이미지로 올라가요.</li><li>점수를 고치려면 <b>결과 관리</b>, 더 이상 못 고치게 하려면 <b>결과 확정하기</b>를 눌러요.</li></ol>`],
['📸 나중에 일괄 입력·스코어만 관리',`<p><b>나중에 일괄 입력</b>: 게임 시작 대신 이 버튼으로 시작하면, 경기 후 스코어카드를 촬영하거나 파일로 올려 한 번에 입력해요. 읽은 점수를 확인·수정하고 <b>스코어 최종 확정</b>으로 끝내요.</p><p><b>스코어만 관리</b>: 내기 없이 평균 스코어와 기록만 남기고 싶을 때, 라운딩 정보 아래 <b>스코어만 관리</b>를 눌러 스코어카드를 올려요. 저장하면 기록 관리에 쌓여요.</p><p>사진 분석은 Claude에서 연 앱에서만 돼요. 일반 링크로 연 앱에서는 홀별 입력을 쓰세요.</p>`],
['🏌️ 단체전',`<p><b>운영자</b>는 시작 화면의 <b>단체전</b> 버튼으로 여러 조의 스코어카드를 모아 순위와 시상을 정해요.</p><ol><li>운영자 이름, 조의 개수, 조별 이름과 평균 핸디(기본 80, − / + 로 조정)를 입력해요.</li><li>경기가 끝나면 조별로 스코어카드를 <b>카메라로 촬영</b>하거나 <b>파일로 올려요</b>.</li><li><b>결산결과</b>에서 순위, 버디·파·보기 개수, 홀인원·이글, 시상을 확인하고 시상 칸은 눌러서 고쳐요.</li><li><b>시상결과출력</b>으로 이미지를 복사해 카톡으로 공유해요. 이미지 아래 QR코드에 결과가 들어 있어요.</li></ol><p>운영자 이름이 내 사용자 이름과 같고 명단에 내가 있으면 결과가 내 이력에 자동 저장돼요.</p><p><b>참가자</b>는 시작 화면의 <b>단체전 시상결과 저장</b>에서 공유받은 이미지를 올리면 내 이력에 저장돼요. 카톡에서 이미지를 받을 때 <b>원본</b>으로 받으면 가장 잘 읽혀요.</p><p>신페리오는 몰래 정한 12개 홀 점수로 그날 핸디를 계산하는 방식이에요. 스코어카드 사진 분석은 Claude에서 연 앱에서만 돼요.</p>`],
['❓ 자주 묻는 질문',`<ul><li><b>점수를 잘못 넣었어요</b>: ◀ 로 그 홀로 돌아가 고쳐요. 저장 후에는 기록 보기의 결과 관리에서 고쳐요.</li><li><b>게임을 기록 없이 닫고 싶어요</b>: 화면 맨 아래 <b>중도 종료</b>를 눌러요.</li><li><b>마이크가 안 돼요</b>: 마이크 허용을 누르고 인터넷을 확인하세요. 안 되면 − / + 로 입력해요.</li><li><b>앱이 예전 화면이에요</b>: 앱을 완전히 끄고 다시 열거나 화면을 아래로 당겨 새로고침하세요.</li><li><b>기록이 사라졌어요</b>: 기록은 각자 폰에만 저장돼요. 브라우저의 사이트 데이터를 지우면 함께 지워져요.</li></ul>`]];
function openHelp(){snap();tmSnap();S.help=true;draw();window.scrollTo(0,0)}
function closeHelp(){S.help=false;draw(true)}
const helpScreen=()=>`<div class="card"><h2>📖 사용 방법</h2><div class="sub">궁금한 항목을 눌러 펼쳐 보세요.</div></div>`+HELP.map(([t,b],i)=>`<div class="card" style="padding:0"><details ${i===0?'open':''}><summary style="padding:14px 16px;font-weight:800;font-size:16px">${t}</summary><div style="padding:0 16px 14px;line-height:1.7;font-size:15px">${b}</div></details></div>`).join('')+`<button class="g" onclick="closeHelp()">← 돌아가기</button>`;
