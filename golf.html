:root{color-scheme:light dark;--bg1:#e6f0e8;--bg2:#f6f8f6;--card:#fff;--tx:#13201a;--sub:#667a6f;--bd:#e0e8e2;--in:#f3f6f3;--bad:#d92d20;--gd:#1b7a3e;

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a120e;--bg2:#101a15;--card:#17211b;--tx:#e9f1eb;--sub:#93a69a;--bd:#27352c;--in:#111b15;--bad:#f2625b;--gd:#6fcf97;--p1:#1f8e55;--p2:#15733f;--pg:rgba(0,0,0,.45);--sbg:#1f2c24;--stx:#e9f1eb;--sbd:#30423a;--hero1:#0a3f27;--hero2:#16794a;--seg:#121c16;--segon:#2b3d32;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em;background:linear-gradient(var(--bg1),var(--bg2) 520px) fixed,var(--bg2)}
main{max-width:480px;margin:0 auto;padding:14px 14px 34px}
.hero{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:14px;border-radius:22px;color:#fff;background:radial-gradient(120% 140% at 0 0,rgba(255,255,255,.16),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--hero1),var(--hero2)),var(--hero1);box-shadow:0 10px 26px rgba(12,90,53,.28),inset 0 -3px 0 rgba(224,184,74,.9)}
.hero svg{width:60px;height:60px;border-radius:16px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 6px 14px rgba(0,0,0,.28)}
.hero b{font-size:29px;letter-spacing:2px;font-weight:800}.hero small{display:block;opacity:.88;font-size:13px;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 6px;letter-spacing:.01em}
input,select{width:100%;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--in);color:var(--tx);outline:0;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p1);background:var(--card);box-shadow:0 0 0 4px rgba(27,138,79,.16)}
input:disabled{opacity:.7}
button{width:100%;font-size:17px;font-weight:700;letter-spacing:-.01em;padding:15px;border:0;border-radius:15px;margin-top:12px;color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 8px 18px var(--pg),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .08s,box-shadow .15s,filter .15s}
button:active{transform:scale(.98);filter:brightness(.94);box-shadow:0 3px 8px var(--pg),inset 0 1px 0 rgba(255,255,255,.15)}
button.g{background:var(--sbg);color:var(--stx);border:1px solid var(--sbd);box-shadow:0 1px 2px rgba(16,40,24,.08)}
button.g:active{box-shadow:none}
button.r{background:linear-gradient(180deg,#e5484d,#c4262b);box-shadow:0 8px 18px rgba(196,38,43,.28),inset 0 1px 0 rgba(255,255,255,.22)}
button.wt{background:#fff;color:#1d2b1f;border:1px solid #c3cdc7;box-shadow:0 1px 3px rgba(16,40,24,.15)}
button.wt:active{box-shadow:none}
button.o{background:linear-gradient(180deg,#f7c455,#e9a01a);color:#2a1b00;box-shadow:0 8px 18px rgba(233,160,26,.34),inset 0 1px 0 rgba(255,255,255,.45)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{flex:1}
.sub{color:var(--sub);font-size:13px;line-height:1.5}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:800;color:#fff;margin-right:8px;letter-spacing:.01em}
.A{background:linear-gradient(180deg,#2a67dc,#1a4fc0)}.B{background:linear-gradient(180deg,#c9660c,#a94a06)}
.team{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:14px;margin-top:8px;background:var(--in);border:1px solid var(--bd);font-size:15px}
.pi{display:flex;align-items:center;gap:10px;margin-top:10px}.pi input{flex:1}
.dot{width:34px;height:34px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.lose{color:var(--bad);font-weight:800}.win{color:var(--gd);font-weight:800}
.msg{margin-top:12px;padding:13px 14px;border-radius:14px;text-align:center;background:var(--in);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 0;border-bottom:1px solid var(--bd)}tr:last-child td{border:0}td:last-child{text-align:right;font-weight:800}
.err{color:var(--bad);font-size:14px;margin-top:10px;font-weight:700}
.guide{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.7}
.sc td,.sc th{text-align:center;padding:4px 2px;font-size:13px}.sc td:last-child{text-align:center;font-weight:400}.sc input{padding:6px 2px;font-size:15px;text-align:center;border-radius:9px;box-shadow:none}
details summary{font-weight:800;cursor:pointer;margin-bottom:8px}
.spin{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--p1);border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.par{width:auto;flex:1;margin:0;padding:12px 0;font-size:17px;font-weight:700;color:var(--stx);background:var(--sbg);border:1px solid var(--sbd);box-shadow:0 1px 2px rgba(16,40,24,.08)}
.par.on{color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));border-color:transparent;box-shadow:0 6px 14px var(--pg),inset 0 1px 0 rgba(255,255,255,.22)}
.par:active{transform:scale(.97)}
.st{width:48px;height:48px;padding:0;margin:0;font-size:26px;font-weight:500;line-height:1;border-radius:50%;flex:none;background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff;box-shadow:0 6px 14px var(--pg),inset 0 1px 0 rgba(255,255,255,.25)}
.st.m{background:var(--sbg);color:var(--stx);border:1px solid var(--sbd);box-shadow:0 1px 3px rgba(16,40,24,.12)}

function tmPars(){const T=S.tm;for(const g in T.cards){const H=T.cards[g].holes;if(H.length>=18)return H.slice(0,18).map(q=>q.par)}return null}
function tmPickHid(){const pars=tmPars();if(!pars)return null;const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},half=(lo,hi)=>{const idx=[];for(let i=lo;i<hi;i++)idx.push(i);const by=p=>idx.filter(i=>pars[i]===p);let r=[...sh(by(4)).slice(0,4),...sh(by(3)).slice(0,1),...sh(by(5)).slice(0,1)];if(r.length<6)r=r.concat(sh(idx.filter(i=>!r.includes(i))).slice(0,6-r.length));return r};return half(0,9).concat(half(9,18)).sort((a,b)=>a-b)}

function tmStat(sc,pars){let gross=0,b=0,pa=0,bo=0,db=0;const sp=[];sc.forEach((v,h)=>{const d=v-pars[h];gross+=v;if(v===1)sp.push('홀인원('+(h+1)+'번 홀)');else if(d<=-3)sp.push('알바트로스('+(h+1)+'번 홀)');else if(d===-2)sp.push('이글('+(h+1)+'번 홀)');if(d===-1)b++;else if(d===0)pa++;else if(d===1)bo++;else if(d>=2)db++});
 const o={gross,b,pa,bo,db,sp,holes:sc.length},T=S.tm;if(T.hid&&sc.length>=18){let t=0,ph=0;T.hid.forEach(h=>{t+=sc[h];ph+=pars[h]});const nh=Math.round(Math.max(0,Math.min(24,(t-ph)*1.2))*10)/10;o.nph=nh;o.npn=Math.round((gross-nh)*10)/10;o.hidt=t}return o}
function tmPlayersBase(){const T=S.tm,P=[];T.g.forEach((G,g)=>G.names.forEach((n,i)=>{const c=T.cards[g],p={k:g+'_'+i,g,i,name:n,hc:G.hc[i],has:!!c};if(c){const H=c.holes,st=tmStat(H.map(q=>q.s[i]),H.map(q=>q.par));Object.assign(p,st,{net:st.gross-p.hc})}P.push(p)}));return P}
function tmPlayers(){const T=S.tm,base=tmPlayersBase();if(!T.sheet||!T.sheet.rows||!T.sheet.rows.length)return base;const pars=tmPars(),P=[],used=new Set();
 T.sheet.rows.forEach((r,idx)=>{if(!(r.t>0))return;const m=base.find(p=>!used.has(p.k)&&tmNorm(p.name)===tmNorm(r.n));let p;

  P.push(p)});

function tmAwards(P){const have=P.filter(p=>p.has),res={},taken=new Set(),U=!!S.tm.uniq,pool=()=>U?have.filter(p=>!taken.has(p.k)):have,
 give=(nm,L)=>L.forEach(p=>{(res[p.k]=res[p.k]||[]).push(nm);taken.add(p.k)}),
 minBy=(L,f,tb)=>{if(!L.length)return[];const v=Math.min(...L.map(f));let W=L.filter(p=>Math.abs(f(p)-v)<1e-9);if(tb&&W.length>1){const t=Math.min(...W.map(tb));W=W.filter(p=>Math.abs(tb(p)-t)<1e-9)}return W},

async function tmZip(str){const u=new TextEncoder().encode(str);if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(u);w.close();const z=new Uint8Array(await new Response(cs.readable).arrayBuffer());return Uint8Array.from([1,...z])}catch(e){}}return Uint8Array.from([0,...u])}

async function tmDecodeBitmap(bmp){for(const k of[1,.75,.5,1.5,.35]){const W=Math.round(bmp.width*k),H=Math.round(bmp.height*k);if(W*H>3e7||W<50||H<50)continue;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.drawImage(bmp,0,0,W,H);const d=x.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000|0;const r=QRD.decode(g,W,H);if(r)return r;await new Promise(r=>setTimeout(r,0))}return null}

const HELP=[
['🧭 Claude vs 크롬(웹브라우저) 한눈에 비교',`<p>이 앱은 <b>두 가지 방법</b>으로 열 수 있어요. 점수 입력과 내기 정산은 어디서 열어도 똑같고, 차이는 아래와 같아요.</p><table class="cmp"><tr><th>기능</th><th>Claude에서 연 앱</th><th>크롬 등 웹브라우저</th></tr><tr><td>홀별 점수 입력, 모든 내기 정산</td><td>○</td><td>○</td></tr><tr><td>내 스코어 ✍ 직접 입력 (파·타수·퍼트)</td><td>○</td><td>○</td></tr><tr><td>스코어카드 사진 분석 (촬영·파일 올리기)</td><td>○</td><td>✕</td></tr><tr><td>단체전 조별 카드·골프장 결과서 읽기</td><td>○</td><td>✕</td></tr><tr><td>단체전 안내문·시상결과 이미지 만들기</td><td>○</td><td>○</td></tr><tr><td>시상결과 이미지를 올려 내 이력 저장</td><td>○</td><td>○</td></tr><tr><td>이미지 복사·공유</td><td>길게 눌러 공유 (복사는 막힐 수 있어요)</td><td>복사·길게 눌러 공유</td></tr><tr><td>필요한 것</td><td>Claude 계정</td><td>없음</td></tr><tr><td>기록이 저장되는 곳</td><td>Claude 화면 전용</td><td>그 브라우저 전용</td></tr></table><p style="margin-top:10px">두 방법의 <b>기록은 서로 따로 저장돼요.</b> 옮기려면 한쪽에서 <b>백업 저장</b> → 다른 쪽에서 <b>백업 복원</b>을 하세요.</p><p><b>추천</b>: 스코어카드를 사진으로 읽어야 하는 <b>운영자</b>는 Claude로, 나머지 <b>동반자</b>는 크롬 링크로 쓰면 돼요.</p>`],
['🤖 Claude로 앱 쓰는 방법',`<ol><li>Claude 앱(또는 claude.ai)에서 이 앱이 들어 있는 대화를 열고, 앱을 눌러 열어요.</li><li>시작 화면에서 평소처럼 이름·날짜·구장을 입력해요.</li><li>사진 분석이 필요한 기능(<b>일괄입력(스코어카드)</b>, <b>내 스코어</b>, 단체전의 <b>조별 스코어카드·골프장 결과서 올리기</b>)에서 <b>📷 카메라로 촬영</b>이나 <b>🖼 파일 올리기</b>를 눌러요. Claude가 점수를 읽어 줘요.</li><li>읽은 점수는 표에서 확인하고 틀린 칸은 고쳐요.</li></ol><p><b>알아두세요</b></p><ul><li>이름·기록은 크롬에서 연 앱과 <b>따로 저장</b>돼요.</li><li>Claude 계정이 있는 사람만 열 수 있어요. 동반자에게는 크롬 링크를 알려 주세요.</li></ul>`],
['🌐 크롬(웹브라우저)으로 앱 쓰는 방법',`<ol><li>크롬(아이폰은 Safari)에서 앱 주소 <b>sikerman6148.github.io/GG/golf.html</b>을 열어요. 카톡으로 받은 링크나 QR코드를 눌러도 돼요. 카톡 안에서 열렸다면 "다른 브라우저로 열기"를 쓰세요.</li><li>홈 화면에 두려면 크롬 ⋮ → 홈 화면에 추가 (아이폰은 공유 버튼 → 홈 화면에 추가).</li><li>가입이나 설치 없이 바로 쓸 수 있어요.</li></ol><p><b>알아두세요</b></p><ul><li><b>스코어카드 사진 분석은 안 돼요.</b> 대신 홀별 점수를 직접 입력하고, <b>내 스코어 → ✍ 직접 입력</b>으로 총 타수나 홀별 점수를 기록해요. 단체전 참가자는 <b>점수 직접 입력</b>으로 이력에 저장해요.</li><li>운영자가 공유한 <b>시상결과 이미지</b>는 크롬에서도 올려서 이력에 저장할 수 있어요.</li><li>기록은 이 브라우저에 저장돼요. 사이트 데이터를 지우면 사라지니 <b>백업 저장</b>을 해 두세요.</li></ul>`],
['📲 앱 열기·홈 화면에 추가',`<p>링크나 QR코드를 누르면 바로 열려요. 설치나 가입은 필요 없어요. 홈 화면에 아이콘을 만들어 두면 더 편해요.</p><p><b>안드로이드 (Chrome)</b><br>오른쪽 위 ⋮ → 홈 화면에 추가 → 추가</p><p><b>아이폰 (Safari)</b><br>공유 버튼 → 홈 화면에 추가 → 추가</p><p>카톡 안에서 열렸다면 "다른 브라우저로 열기"로 다시 여세요. 골프장은 신호가 약할 수 있으니 라운드 전에 앱을 미리 열어 두고, 라운드 중에는 앱을 끄지 마세요.</p>`],
['📷 폰에서 사진 분석 쓰기',`<ol><li>홈의 <b>내정보</b> 아이콘 → <b>📷 사진 분석</b> 카드.</li><li><b>API 키</b>(sk-ant-…)를 입력하고 <b>🔍 연결 확인</b>.</li><li>이후 📷 촬영·🖼 업로드 자동입력이 폰에서 바로 돼요.</li></ol><p>키는 이 폰에만 저장되고 백업·서버 내보내기에 들어가지 않아요. Claude 앱에서 열면 키가 없어도 돼요. 사진 분석 요금은 키 계정에 청구돼요.</p>`],
['📱 안드로이드 앱(APK) 설치·업데이트',`<p>크롬 대신 <b>설치형 앱</b>으로도 쓸 수 있어요. 사진 선택·카메라, 백업 파일 저장이 앱 안에서 바로 돼요. ${window.AndroidApp?'<b>지금 쓰는 앱 버전: '+AndroidApp.version()+'</b>':''}</p><ul><li><b>설치</b>: 전달받은 APK 파일을 열고, "출처를 알 수 없는 앱" 허용을 한 번 켠 뒤 설치해요.</li><li><b>업데이트</b>: 앱을 열 때마다 새 버전이 있는지 확인하고, 있으면 안내창이 떠요. <b>업데이트</b>를 누르면 내려받은 뒤 설치 화면이 나오고, 거기서 <b>설치</b>를 한 번 눌러요(보안상 사용자가 직접 눌러야 해요).</li><li>앱의 기록은 앱 안에 따로 저장돼요. 크롬에서 쓰던 기록을 옮기려면 크롬에서 <b>백업 저장</b> → 앱에서 <b>백업 복원</b>을 해요.</li></ul>${window.AndroidApp?'<button class="g" onclick="AndroidApp.checkUpdate()">🔄 업데이트 확인</button>':''}`],
['👤 처음 한 번: 내 이름 입력',`<p>맨 위 "기록 관리" 카드에 내 이름을 쓰고 <b>입력</b> → <b>확정</b>을 누르세요. 이름은 앱을 처음 쓸 때 <b>한 번만</b> 입력할 수 있고 나중에 바꿀 수 없어요. 평균 타수와 기록이 이 이름으로 쌓여요.</p><ul><li>게임할 때 참가자 이름에도 같은 이름을 쓰면 내 기록으로 저장돼요.</li><li>기록은 <b>삭제</b> 버튼으로 하나씩 지울 수 있어요.</li><li>기록·평균 점수는 <b>⛳ 필드</b>와 <b>🖥 스크린</b>이 따로 관리돼요. 기록 관리 카드의 탭으로 바꿔 볼 수 있어요.</li><li>기록 창은 평균 타수·파 대비·게임 수까지만 보이고, <b>📂 기록 상세 ▾</b>를 누르면 통계와 기록 목록이 펼쳐져요.</li><li><b>백업 저장</b>으로 이름·이력을 파일로 보관해 두면, 앱을 새로 설치하거나 폰을 바꿔도 <b>백업 복원</b>으로 되살릴 수 있어요.</li></ul>`],
['📝 게임 시작 전 입력 (3단계)',`<ol><li><b>라운딩 정보</b>: <b>구장명</b> 오른쪽의 <b>자동입력</b>의 <b>📷 촬영</b> 또는 <b>🖼 업로드</b>를 누르면 스코어카드를 찍거나 사진 파일을 골라 올릴 수 있고, 구장명·코스명·홀별 파·명단을 읽어 채워 줘요(Claude 앱에서만 돼요). 읽지 못하면 안내 문구가 나오니 직접 입력해 주세요. <b>필드/스크린</b>은 카드 제목 오른쪽 버튼으로 골라요. 처음에는 날짜와 구장 이름만 보이고, 구장명을 입력하면 아래 항목이 펼쳐져요. 이어서 <b>인원수(2~4인)</b>와 <b>명단</b>(내 이름도 직접 입력)을 입력한 뒤 <b>입력</b>으로 확정해요. 앱을 열 때마다 명단은 빈칸으로 시작하고, 인원수와 내 이름은 유지돼요. 전반·후반 코스 이름도 넣을 수 있어요(⛳ 코스 홀별 파 기억 항목 참고). 확정하면 날짜·구장명과 한 줄 요약만 남고 다시 접혀요. 바꾸려면 ✏️ 수정을 눌러요. 구장은 이름만 쓰고 오른쪽에서 CC나 GC를 고르면 돼요.</li><li><b>게임 선택</b>: 항상 펼쳐져 있어요(팀로테이션 항목만 접혀 있어요). 개인대항과 팀별대항에서 각각 한 가지씩 골라요. 하나만 골라도 돼요. 고르면 아래에 게임 설명이 나와요. 접어 두어도 지금 고른 게임은 한 줄로 보여요.</li><li><b>참가자 입력</b>: 게임 화면에는 라운딩 정보에서 입력한 명단이 그대로 나와요. 필요한 금액·핸디만 입력하세요. <b>팀별내기</b>는 명단에서 <b>A조/B조</b>를 골라요.</li></ol><p>마지막으로 <b>게임 시작 (홀별 입력)</b>을 누르세요. 시작이 안 되면 빨간 안내 문구를 따라 하세요.</p>`],
['🎮 게임 종류',`<ul><li><b>팀별내기</b>: 누르면 <b>총타수 / 업다운</b>을 고를 수 있어요. 총타수는 팀 합산 타수(팀 핸디 적용)로 승부하고, <b>업다운</b>은 홀마다 승패를 가려요. 업다운은 시작 전에 승패 기준(팀 합산 타수 / 베스트볼)을 고르고, 정산은 ① 업 수 × 1홀당 금액 ② 홀마다 정산 ③ 승패만 보고 상·벌 중에서 골라요. 다른 팀 게임처럼 A팀·B팀 2명씩이며 3명이면 가상 선수가 들어가요.</li><li><b>개인별순위</b>: 핸디를 뺀 총 타수로 순위를 매기고 순위별 상·벌을 정해요.</li><li><b>타당내기</b>: 1타당 금액으로 두 사람씩 타수 차이만큼 돈을 주고받아요.</li><li><b>팀로테이션 · 벌금게임</b>: 2홀씩 팀을 바꿔 겨루고 진 팀이 벌금을 내요.</li><li><b>팀로테이션 · 벌점게임</b>: 진 팀이 벌점을 받고, 벌점 순으로 정해 둔 총액을 나눠 내요.</li><li><b>팀로테이션 · 빼먹기게임</b>: 미리 모은 상금을 홀마다 이긴 팀이 가져가요. <b>핸디</b>도 적용해요: <b>제일 잘 치는 사람(가상 선수 포함)의 핸디는 0</b>으로 두고, 나머지는 핸디 수(타)를 입력해요. 핸디는 <b>게임 시작 홀부터 남은 홀</b>에 <b>무작위로 미리 나뉘고</b>(한 홀에 2타 이상은 없어요), 그 홀의 <b>입력 타수에서 1타를 빼서</b> 승패를 계산해요. 핸디가 남은 홀보다 많으면 남은 홀 수만큼만 적용돼요. 홀을 시작할 때 그 홀의 핸디 적용 선수가 안내돼요. 기록에는 입력한 타수가 그대로 남아요.</li><li><b>팀별내기</b>: A팀과 B팀의 합산 타수로 승부하고 상·벌을 정해요.</li></ul><p>팀 게임은 <b>3~4명일 때만</b> 선택할 수 있어요(2명이면 팀별대항은 선택할 수 없어요). 4명이 기본이고, 3명이면 가상 선수가 자동으로 들어가요. 자세한 내용은 아래 <b>3인 게임</b> 항목을 보세요.</p>`],
['👥 3인 게임 (가상 선수)',`<p>팀로테이션(벌금·벌점·빼먹기게임)과 팀별내기는 3명이서도 칠 수 있어요. 개인별순위와 타당내기는 3명 그대로 계산해요.</p><ol><li>라운딩 정보에서 <b>인원수를 3인</b>으로 고르고 3명 이름을 입력해요.</li><li>팀 게임을 고르면 <b>🤖 가상 선수 설정</b>이 나와요. <b>동수·동우·동미</b> 중 한 명을 4번째 선수로 골라요.</li><li>평균 타수는 동수 82타, 동우 90타, 동미 98타가 기본이고, <b>−/+ 로 위아래 4타까지</b> 바꿀 수 있어요 (예: 동수 78~86타).</li></ol><p><b>가상 선수 점수는 이렇게 만들어져요</b></p><ul><li>라운딩 정보의 <b>코스 파</b>(기본 파72 = 파3 4홀·파4 10홀·파5 4홀, 파71·파73은 파3·파5 홀 수를 직접 입력)를 바탕으로, 게임을 시작할 때 <b>파3·파4·파5 종류별로</b> 버디·파·보기·더블 개수를 <b>확률로 무작위</b> 미리 나눠 순서를 섞어 둬요. 버디는 파5에서, 더블 이상은 파3에서 조금 더 잘 나오게 나눠요.</li><li>홀마다 입력자가 <b>파3·파4·파5 버튼</b>을 누르면 그 종류의 점수를 순서대로 꺼내 넣어요. 코스 구성대로 치면 18홀 합계는 평균 타수와 같아요. 9홀 게임은 홀 수에 비례해 줄여요.</li><li><b>동수</b>: 버디 최대 2개, 더블보기 최대 2개, 트리플보기 최대 1개. 나머지 홀은 평균에 맞게 파와 보기.</li><li><b>동우</b>: 버디 최대 1개, 더블보기 최대 4개, 트리플보기 최대 2개. 나머지 홀은 파와 보기.</li><li><b>동미</b>: 버디는 평균 4게임에 1개꼴, 양파(파의 2배 타수)는 최대 3개. 나머지 홀은 파·보기·더블보기.</li><li>홀별 입력 화면에 가상 선수 점수가 미리 들어 있어요. 점수는 게임을 시작할 때 미리 정해지므로 <b>진행 중에는 고칠 수 없어요</b>(− / + 버튼이 나오지 않아요).</li><li>실제로 고른 파3·파5 홀 수가 라운딩 정보와 다르면 합계가 평균과 조금 차이 날 수 있어요.</li><li>가상 선수 점수는 <b>홀별 승패 판정에만</b> 쓰여요. 벌금게임·벌점게임·빼먹기게임의 <b>벌금·벌점·상금은 실제 선수끼리만 계산</b>하고, 가상 선수는 내지도 받지도 않아요. (진 팀에 가상 선수가 있으면 실제 선수만 벌금을 내요.)</li><li>가상 선수 점수는 내 기록과 평균 타수에도 들어가지 않아요.</li></ul><p><b>팀 구성</b>: 3명 + 가상 선수가 2명씩 팀을 이루고, 팀로테이션은 2홀마다 짝이 바뀌어요. 팀별내기는 A조·B조 중 한쪽에 가상 선수가 들어가요.</p>`],
['⛳ 홀별 점수 입력, 게임홀지정',`<ol><li>화면 위에서 <b>목록형 / 스코어카드형</b>을 골라요(내 스코어와 같은 방식이고 고른 모양은 유지돼요). <b>목록형</b>은 홀 번호를 누르면 그 홀 줄이 펼쳐지고, <b>스코어카드형</b>은 표의 칸을 누르면 팝업창이 열려요. 동반자 모두의 타수를 함께 입력하고 <b>입력</b>을 누르면 다음 홀로 넘어가요. 이미 친 홀을 눌러 고칠 수도 있어요.</li><li>파3~파6 중 파를 눌러요.</li><li>선수마다 − / + 로 타수를 맞춰요. 처음 값은 파예요. 퍼트 입력은 처음부터 켜져 있고(기본 2) 필요 없으면 퍼트 버튼을 눌러 꺼요.</li><li><b>다음 홀로</b>를 누르면 저장되고 다음 홀로 넘어가요.</li><li>오른쪽 위 ◀ ▶ 로 지난 홀을 보고 고칠 수 있어요.</li><li><b>멀리건</b>: 내 이름 줄 아래(퍼트 옆)에 <b>OB멀리건</b>, <b>해저드멀리건</b> 체크가 있어요. 한 홀에 <b>둘 중 하나만</b> 체크할 수 있어요(다른 쪽을 누르면 먼저 것은 풀려요). <b>멀리건을 쓴 뒤의 타수</b>를 입력하고 체크하면 <b>OB는 +2타, 해저드는 +1타가 점수에 더해져요</b>. 퍼트 수는 바뀌지 않아요. 체크를 풀면 더한 만큼 빠져요. 지난 홀에서도 쓸 수 있고, 쓴 홀은 기록 보기의 "멀리건 사용"에 나와요.</li></ol><p><b>게임 홀</b>: 게임은 1번 홀부터 모든 홀이 자동으로 포함돼요. 시작·종료 홀을 정하는 칸과 내기시작·내기종료 버튼은 없어요. 18홀을 마친 결과 화면의 <b>🎯 게임홀지정</b>을 누르면 스코어카드가 나와요. <b>시작</b> 홀과 <b>종료</b> 홀을 하나씩 체크하고 <b>✅ 이 홀로 적용</b>을 누르면 그 구간만 계산하고 나머지 홀은 점수만 기록돼요. 체크하지 않으면 18홀 모두 포함돼요. 이 선택은 결산(딴 돈·잃은 돈 등) 집계에만 쓰이고, 핸디 같은 게임 시작 전 설정은 모두 18홀 기준이에요. 중간에 <b>⏹ 게임 종료</b>를 눌러 <b>입력한 N홀로 결과 보기</b>를 고르면 점수가 없는 홀은 버리고, 점수가 있는 홀 안에서만 시작·종료 홀을 고를 수 있어요.</p>`],
['🎲 배판과 정산 보기',`<p>내기 중인 홀마다 <b>단판 / 2배판 / 3배판 / 4배판</b>을 고를 수 있어요(타당내기는 <b>이번 홀 타당금액 조정: 기본판·2배판·3배판·4배판</b>이고, 아래 <b>자동배판조건 적용안함</b>을 체크하면 그 홀은 자동 배판을 계산하지 않아요. 체크 안 하면 조정된 금액에 조건 배판 2배가 더 곱해져요). 그 홀 금액에 배수가 곱해지고 다음 홀은 다시 단판이에요. (벌금·벌점 게임은 2홀 라운드 중 높은 배수로 계산해요.)</p><ul><li><b>타당내기 게임룰</b>: 초기설정의 체크박스로 배판(적용 홀·조건), OECD(OB·해저드·벙커·트리플 이상·3퍼트 이상, 홀당 최대 횟수), 상금(타당금액 추가·정액)을 정해요. 버디 1타·이글/홀인원 2타·알바트로스 3타가 추가되고 배판이면 배판금액이 적용돼요. OECD 횟수는 홀별 점수 입력창에서 선수마다 넣어요(1건=1타).</li><li><b>타당내기</b>: <b>홀별 정산 보기</b>로 누가 누구에게 얼마를 줄지 이름 순서대로 볼 수 있어요. 핸디는 시작 전에 정산한 것으로 보고 빼요.</li><li><b>빼먹기게임</b>: <b>홀당 정산 보기</b>로 이긴 팀, 인당 상금, 누적 상금, 상금 잔여액을 봐요. 팀 편성 방식(뽑기·좌타우타·전홀순위·전홀팀유지)은 홀마다 고르고, 비기면 상금이 이월돼요. 상금이 떨어지면 추가할지 물어봐요.</li></ul>`],
['💾 결과 저장과 공유',`<p>종료 홀까지 입력하면 결과 화면이 나와요. <b>게임 종료 · 결과 저장</b> → <b>저장·종료</b>를 누르면 내 기록에 저장돼요.</p><ol><li>시작 화면의 기록 목록에서 <b>보기</b>를 눌러요.</li><li><b>결과 이미지 복사</b>를 누르고 카톡 입력창을 길게 눌러 붙여넣기 하면 이미지로 올라가요.</li><li>점수를 고치려면 <b>결과 관리</b>, 더 이상 못 고치게 하려면 <b>결과 확정하기</b>를 눌러요.</li></ol>`],
['⛳ 코스 파 · 9홀×2 · 구간 결산',`<p>라운딩 정보에서 <b>코스 파</b>(처음엔 파72, <b>▼ 펼치기</b>로 변경)를 고르고, 필요하면 <b>9홀×2</b>를 체크해요.</p><ul><li><b>코스 파</b>: 파71·파72·파73 모두 파3·파5 홀 수를 +/−로 직접 조정해요(파73은 파6도). <b>파4 홀 수는 입력하지 않고 18홀에서 나머지를 뺀 값으로 자동 계산</b>돼요. 처음 값은 파71 = 파3 5·파4 9·파5 4, 파72 = 파3 4·파4 10·파5 4, 파73 = 파3 4·파4 9·파5 5·파6 0이에요. +/−로 고치면 <b>합계 홀 수와 코스 파가 바로 계산</b>돼서 보여요(파4가 자동으로 맞춰져서 합계는 항상 18홀이에요). "기본값으로" 버튼으로 되돌릴 수 있어요. 가상 선수 점수 계산에 쓰여요.</li><li><b>9홀×2 체크</b>: 같은 9홀을 두 번 돌 때 써요. 체크하면 10번 홀부터(후반 9홀)는 전반 9홀의 파가 같은 순서로 <b>자동으로 들어가서 타수만 입력</b>하면 돼요. 9홀이 끝나면 1회차 결산이 나와요.</li><li>체크하지 않으면 <b>18홀을 이어서</b> 쳐요 (구간 결산 없음). 타당내기는 9번 홀이 끝나면 전반 정산 화면이 나와요.</li></ul><p>구간 결산은 <b>정산 확인용</b>이고 게임은 끝나지 않아요. <b>다음 홀로</b>를 누르면 이어서 쳐요. 끝난 구간 결산은 홀별 입력 화면의 <b>📊 구간 결산</b>에서 다시 볼 수 있고, 최종 결과 화면에서도 <b>구간별 결산</b>으로 볼 수 있어요.</p><p>팀로테이션 게임에서 9홀 구간은 2홀씩 묶으면 9번 홀이 10번 홀과 한 라운드가 돼요. 이 라운드는 10번 홀이 끝나는 다음 구간 결산에 들어가요.</p>`],
['⛳ 코스 홀별 파 기억',`<p>점수를 저장하면 <b>그 코스의 홀별 파를 자동으로 기억</b>해요. 다음에 같은 코스를 고르면 점수 입력 화면에 홀별 파가 처음 값으로 들어가서, 홀마다 파 버튼을 누르지 않아도 돼요.</p><ul><li><b>전반·후반 코스 이름</b>: 라운딩 정보에서 구장명 아래에 <b>전반 코스</b>와 <b>후반 코스</b> 이름(예: 레이크, 힐)을 넣을 수 있어요(선택). 이름을 넣으면 <b>구장 + 코스 이름</b>별로 9홀씩 기억하고, 다음에 같은 코스 조합으로 가면 <b>전반은 전반 코스의 파, 후반은 후반 코스의 파</b>가 들어가요. 전반·후반 순서를 바꿔 가도 각 코스의 파가 맞게 들어가요. 9홀×2를 체크하면 코스 이름 칸이 하나만 나와요.</li><li>코스 이름을 넣지 않으면 구장 전체(18홀)의 파를 기억해서 써요. 이름을 넣었는데 그 코스의 기억이 없으면 구장 전체 기억을 대신 써요.</li><li>내 스코어의 홀별 입력, 홀별 점수 입력으로 치는 모든 게임에서 쓰여요. 필요하면 홀마다 파를 바꿀 수 있어요.</li><li>홀별 입력 게임, 사진으로 읽은 스코어카드, 내 스코어 중 어느 것이든 저장하면 그 홀별 파를 기억해요. 모든 홀이 파4인 기록은 기억하지 않고, 9홀 기록이 18홀 기억을 덮어쓰지도 않아요.</li><li>같은 코스를 다시 저장하면 최근 파로 바뀌어요. 코스 이름은 CC·GC·골프장·'코스' 같은 끝말이 달라도 같은 코스로 봐요.</li><li>라운딩 정보의 코스 카드에서 <b>기억 지우기</b>로 지울 수 있어요. 기억한 파는 백업 저장·복원에도 같이 들어가요.</li></ul>`],
['📸 일괄입력(스코어카드)·내 스코어',`<p><b>일괄입력(스코어카드)</b>: 게임 시작 후 홀별 입력 화면 아래의 이 버튼을 누르면, 경기 후 스코어카드를 촬영하거나 파일로 올려 한 번에 입력해요. 읽은 점수를 확인·수정하고 <b>스코어 최종 확정</b>으로 끝내요.</p><p><b>내 스코어</b>: 내기 없이 평균 스코어와 기록만 남기고 싶을 때, 라운딩 정보 아래 <b>내 스코어</b>를 눌러 스코어카드를 올려요. 저장하면 기록 관리에 쌓여요. 내기 게임을 홀별로 입력하면 점수가 자동으로 입력되므로 게임 점수는 따로 입력할 필요가 없어요.</p><p>사진 분석은 Claude에서 연 앱에서만 돼요. 일반 링크로 연 앱에서는 홀별 입력을 쓰거나, 내 스코어의 <b>✍ 직접 입력</b>(파·타수·퍼트)을 쓰세요. 자세한 내용은 <b>📈 스코어 직접 입력 · 퍼트 · 통계</b> 항목을 보세요.</p>`],
['⛳ 핸디 입력·스코어카드',`<p>홀 점수는 <b>파 기준 핸디</b>(파=0, 보기=+1, 버디=−1)로 입력해요. 입력창 안에 실제 타수도 작게 함께 보여요.</p><ul><li>결과 스코어카드는 골프존 형식: HOLE·Par·Score·Putt, T 합계, ♡ 버디 · □ 보기 · 이중 □ 더블 · ✓ 멀리건.</li><li>기록·통계는 <b>76타(+4)</b> 형태예요. 평균·베스트·워스트는 핸디로 계산해 현재 코스 파(71/72/73)에 반영해요.</li></ul>`],
['📈 스코어 직접 입력 · 퍼트 · 통계',`<p><b>내 스코어 → ✍ 직접 입력</b>은 사진 분석이 안 되는 크롬 등에서도 쓸 수 있어요. 먼저 <b>홀 수(18/9)</b>를 고르고 두 가지 중 하나를 써요.</p><ul><li><b>① 총 타수만 빠르게</b>: 내 총 타수와 코스 파 합계(기본 72)만 입력해요. 가장 빠르지만 홀별 정보가 없어서 <b>퍼트·그린적중 통계에는 들어가지 않아요</b>.</li><li><b>② 홀별로 입력</b>: 아래 순서로 입력해요.</li></ul><p><b>홀별 입력 방법</b></p><ol><li>먼저 <b>홀 번호를 눌러 그 홀을 활성화</b>해요(진한 초록으로 표시돼요). <b>활성화한 홀에만 − / + 버튼이 나오고</b> 나머지 홀은 숫자만 보여요. 홀의 숫자나 체크를 건드려도 그 홀이 활성화돼요. 활성화한 홀의 <b>파 · 타수</b> 숫자 양옆 <b>− / +</b> 버튼으로 맞춰요. 처음에는 <b>파 4 · 타수는 파와 같은 값</b>이 들어 있어요.</li><li><b>퍼트는 처음부터 2로 입력돼 있어요</b>(입력중 상태). 홀마다 − / +로 바꿔요. 퍼트를 입력하고 싶지 않으면 <b>표 맨 위의 '퍼트'를 눌러 '없음'</b>으로 바꾸세요(다시 누르면 모든 홀이 퍼트 2로 시작해요). 없음으로 저장하면 퍼트 정보 없이 저장되고 <b>퍼트·그린적중 통계에서는 빠져요</b>.</li><li><b>입력 화면 모양 고르기</b>: 입력 화면 맨 위에서 <b>목록형</b>(홀마다 − / + 버튼, 처음 모양)과 <b>스코어카드형</b>(전반·후반 표에서 칸을 누르면 팝업창이 열려 목록형처럼 − / + 로 입력하고, <b>입력</b>을 누르면 표로 돌아와요)을 고를 수 있어요. 한 번 고른 모양은 바꾸기 전까지 다음에도 그대로예요.</li><li>한계: <b>파는 3~6</b>, <b>타수는 1 이상</b>(위쪽 제한 없음), <b>퍼트는 0 이상</b>(위쪽 제한 없음). 한계에 닿으면 − 또는 + 버튼이 잠겨요.</li><li>파를 바꿀 때 타수를 아직 건드리지 않았다면(파와 같은 값이면) <b>타수도 같이</b> 바뀌어요. 이미 고친 타수는 그대로예요.</li><li>홀마다 오른쪽 <b>멀리건</b> 칸에서 <b>OB(+2) 또는 해저드(+1)</b> 중 하나를 체크할 수 있어요. 멀리건을 쓴 뒤의 타수를 입력하고 체크하면 점수에 더해져요(퍼트 수는 그대로). 쓴 홀은 스코어카드 확인 화면에 "멀리건" 줄로 나와요.</li><li>다 입력하고 <b>📋 저장 (스코어카드 확인)</b>을 누르면 전반·후반 <b>스코어카드</b>(파·타수·퍼트·그린적중 ●○, 합계)가 나와요.</li><li>틀린 칸은 <b>그 칸을 눌러 바로 고쳐요</b> (파·타수·퍼트 모두). 합계는 바로 다시 계산돼요. 퍼트가 타수보다 많은 홀이 있으면 확정이 막혀요.</li><li><b>✅ 확정</b>을 누르면 스코어가 확정되어 <b>기록에 저장</b>돼요. 확정된 기록은 수정할 수 없어요. 기록 보기에서 홀별 퍼트·그린적중 표도 볼 수 있어요.</li></ol><p><b>게임 중에도 퍼트를 입력할 수 있어요.</b> 홀별 입력 화면에서 <b>사용자 이름과 같은 선수의 타수 입력 줄 바로 아래</b>에 <b>'퍼트 없음'</b> 버튼이 있어요(다른 선수에게는 없어요).</p><ul><li><b>'퍼트'를 눌러야</b> 입력돼요. 누르면 <b>퍼트 2</b>로 시작하고 − / +로 바꿀 수 있어요. 퍼트는 그 홀의 내 타수보다 많을 수 없어요. 다음 홀은 다시 2로 시작해요.</li><li>게임 도중에 처음 누르면 지난 홀의 퍼트는 기본값 2로 채워져요(◀ 이전 홀에서 고칠 수 있어요).</li><li><b>입력 중에 '퍼트'를 누르면 ‘한 번 더 누르면 전체 없음’</b>으로 바뀌고, 한 번 더 누르면 지금까지 입력한 퍼트가 모두 지워져요.</li><li>퍼트를 입력한 게임은 내 스코어 기록과 <b>똑같은 방식으로 통계에 들어가요</b>. 퍼트를 누르지 않은 게임은 그린적중률·평균 퍼트에서 빠져요.</li></ul><p><b>기록 관리의 통계</b> (기록 관리 카드 아래 📈 통계 · 필드/스크린 따로)</p><ul><li><b>🏆 베스트 스코어</b>: 전 경기 중 가장 낮은 스코어. <b>😓 워스트 스코어</b>: 가장 높은 스코어.</li><li><b>🎯 평균스코어</b>: <b>최근 20경기에서 최저타와 최고타를 하나씩 빼고</b> 남은 경기(20경기면 18경기)의 평균이에요. <b>칸을 누르면 최근 20경기 스코어를 연결선 그래프로</b> 보여 주고, 평균과 평균 ±1σ를 선으로 표시해요. ±1σ 영역은 통계적으로 전체 데이터의 약 68%가 들어오는 범위예요.</li><li><b>🟢 그린적중률</b>: 위 경기에서 (타수 − 퍼트)가 <b>파−2 이하</b>인 홀(규정 타수로 그린에 올린 홀)의 비율이에요. 따로 입력할 필요는 없어요.</li><li><b>🛡 평균 파세이브율</b>: 한 경기의 <b>파세이브율 = (GIR 실패 홀 중 파 이상으로 막은 홀 수 ÷ GIR 실패 홀 수) × 100%</b>이고, 위 경기들의 파세이브율을 평균해요. GIR(그린적중)은 (타수 − 퍼트)가 파−2 이하인 홀(파3은 1, 파4는 2, 파5는 3 이하)이에요. 그래서 퍼트를 입력한 기록만 계산하고, GIR을 하나도 놓치지 않은 경기는 빠져요.</li><li><b>⛳ 평균 퍼트</b>: 위 경기의 한 경기당 평균 퍼트 수예요.</li><li><b>⛳ 한 경기 평균 홀 결과</b>: 위 경기들에서 <b>버디 · 파 · 보기 · 더블이하</b>가 한 경기(18홀)에 평균 몇 개인지 보여 줘요. 버디는 이글 이상을 포함하고, 더블이하는 더블보기와 그보다 나쁜 홀이에요. 홀별 점수가 있는 기록만 계산하고(총 타수만 저장한 기록은 빠져요) 경기 수를 같이 표시해요.</li><li><b>📊 산포(평균 ±1σ)</b>: <b>평균 타수 ± 표준편차(1σ)</b> 범위를 크게 보여 주고(예: 86~94타), 그 옆에 <b>σ 값</b>을 작게 표시해요. 보통 이 범위에서 치는 경우가 대략 3경기 중 2경기예요. (σ는 표본 표준편차예요)</li></ul><p><b>계산 기준</b></p><ul><li><b>18홀 기록만</b> 계산해요. 18홀을 채우지 못한 기록(9홀·중도 종료 등)은 통계와 핸디에 넣지 않고 이력에만 저장돼요.</li><li>총 타수만 저장했거나 사진으로 읽은 기록은 퍼트 정보가 없어서 <b>그린적중률·평균 퍼트에서는 빠져요</b> (스코어 통계에는 들어가요). 화면에 "퍼트를 입력한 N경기 기준"으로 표시돼요.</li><li>경기가 3회 미만이면 최저·최고를 빼지 않아요. 산포는 2경기부터 나와요.</li><li>통계에는 경기 수 숫자를 따로 표시하지 않아요. 그린적중률·평균 파세이브율·평균 퍼트는 퍼트를 입력한 경기만으로 계산해요.</li><li>기존 <b>평균 타수</b>(모든 경기의 단순 평균)와 <b>평균스코어</b>는 계산 방식이 달라 값이 다를 수 있어요.</li></ul>`],
['🏌️ 단체전',`<p>홈 화면 맨 위의 <b>🏌️ 단체전</b> 아이콘을 누르세요. 점수입력·내기게임과 <b>화면이 따로</b>예요. 다른 화면에서는 위의 <b>🏠 홈으로</b>로 돌아와요. 단체전 화면에서 날짜·구장을 확정하고 <b>운영자</b>인지 <b>참가자</b>인지 고르세요.</p><p><b>운영자</b></p><ol><li>운영자는 내 이름으로 자동 설정, <b>모임·명단 관리</b>(모임명, 명단·개인별 핸디 추가/삭제, 카톡방 명단 캡처 올리면 이름 자동 추가, 동명이인은 홍길동1 식 번호), <b>대회 요강</b>(대회명, <b>이동</b>(출발 시간·이동 시간 5분 단위), <b>비용</b>(화폐단위 선택), <b>중식 장소</b> 등), 조의 개수, 조별 코스·티오프 시간, 이름(조는 2~4명, 이름 칸을 누르면 기억된 이름이 가나다순으로 나와 눌러 고르거나 직접 입력해요. 모임명을 정해 두면 그 모임 명단이 먼저 나와요), <b>성별 M/F 체크</b>(기억된 이름·저장된 명단은 자동 체크, 안내문 이름 옆에 표시), 조장·차량운행자(차량 탑승자·캐디백), <b>핸디</b>(체크하면 평균 핸디 입력칸이 열리고 기억된 핸디가 처음 값이에요. 체크하지 않으면 기본 85), <b>비고</b>, <b>대회 규정</b>(기본 규정을 고치거나 추가·삭제)을 입력해요. <b>안내문출력</b>을 누르면 저장되고 안내문 이미지가 만들어져요(이미지를 길게 눌러 카톡으로 공유).</li><li>경기가 끝나면 조별 스코어카드를 <b>촬영하거나 파일로 올려요</b>. 골프장에서 받은 <b>전체 인원 결과서</b>를 올리면 조별 카드보다 <b>우선</b> 반영돼요.</li><li><b>결산결과</b>에서 순위, 버디·파·보기 개수, 홀인원·이글, 시상을 확인하고 시상 칸은 눌러서 고쳐요. <b>시상결과출력</b>으로 이미지를 만들어 공유해요.</li><li>운영자 이름이 내 사용자 이름과 같고 내가 선수로 있으면 전체 인원 결과가 내 이력에 자동 저장돼요.</li></ol><p><b>참가자</b></p><ol><li>우리 조 명단만 입력해요.</li><li>우리 조 스코어카드를 촬영하거나 파일로 올리면 이미지를 <b>길게 눌러 단톡방에 보낼 수 있고</b>, 읽은 점수는 내 이력에 저장돼요. 사진 분석을 못 쓰면 점수를 직접 입력해 저장해요.</li><li>운영자가 공유한 <b>시상결과 이미지</b>는 단체전 탭의 <b>시상결과 저장</b>으로 올리면 내 이력에 저장돼요.</li></ol><p><b>수정해서 다시 보내기</b>: 안내문은 <b>안내문 수정하기</b> 후 안내문출력을 다시 누르고, 시상결과는 고친 뒤 시상결과출력을 다시 누르면 <b>(수정 N차)</b> 표시가 붙은 새 이미지가 만들어져요.</p><p>신페리오는 몰래 정한 12개 홀 점수로 그날 핸디를 계산하는 방식이에요. 스코어카드·결과서 사진 분석은 Claude에서 연 앱에서만 돼요.</p>`],
['❓ 자주 묻는 질문',`<ul><li><b>점수를 잘못 넣었어요</b>: ◀ 로 그 홀로 돌아가 고쳐요. 저장 후에는 기록 보기의 결과 관리에서 고쳐요.</li><li><b>게임을 기록 없이 닫고 싶어요</b>: 화면 맨 아래 <b>⏹ 게임 종료</b> → <b>중도 종료</b>를 눌러요. 입력한 홀까지 결과를 보려면 같은 화면에서 <b>입력한 N홀로 결과 보기</b>를 눌러요.</li><li><b>앱이 예전 화면이에요</b>: 앱을 완전히 끄고 다시 열거나 화면을 아래로 당겨 새로고침하세요.</li><li><b>기록이 사라졌어요</b>: 기록은 각자 폰에만 저장돼요. 브라우저의 사이트 데이터를 지우면 함께 지워져요.</li></ul>`],
['🆕 업데이트 내역',`<p>기능이 바뀔 때마다 이곳에 정리해요. 최신 내용이 위에 있어요.</p><p><b>최근 업데이트</b></p><ul><li><b>일괄입력(스코어카드)은 홀별 입력 화면에서만</b>: 설정(시작) 화면에 있던 <b>나중에 일괄 입력</b> 버튼을 모두 없앴어요. 버튼은 홀별 입력 화면 안에만 있고 이름이 <b>📋 일괄입력(스코어카드)</b>로 바뀌었어요. 타당내기·빼먹기게임에는 이 버튼이 없어요.</li><li><b>타당내기·빼먹기 시작 화면의 나중에 일괄 입력 삭제</b>: 두 게임은 설정 화면의 <b>📋 나중에 일괄 입력</b> 버튼도 없어요(게임 진행 화면은 이미 삭제). 홀별 입력으로만 진행해요.</li><li><b>핸디 입력창을 맨 아래로 · 접기 버튼 흰색</b>: 빼먹기게임의 <b>참가자 · 핸디</b>와 팀별 게임의 <b>팀 핸디</b>(A팀·B팀 핸디)를 설정 화면 맨 아래(시작 버튼 바로 위)로 옮겼어요. 모든 ▼ 펼치기 / ▲ 숨기기 버튼은 흰색으로 바꿨어요.</li><li><b>팀 나누기·팀 핸디 숨기기·펼치기</b>: 벌금·벌점·팀별·업다운 등 모든 게임의 <b>팀 나누기(A조/B조)</b>와 <b>팀 핸디</b>(A팀·B팀 핸디 포함, 게임 중 설정 화면 포함)에 ▼ 펼치기 버튼이 생겼어요. 처음엔 숨김이고 다른 화면에 갔다 오거나 게임을 새로 고르면 다시 숨겨져요. 입력한 값은 숨겨도 그대로 적용돼요.</li><li><b>개인대항·팀별대항 동시 선택 불가</b>: 게임 선택에서 개인대항 게임을 고르면 팀별대항 선택이 풀리고, 팀별대항을 고르면 개인대항 선택이 풀려요. 둘 중 하나만 선택할 수 있어요.</li><li><b>설정 화면의 중복 참가자 명단 삭제</b>: 라운딩 정보에서 이미 명단을 입력하므로, 팀별·개인대항 설정 화면의 <b>참가자</b> 명단과 업다운·팀 게임의 <b>A팀/B팀 이름</b> 명단을 화면에서 뺐어요(A·B조 구성은 위 인원 박스에서 그대로 보여요). 벌금·벌점 게임의 참가자 명단도 같은 방식으로 뺐어요. 개인 핸디·빼먹기 핸디처럼 이름과 함께 쓰는 입력칸은 그대로예요.</li><li><b>참가자·핸디 숨기기·펼치기 (빼먹기게임)</b>: 빼먹기게임 설정 화면의 <b>참가자 · 핸디</b> 칸에도 ▼ 펼치기 버튼이 생겼어요. 처음엔 숨김이고, 다른 화면에 갔다 오면 다시 숨겨져요.</li><li><b>빼먹기게임에서도 나중에 일괄 입력 버튼 삭제</b>: 타당내기에 이어 빼먹기게임 진행 화면에서도 '나중에 일괄 입력' 버튼이 없어요.</li><li><b>타당내기에서 나중에 일괄 입력 버튼 삭제</b>: 타당내기 게임 진행 화면에는 더 이상 '나중에 일괄 입력' 버튼이 없어요. 다른 내기게임은 그대로예요.</li><li><b>게임룰 등 숨기기·펼치기 화면 이동 시 자동 숨김</b>: 타당내기의 게임룰·참가자·개인 핸디·핸디 지급 금액을 펼쳐 둔 채 다른 화면으로 갔다가 돌아오면 다시 숨김 상태로 시작해요. 타당내기를 새로 고를 때도 숨김이에요(같은 화면에서 홀을 넘길 땐 유지).</li><li><b>숨기기·펼치기 기본은 모두 숨김</b>: 사용 방법·요구사항 정리서의 첫 항목도 이제 처음엔 접혀 있어요. 다른 숨기기·펼치기 영역(코스 파, 참가자·개인 핸디, 게임룰, 핸디 지급 금액, 내기록 등)은 이미 숨김이 기본이에요.</li><li><b>타당내기 이번 홀 타당금액 조정</b>: 홀별 입력 화면 게임룰 맨 위(1번)에 <b>이번 홀 타당금액 조정</b>(기본판·2배판·3배판·4배판)이 생겼어요. 바로 밑 <b>자동배판조건 적용안함</b>을 체크하면 이 홀은 배판 조건에 맞아도 자동 배판을 계산하지 않아요. 체크 안 하면 조정된 금액을 기준으로 조건에 맞을 때 2배를 더 곱해요(예: 2배판 + 버디 조건 = 4배). 기존 게임룰 번호는 2~6번으로 밀렸어요.</li><li><b>이번 홀 배판을 게임룰 안으로</b>: 타당내기 홀별 입력 화면의 <b>이번 홀 배판</b>(단판~4배판) 버튼이 <b>🎲 게임룰</b> 카드 안(6번 항목)으로 들어갔어요. 펼쳐야 보이고, 이번 홀이 배판이면 게임룰 제목 옆에 "이번 홀 N배"가 표시돼요.</li><li><b>홀별 입력 화면 게임룰 숨기기·펼치기</b>: 타당내기의 홀별 점수 입력 화면(과 정산 화면)의 <b>🎲 게임룰</b> 카드에 <b>▼ 펼치기 / ▲ 숨기기</b>가 생겼어요. 처음엔 숨겨져 있고, 숨겨도 정한 룰은 그대로 적용돼요.</li><li><b>18홀 미만 기록은 이력에만</b>: 18홀을 채우지 못한 라운드는 내기록의 평균 타수·게임 수·통계·내정보 핸디에 넣지 않고, 라운딩 기록 이력에만 저장해요.</li><li><b>게임홀지정</b>: 게임 시작·종료 홀 입력칸과 내기시작·내기종료 버튼을 없앴어요. 이제 1번 홀부터 모든 홀이 자동으로 게임에 포함되고, 핸디 같은 시작 전 설정은 모두 18홀 기준이에요. 게임 중간에 <b>⏹ 게임 종료</b> → <b>입력한 N홀로 결과 보기</b>를 고르면 점수 없는 홀은 버리고 입력된 홀 안에서만 지정할 수 있어요. 시작·종료 홀은 결산(딴 돈·잃은 돈) 집계에만 쓰여요. 18홀 종료 후 결과 화면의 <b>🎯 게임홀지정</b>에서 스코어카드의 체크로 시작·종료 홀을 고를 수 있고, 지정하지 않으면 18홀 모두 포함돼요.</li><li><b>타당내기 게임룰 초기값</b>: 타당내기를 고르면 항상 <b>당홀 적용 · 1명 이상 버디·3명 이상 동타·트리플 이상 · OECD 5가지 모두 · 홀당 1회 · 타당금액 추가</b>로 시작해요. 필요하면 체크를 바꿔요.</li><li><b>홈으로 버튼 키움</b>: 위쪽 🏠 홈으로 버튼의 아이콘과 글자를 키우고, 밝은 회색 바탕에 입체감 있는 테두리로 눈에 띄게 바꿨어요.</li><li><b>타당내기 입력 화면 숨기기·펼치기</b>: <b>👥 참가자·개인 핸디</b>, <b>🎲 게임룰</b>, <b>🤝 핸디 지급 금액</b>은 처음에 숨겨져 있고 오른쪽 <b>▼ 펼치기</b>로 열어요. 숨겨도 입력한 값은 그대로 적용돼요.</li><li><b>모든 라운딩 정보 화면에 저장·지우기</b>: 점수입력·내기게임 입력·단체전 시작 화면 맨 아래에 <b>💾 저장</b>·<b>🗑 지우기</b>가 있어요. <b>✔ 입력</b>은 라운딩 정보 칸만 확정하고, 💾 저장은 그 화면에 입력한 내용 전체를 저장해요(초기 화면 "이어가기"로 다시 열기). 🗑 지우기는 그 화면 내용을 모두 지워요. 두 버튼 모두 화면에 머물고, 초기 화면으로는 위쪽 <b>🏠 홈으로</b> 버튼으로만 가요. (점수입력에서 총 타수를 저장하면 기록이 저장되므로 초기 화면으로 가요.)</li><li><b>내 스코어 직접 입력 화면 저장·지우기</b>: 맨 아래 "초기 화면으로" 버튼을 <b>💾 저장</b>·<b>🗑 지우기</b>로 바꿨어요. 저장은 위에 적은 총 타수를 기록에 저장하고(비어 있으면 안내만), 지우기는 입력한 값을 지워요.</li><li><b>코스 파 숨기기·펼치기</b>: 라운딩 정보의 코스 파는 항상 <b>파72</b>·숨김 상태로 시작해요. 바꾸려면 <b>▼ 펼치기</b>를 눌러요. 이전에 71·73을 썼어도 기억하지 않아요.</li><li><b>영구삭제 버튼</b>: 삭제 후 위쪽 배너의 <b>↩ 복구</b> 옆에 <b>🗑 영구삭제</b>가 생겼어요. 누르면 복구 내용을 지워 더 이상 되돌릴 수 없어요.</li><li><b>폰에서 사진 분석</b>: 내정보 아래 <b>📷 사진 분석</b> 카드에 Anthropic API 키를 한 번 입력하면 크롬·설치 앱에서도 스코어카드 사진 분석이 돼요. 키는 폰에만 저장돼요.</li><li><b>덮어쓰기 확인</b>: 같은 구장·날짜(·티오프 시간)의 기록이 이미 있는데 새 기록을 저장하려고 하면 <b>덮어쓰기</b> / <b>저장 안 함(이전 기록 유지)</b>을 물어요. 덮어쓰면 복구 버튼으로 되돌릴 수 있어요. 백업 복원은 묻지 않고 이미 있는 기록을 그대로 둬요.</li><li><b>티오프 시간 입력·중복 기록</b>: 모든 <b>라운딩 정보</b> 창에 <b>⏰ 티오프 시간</b> 입력칸(<b>모름</b> 체크 가능)이 생겼어요. 같은 구장·같은 날짜·같은 티오프 시간의 기록이 다시 들어오면(직접 입력이든 사진 업로드든) 가장 <b>최신 내용으로 바꿔 저장</b>해요(내스코어·게임·단체전 등 종류와 상관없이). 티오프 시간은 입력하지 않아도 진행돼요. 시간이 없거나 <b>모름</b>이면 구장·날짜까지만 같아도 같은 기록으로 봐요. 메뉴(종류)별 우선순위는 없어졌고 항상 가장 최신 기록 하나만 남겨요.</li><li><b>내정보 핸디캡 자동</b>: 내정보의 핸디캡은 입력칸을 없애고 <b>내기록의 18홀 평균 핸디</b>(필드·스크린 따로)를 자동으로 보여 줘요. 직접 입력할 수 없고, 기록이 쌓이면 저절로 바뀌어요.</li><li><b>사용 방법 버튼 정리</b>: 다른 화면 제목 줄의 📖 사용 방법 버튼을 없앴어요. 사용 방법은 홈 화면의 <b>사용 방법 아이콘</b>으로 열고, 열려 있을 때만 <b>✕ 닫기</b>가 나와요.</li><li><b>백업 저장 위치 지정</b>: <b>백업 저장</b>을 누르면 폰의 저장 위치를 내가 직접 고를 수 있어요. 폴더 선택 창이 뜨는 기기에서는 폴더와 파일 이름을 고르고, 안 뜨는 폰(대부분의 안드로이드 크롬)에서는 공유 창이 떠서 <b>파일에 저장</b>·내 드라이브·카카오톡 나와의 채팅 등을 고르면 돼요. 이런 창을 쓸 수 없는 화면에서는 예전처럼 다운로드로 저장돼요.</li><li><b>배판 조건 표현</b>: 배판 조건 "버디 이상"을 <b>1명 이상 버디</b>로 바꿨어요. 그 홀에서 한 명이라도 파보다 낮은 점수(버디·이글·홀인원)를 치면 조건이 맞아요.</li><li><b>타당내기 게임룰 체크박스</b>: 초기설정(과 정산 화면)에서 <b>1 배판 적용 홀</b>(당홀·다음홀), <b>2 배판 조건</b>(1명 이상 버디·3명 이상 동타·트리플 이상), <b>3 OECD</b>(OB·해저드·벙커·트리플 이상·3퍼트 이상), <b>4 홀당 OECD 최대 적용 횟수</b>(적용안함·1회·2회·무제한), <b>5 상금</b>(타당금액 추가·정액 직접입력)을 체크박스로 고르면 정산에 자동 반영돼요. OB·해저드·벙커·3퍼트 횟수는 <b>홀별 점수 입력창의 각 선수 줄 아래</b>에서 −/+로 넣어요(트리플 이상은 점수로 자동 계산). OECD 1건은 1타로 계산하고 배판이면 배판이 적용돼요.</li><li><b>설명 문구 간소화</b>: 점수입력·내기게임·단체전 화면의 설명 문구를 줄였어요. 메뉴 이름을 설명하는 문구는 없애고, 게임 규칙 설명은 핵심만 남겼어요(핸디 지급, 배판·버디 계산, 내기 구간, 우선 반영 규칙 등).</li><li><b>내정보</b>: 홈 아이콘에 <b>내정보</b>를 추가했어요. 이름·성별·생년월일(나이 자동 계산)·구력을 입력하면 바로 저장되고(핸디캡은 내기록에서 자동), 게임의 개인 핸디 칸에서 <b>내 핸디캡 불러오기</b>로 가져다 쓸 수 있어요. <b>라운딩 기록 관리</b>(백업 저장·복원, 날짜별 기록 보기·삭제)는 내기록 카드에서 내정보 화면으로 옮겼어요. <b>백업 저장</b>은 내정보까지 함께 파일로 저장하고, <b>☁️ 외부 서버로 내보내기</b>(내가 정한 https 주소로 전송)가 생겼어요. 백업 복원은 그대로예요.</li><li><b>홈 메뉴 개편</b>: 홈 화면 맨 위에 입체 아이콘 메뉴 <b>점수입력 · 내기게임 · 단체전 · 사용 방법</b>(사용 방법 버튼은 이 아이콘으로 옮겼어요)을 두고 그 아래에 내기록을 보여 줘요. 위쪽 탭은 없앴어요. <b>라운딩 정보</b> 입력은 메뉴를 고른 뒤 나오는 화면에서 해요. 점수입력은 예전 내 스코어 화면 그대로고, 단체전 첫 화면의 사용자 이름 창은 없앴어요. 다른 화면에서는 <b>🏠 홈으로</b> 버튼으로 돌아와요.</li><li><b>내기록 화면 다시 정리</b>: <b>평균 타수</b>(72 기준 글자 삭제), 통계 칸 안의 설명 문구와 아래 안내 글을 없애고 칸·그래프 크기를 줄였어요(통계는 한 줄에 3칸). <b>📈 통계</b>와 <b>🗂 라운딩 기록 관리</b> 제목 오른쪽의 ▼ 화살표로 각각 펼치고 접어요(처음엔 접혀 있어 한 화면에 들어와요). 평균 점수 그래프는 눌러서 여는 방식을 없애고 평균 타수 박스 아래에 바로 보여 줘요. <b>라운딩 정보</b>의 필드/스크린도 체크박스로 바꿨어요. <b>기록 상세(통계)</b> 버튼과 <b>라운딩 기록 관리</b> 펼치기 버튼을 없앴어요. 통계 내용은 통계 제목 옆 ▼로 펼치고, 일자별 기록은 기록 관리 제목 옆 ▼로 펼쳐 5줄 정도 높이에서 손가락으로 밀어 스크롤해요.</li><li><b>클로드 화면에서 백업 저장</b>: 클로드 링크로 열었을 때도 <b>백업 저장</b>이 동작해요. 누르면 저장 확인창이 뜨고, 승인하면 백업 파일이 폰에 저장돼요.</li><li><b>내기록 화면 정리</b>: 제목을 <b>내기록</b>으로 바꾸고 사용자 이름 줄을 없앴어요. <b>필드 / 스크린</b>은 제목 오른쪽 체크박스로 고르고 통계·기록은 서로 분리돼요. <b>평균 타수</b>는 18홀 기록의 핸디(+N) 평균을 72 기준 타수로 보여 주고, <b>게임 수</b>는 18홀 기록 수예요. 통계 값 옆의 경기 수 숫자는 없앴어요. 백업 저장·복원은 맨 아래 <b>라운딩 기록 관리</b>(펼치기) 안 일자별 기록 위로 옮겨 작게 오른쪽에 두었고, <b>같은 구장·날짜·티오프 시간</b> 기록이 함께 올라오면 <b>내스코어 > 게임 > 단체전</b> 순서로 하나만 남겨요.</li><li><b>타당내기 배판 조건 선택</b>: 초기 배판을 <b>해당 홀 / 다음 홀</b> 중 고르고, 조건은 <b>버디 이상 · 한 명이라도 트리플 이상(파3은 더블 이상) · 3명 이상 동타</b> 중 여러 개를 고를 수 있어요. 시작 전 설정은 물론 <b>진행 중·라운드 종료 후 정산 화면</b>에서도 바꿀 수 있고, 바꾸면 정산이 바로 다시 계산돼요.</li><li><b>타당내기 버디 옵션</b>: 시작 전 설정에서 ① 버디 이상(이글·홀인원 등)이 나온 홀을 <b>해당 홀 배판 / 다음 홀 배판 / 없음</b>으로 고르고, ② 버디·이글을 <b>타수로</b>(버디 1타·이글 2타 추가) 또는 <b>정액</b>(예: 버디 1개당 만원, 이글 2배)으로 추가 지급하도록 정할 수 있어요. 정산·기록 화면에 적용 내용이 같이 표시돼요.</li><li><b>삭제 복구·임시저장 지우기 팝업</b>: 단체전 홈에 진행중인 화면으로 가기 버튼이 있으면 <b>다음 →</b>은 숨기고, 없으면 <b>다음 →</b>만 보여요. '임시저장 지우기'를 누르면 <b>저장 / 취소</b> 팝업이 떠요. 기록·명단·모임·결과서·임시저장 등을 지우면 화면 위에 <b>↩ 복구</b> 버튼이 생겨 되돌릴 수 있어요(파워포인트 복구 파일처럼 가장 최근 삭제 1건). 다른 내용을 저장하면 그 이전 삭제는 영원히 복구할 수 없고, 날짜가 바뀌면(폰 현지 시간) 복구 내용도 자동으로 지워져요.</li><li><b>단체전 이어가기 위치 이동</b>: 단체전의 '진행중인 화면으로 가기'(이어가기·임시저장 지우기)를 단체전 홈 맨 위가 아니라 운영자/참가자 선택 카드 안의 <b>다음 →</b> 버튼 바로 위로 옮겼어요. 기존 '이어서 하기' 버튼은 없애고 <b>다음 →</b>로 통일했어요.</li><li><b>내 스코어 관리 임시저장</b>: 내 스코어 관리의 홀별 점수 입력과 스코어카드 확인 화면에도 <b>💾 임시저장·종료</b> 버튼이 있어요. 임시저장한 내용이나 닫고 나온 진행중 화면이 없으면 초기화면·단체전 홈에 이어가기 버튼은 보이지 않아요(단체전 결과를 저장·가져오면 이어가기도 사라져요).</li><li><b>이어가기 버튼 분리·단체전 임시저장</b>: 진행중 이어가기는 <b>개인·팀 대항 초기화면</b>(내기 게임·내 스코어)과 <b>단체전 홈</b>(단체전 화면)에 따로 나와요. 단체전 이어가기 밑에도 <b>임시저장 지우기</b>가 있어요(위치만 지우고 단체전 자료는 그대로). 단체전 입력 화면의 '← 단체전 홈으로' 버튼은 <b>💾 임시저장 후 종료</b>로 바뀌었고, 누르면 저장하고 단체전 홈으로 돌아와요.</li><li><b>진행중 화면 바로가기 · 항상 초기화면</b>: 앱을 열면 언제나 초기화면으로 들어와요. 종료하지 않고 닫은 내기 게임·내 스코어 관리는 초기화면 맨 위 <b>▶ 진행중인 화면으로 가기</b>에서 이어가고, 단체전 자료가 있으면 <b>단체전 이어가기</b> 버튼도 보여요. 점수 입력 화면에는 <b>💾 임시저장 후 종료</b> 버튼이 있어 눌러 초기화면으로 나올 수 있어요(임시저장은 '임시저장 지우기'로 지울 수 있어요).</li><li><b>기록 삭제 확인</b>: 기록관리의 날짜별 기록에서 삭제를 누르면 <b>저장 / 취소</b> 버튼이 나와요. 저장을 눌러야 삭제가 확정돼요.</li><li><b>점수입력 팝업 닫기(×)</b>: 스코어카드형 팝업 오른쪽 위 ×를 누르면 다음 홀로 넘어가지 않고 그냥 닫혀요.</li><li><b>말로 입력 삭제 · 내기시작/내기종료 버튼 이동</b>: 말로(음성·녹음) 점수 입력 기능을 모두 없앴어요. '이 홀부터 내기 시작'과 '여기까지로 결과 확정' 버튼은 <b>내기시작 / 내기종료</b>로 이름을 바꿔 '홀별 점수 입력' 제목 옆으로 옮겼어요.</li><li><b>핸디 입력·골프존식 스코어카드</b>: 홀별 점수를 타수가 아니라 <b>파 기준 핸디(0, +1, −1…)</b>로 입력해요(플레이 입력창·내 스코어·확인/수정 표 모두). 결과 스코어카드는 골프존 화면처럼 HOLE / Par / Score / Putt 줄과 T 합계로, 버디는 ♡, 보기는 □, 더블은 이중 □, 멀리건은 ✓로 보여요. 기록 값은 <b>76타(+4)</b> 형태로 표시하고, 평균·베스트·워스트·산포는 핸디 숫자로 계산한 뒤 현재 코스 파(71/72/73)에 더해 타수(핸디)로 보여요.</li><li><b>안내문 조편성 표 개편</b>: 티오프 시간은 왼쪽 첫 열, 코스 이름은 맨 윗줄로 두고 칸 안에는 조원 이름만 가로로 나열하는 표로 바꿨어요(조원 이름은 가로로 나열하고 이름 아래에 성별 M/F, 조장은 성별 옆에 작은 빨간 "·조장" 글씨(M·조장), 차량운행자는 이름 앞에 파란 ★). 차량별 탑승은 차량마다 카드로 나눠 읽기 쉽게 정리했어요.</li><li><b>명단 이름 저장 버튼</b>: 모임 명단에 이름(필요하면 성별·핸디)을 입력한 뒤 "💾 저장"(또는 키보드 Enter)을 누르면 명단에 저장되고 입력칸이 비워져요. 저장 결과는 카드 아래에 안내돼요.</li><li><b>모임 명단 펼치기</b>: 모임·명단 관리의 명단 목록(이름·핸디·성별·추가·캡처 올리기)을 "📋 모임명 명단 (n명)" 줄로 접어 두고, 눌러서 펼쳐 쓰도록 화면을 간소화했어요.</li><li><b>카톡방 명단 캡처 자동입력</b>: 단체전 설정의 모임·명단 관리에서 "카톡방 명단 캡처 올려서 자동입력"을 누르고 단체 카톡방 참여자 목록 캡처(여러 장 가능)를 올리면 이름만 뽑아 그 모임 명단에 추가해요. 이미 있는 이름은 건너뛰어요. 사진 분석을 쓸 수 없는 환경이나 인식 오류일 때는 직접 추가하라는 안내가 나와요.</li><li><b>구장명 입력 즉시 펼침</b>: 라운딩 정보에서 구장명을 입력하기 시작하면 아래 항목이 바로 펼쳐져요(칸 밖을 누를 필요 없음). 키보드의 완료(Enter)를 누르면 키보드가 닫혀요.</li><li><b>성별 인식코드(M/F)</b>: 모임 명단과 조별 명단에서 사람마다 <b>M(남성)·F(여성)</b>를 체크할 수 있어요. 기억된 이름을 고르거나 저장된 조별 명단을 불러오면 성별이 자동으로 체크되고, 안내문의 조별 이름 옆에도 (M)·(F)로 표시돼요.</li><li><b>그래프 점선 ±1σ</b>: 평균 스코어 그래프의 빨강 점선을 평균 ±1σ로 맞추고, "±1σ 영역은 통계적으로 전체 데이터의 약 68%가 들어오는 범위"라는 설명을 함께 표시해요.</li><li><b>산포 표시 변경</b>: 통계의 산포 항목을 "평균 ±1σ" 범위(예: 86~94타) 중심으로 보여 주고, 옆에 σ 값을 작게 표시해요.</li><li><b>파 합계 불일치 경고</b>: 파3·파5(파6) 홀 수로 계산한 코스 파 합계가 위에서 고른 파(71·72·73)와 다르면 합계 줄이 초록에서 <b>빨강</b>으로 바뀌고 "선택한 코스 파와 맞지 않아요"라고 알려줘요.</li><li><b>파4 자동 계산</b>: 라운딩 정보의 코스 파에서 파4 홀 수 입력칸을 없애고, 18홀에서 파3·파5(파6)를 뺀 값으로 자동 계산해요.</li><li><b>코스 파 홀 수 입력 개편</b>: 라운딩 정보의 코스 파(71·72·73)마다 파3·파4·파5(파73은 파6 포함) 홀 수를 각각 +/−로 조정할 수 있고, 조정하는 즉시 합계 홀 수와 코스 파가 계산돼 보여요. 처음 값은 파71 5/9/4, 파72 4/10/4, 파73 4/9/5/0이에요.</li><li><b>단체전 운영자 자동·모임 명단 관리</b>: 단체전 설정에서 운영자 이름 입력칸을 없애고 내 사용자 이름을 운영자로 자동 인식해요. 그 자리에 <b>모임·명단 관리</b> 카드가 생겨 모임명을 정하고 명단과 개인별 핸디를 추가·삭제할 수 있어요. 조에 입력한 이름과 핸디는 모임 명단에 자동 저장되고, 같은 이름이 있으면 홍길동1처럼 번호가 붙어요.</li><li><b>단체전 모임명 연동</b>: 주최·모임명을 기억하고 칸 아래 "기억된 모임"을 눌러 바로 입력할 수 있어요. 명단을 확정하면 그 모임명으로 이름이 묶여 기억되고, 이름 칸을 눌렀을 때 해당 모임에 속한 명단이 먼저 나와요("전체"로 바꿔 볼 수 있어요). 모임 "정리"로 모임 삭제도 돼요.</li><li><b>단체전 명단 입력 개선</b>: 이름 칸을 누르면 지금까지 입력한 이름이 <b>가나다순</b>으로 나와 눌러서 고르거나 직접 입력할 수 있어요(목록 정리로 삭제 가능). 이름과 함께 <b>핸디</b>도 기억해요. 사람마다 <b>핸디</b>를 체크하면 평균 핸디 입력칸이 열리고 기억된 핸디가 처음 값으로 나와요. 체크하지 않으면 기본 85로 계산해요.</li><li><b>팀별내기: 총타수 / 업다운</b>: 팀별내기를 누르면 <b>총타수</b>(기존 팀별내기)와 <b>업다운</b>을 고를 수 있어요. 업다운은 홀마다 팀 합산 타수 또는 베스트볼로 승패를 가리고(이긴 홀 +1, 진 홀 −1), 정산은 ① 업 수 × 금액 ② 홀마다 정산 ③ 승패만 보고 상·벌 중에서 골라요.</li><li><b>게임 진행 점수 입력 화면 개편</b>: 모든 게임의 홀별 입력이 내 스코어와 같은 <b>목록형 / 스코어카드형(팝업)</b>으로 바뀌었어요. 동반자 모두의 타수를 한꺼번에 입력하고, 퍼트·멀리건도 그대로 쓸 수 있어요.</li><li><b>스코어카드로 자동입력</b>: 라운딩 정보의 <b>구장명</b> 오른쪽 <b>자동입력</b>의 <b>📷 촬영</b> 또는 <b>🖼 업로드</b> 버튼으로 스코어카드를 찍거나 사진 파일을 올리면 <b>구장명·코스명·홀별 파·명단</b>을 읽어 자동으로 채워요. 사진 분석을 쓸 수 없는 환경이거나 제대로 읽지 못하면 자동입력이 불가능하다고 안내하니 직접 입력하세요.</li><li><b>라운딩 정보 다시 접기</b>: 세부 내용까지 입력하고 <b>✔ 입력</b>으로 확정하면 날짜·구장명과 한 줄 요약만 남고 나머지는 다시 접혀요. 바꾸려면 <b>✏️ 수정</b>을 누르세요.</li><li><b>첫 화면 짧게</b>: 기록 창은 <b>평균 타수·파 대비·게임 수</b>까지만 보이고 아래는 <b>📂 기록 상세 ▾</b>로 접혀요. 라운딩 정보는 제목 오른쪽에서 <b>필드/스크린</b>을 고르고, 처음에는 <b>날짜와 구장명</b>만 보이다가 구장명을 입력하면 나머지가 펼쳐져요. <b>🎮 게임 선택</b> 카드는 이제 접지 않고 항상 펼쳐져 있어요(팀로테이션 접기는 그대로).</li><li><b>입력 후 다음 홀로</b>: 스코어카드형에서 팝업의 <b>입력</b>을 누르면 초록 활성화 표시가 자동으로 <b>다음 홀</b>로 넘어가요(마지막 홀은 그대로).</li><li><b>스코어카드형 표 간소화</b>: 표에는 홀별 ['★ 타당내기 게임룰',`<ul><li>옵션 저장: tapBd(off/cur/next/both), tapTr(bird/tie3/big), tapO(ob/hz/bk/tb/p3), tapOm(off/1/2/inf), tapBb(off/stroke/fixed)+tapFix. 기록의 bo에 함께 저장돼 과거 기록은 그 시점 규칙으로 계산.</li><li>배판: 조건이 나온 홀(당홀) 또는 다음 홀 또는 둘 다 2배. 수동 배판과 큰 값 적용.</li><li>OECD: 선수·홀마다 OB·해저드·벙커·3퍼트 횟수(홀 데이터 oe)와 트리플 이상(점수로 자동)을 합산, 최대 횟수로 제한, 1건=1타를 그 선수 타수에 더해 정산(배판 곱함). 적용안함이면 계산 안 함.</li><li>상금: 타당금액 추가 = 버디 1·이글/홀인원 2·알바트로스 3타(배판 적용) / 정액 = 입력 금액(이글 2배·알바트로스 3배, 배판 무관).</li><li>각 선수 점수 입력 줄 아래에 OECD 카운터(선택한 종류만, 최대 횟수가 적용안함이면 숨김).</li></ul>`],

['★ 내정보 화면·백업',`<ul><li>홈 아이콘 5개: 점수입력·내기게임·단체전·내정보·사용 방법. 내기록 카드에서 라운딩 기록 관리를 뺐다.</li><li>내정보 화면: 이름(변경 불가), 성별, 생년월일(만 나이 자동), 구력(년) 입력 → 즉시 저장(gg_prof). 핸디캡은 입력 불가, 내기록 18홀 평균 핸디(필드·스크린 따로)를 자동 표시. 앱 어디서든 PROF()로 읽는다. 현재 연결: 게임 개인 핸디 칸의 "내 핸디캡 불러오기".</li><li>내정보 화면 아래 "기록 관리": 기존 라운딩 기록 관리 구성 그대로(백업 저장·복원 버튼, 마지막 백업 날짜, 약 5줄 높이 스크롤 목록 + 보기·삭제·삭제 확인). 목록은 필드·스크린 전체이며 스크린 기록은 🖥 표시. 처음부터 펼쳐져 있고 ▲▼로 접는다.</li><li>백업 저장: 이름·내정보·이력·단체전·코스 정보를 파일로 저장(폰 다운로드 폴더, 클로드 화면에서는 저장 확인창). 백업 복원: 기록은 합치고 내정보는 비어 있는 칸만 채운다.</li><li>☁️ 외부 서버로 내보내기: https 주소를 입력하고 누르면 백업 내용(JSON)을 POST로 전송. 주소는 기기에 기억. 서버가 막으면 응답 확인 없이 전송만 하고, 안 되면 실패 안내. 클로드 화면에서는 외부 전송이 막힐 수 있음.</li></ul>`],
['★ 홈 메뉴 개편 (점수입력·내기게임·단체전)',`<ul><li>탭(개인·팀 대항/단체전) 삭제. 홈 화면 = 아이콘 메뉴 4개(점수입력·내기게임·단체전·사용 방법, 입체 SVG; 제목 줄의 사용 방법 버튼은 없애고 설명서가 열렸을 때만 ✕ 닫기 표시) + 이어가기 카드 + 내기록 카드.</li><li>라운딩 정보 카드는 홈에서 빼고, 메뉴를 고른 뒤 전환된 화면(점수입력·내기게임·단체전)에서 입력.</li><li>점수입력 = 기존 내 스코어 화면(촬영·파일·직접 입력). 라운딩 정보를 확정하면 입력 가능.</li><li>내기게임 = 기존 게임 선택 화면(개인대항·팀별대항). 홈의 내 스코어 버튼은 삭제(점수입력 아이콘으로 이동).</li><li>단체전 첫 화면의 사용자 이름 표시 창과 탭 안내 문구 삭제(이름이 없을 때만 입력 칸 표시).</li><li>홈이 아닌 화면 위에는 "🏠 홈으로" 버튼. 게임 진행·결과 화면에서는 숨김(임시저장 후 종료 사용). 게임 종료·임시저장·내 스코어 저장 후에는 항상 홈으로 돌아옴.</li></ul>`],
['★ 이어가기 분리·단체전 임시저장',`<ul><li>진행중 이어가기 카드는 홈 화면(게임)과 단체전 홈(단체전)에 따로 둔다.</li><li>단체전은 마지막으로 연 입력 화면 위치를 기억(gg_tmpos)해 "단체전 이어가기"로 그 화면에 간다. "임시저장 지우기"는 위치만 지운다.</li><li>단체전 입력 화면의 "단체전 홈으로" 버튼은 "임시저장 후 종료"로 이름을 바꾸고 저장 후 단체전 홈으로 돌아온다.</li></ul>`],
['★ 시작 화면·진행중 이어가기',`<ul><li>앱을 열면 항상 초기화면. 종료 없이 닫은 게임·내 스코어는 임시저장(gg_pause)으로 옮겨 두고, 초기화면 맨 위 "진행중인 화면으로 가기" 카드에서 이어간다(저장된 게임이 새 게임으로 덮이는 경우는 가장 최근 것만 유지).</li><li>단체전 자료가 있으면 "단체전 이어가기" 버튼.</li><li>홀별 점수 입력(내기 게임·내 스코어)에 "임시저장 후 종료" 버튼 → 초기화면.</li></ul>`],
['★ 점수입력 팝업 닫기',`<ul><li>스코어카드형 점수입력 팝업 오른쪽 위에 × 버튼. 누르면 입력·이동 없이 닫힌다.</li></ul>`],
['★ 말로 입력 삭제·내기 버튼',`<ul><li>말로 입력(음성·녹음) 기능은 삭제됨.</li><li>(이후 삭제) 내기시작/내기종료 버튼은 제거하고 결과 화면의 게임홀지정으로 대체했다.</li></ul>`],
['★ 핸디 입력·스코어카드 표시',`<ul><li>홀별 점수 입력은 모든 화면에서 파 기준 핸디(+1/−1/0). 내부 저장은 타수.</li><li>결과 스코어카드는 골프존 화면 형식(HOLE/Par/Score/Putt, T, ♡·□·이중□·✓).</li><li>통계 값은 N타(±H) 표기, 평균·베스트·워스트·산포는 핸디로 계산 후 현재 코스 파에 더함.</li></ul>`],
['1. 앱 개요와 사용 환경',`<p>한골프(HanGolf)는 폰만 쓰는 사용자가 골프 내기 정산, 스코어·퍼트 기록, 단체전 운영을 한 앱에서 처리하는 단일 HTML 앱이다. 현재 코드에 남아 있는 요구만 적는다.</p><table class="rqt"><tr><th>구분</th><th>Claude 앱에서 연 링크</th><th>GitHub 링크</th></tr><tr><td>주 사용자</td><td>운영자(본인)</td><td>동반자(안드로이드·아이폰, Claude 없이)</td></tr><tr><td>사진 분석</td><td>가능</td><td>불가, 직접 입력으로 대체</td></tr><tr><td>기록 저장소</td><td>따로</td><td>따로</td></tr></table><ul><li>이름은 "한골프 / HanGolf", 부제는 "골프 내기", 아이콘은 스윙하는 골퍼다. 모든 화면 문구는 한국어다.</li><li>사용자는 PC 없이 폰만 쓴다. 배포 파일은 golf.html 하나이고, 업로드할 때 같은 이름으로 교체한다.</li><li>Claude 앱 링크는 수정할 때마다 같은 주소로 갱신한다.</li><li>기록은 폰 브라우저 안에만 저장한다. 두 링크는 저장소가 서로 달라서 백업 저장 후 복원으로 합친다.</li><li>사진 분석(스코어카드 읽기 등)은 Claude 앱 안에서만 된다. 그 밖의 환경에서는 안내 문구를 보여 주고 직접 입력을 쓰게 한다.</li></ul>`],
['2. 공통 화면 틀과 디자인',`<ul><li>제목 영역: 로고, "한골프 / HanGolf · 골프 내기", 오른쪽에 "사용 방법" 버튼(열면 "닫기").</li><li>홈 화면은 제목 아래에 입체 아이콘 메뉴 3개(점수입력·내기게임·단체전)가 있고 그 아래에 내기록 카드가 있다. 메뉴를 고르면 화면이 바뀌고(라운딩 정보 입력은 그 화면에서), 위에 "🏠 홈으로" 버튼이 나온다. 단체전 입력 위치는 홈으로 나가도 남는다.</li><li>모든 화면은 폰 폭 기준이다. 설명은 짧게, 접을 수 있는 곳은 접어 둔다.</li><li>디자인은 짙은 숲 초록 + 금색 포인트, 흰 카드, 얇은 테두리, 부드러운 그림자다. 라이트·다크 모두에서 글자가 잘 보여야 한다.</li><li>버튼: 기본은 초록, 보조는 흰 바탕+테두리, 강조는 금색, 위험은 빨강. 숫자 조절은 − / + 이고 한계에 닿으면 흐려지며 잠긴다. 선택 버튼은 선택되면 초록으로 채워진다.</li><li>사용 방법 화면은 항목을 눌러 펼치는 방식이고 문장은 짧게 쓴다.</li></ul>`],
['3. 기록 관리 (이름 · 백업 · 이력 · 통계)',`<p>홈 화면의 아이콘 메뉴 아래 카드(내기록)이며, 사용자 이름이 있어야 이력과 통계가 쌓인다.</p><h4>사용자 이름</h4><ul><li>앱을 처음 쓸 때 한 번만 입력하고 확정한다. 확정 전에 "바꿀 수 없어요" 확인을 거치고, 그 뒤에는 수정·초기화가 없다.</li><li>게임을 시작하려면 참가자 명단에 이 이름이 있어야 하고, 같은 이름의 선수 점수가 내 기록으로 저장된다.</li></ul><h4>백업과 복원</h4><ul><li>백업 저장은 이름·내정보·이력·코스 파 기억을 HanGolf-backup-날짜.txt로 내보낸다. 저장 위치는 내가 고른다(폴더 선택 창 또는 공유 창의 "파일에 저장"·드라이브·카카오톡 나와의 채팅 등). 마지막 백업 날짜를 보여 준다.</li><li>백업 복원은 이력을 합치고 중복을 거른다. 다른 사용자 이름의 백업은 거부한다. 예전 이름 표기(BG)의 백업도 받는다.</li></ul><h4>필드/스크린, 이력 목록</h4><ul><li>카드에는 평균 타수·게임 수가 보이고, 세부 통계는 "📈 통계" 제목 오른쪽 ▼를 눌러 펼친다. "🗂 라운딩 기록 관리" 제목 오른쪽 ▼를 누르면 일자별 기록이 약 5줄 높이로 나타나며 손가락으로 밀어 스크롤한다.</li><li>기록과 통계는 "필드"와 "스크린"이 따로이며 카드 안의 탭으로 바꿔 본다. 예전 기록은 필드로 본다.</li><li>이력은 최근 20건을 날짜·구장·타수(파 대비)로 보여 준다. 확정된 기록은 자물쇠, 단체전 기록은 메달과 "단체전 N위/M명"을 붙인다. 각 줄에 "보기"와 "삭제"가 있고, 삭제를 누르면 "저장 / 취소" 버튼으로 한 번 더 확인한다(저장 시 확정, 되돌릴 수 없음).</li></ul><h4>통계</h4><p>기본 3칸(평균 타수, 파 대비, 게임 수)은 탭 안의 모든 기록으로 계산한다. 그 아래 통계는 다음 규칙을 따른다.</p><table class="rqt"><tr><th>통계</th><th>계산</th></tr><tr><td>베스트 / 워스트 스코어</td><td>18홀 전 경기 중 가장 낮은 / 높은 타수</td></tr><tr><td>평균스코어</td><td>최근 20경기에서 최저타·최고타를 하나씩 뺀 경기의 평균(3경기 미만이면 빼지 않음). 칸을 누르면 최근 20경기 스코어를 연결선 그래프로 보여 주고 평균과 평균 ±1σ(통계적으로 전체 데이터의 약 68%가 존재하는 영역임을 안내 문구로 함께 표시)를 선으로 표시한다.</td></tr><tr><td>그린적중률</td><td>위 경기 중 퍼트를 입력한 경기에서 GIR 홀의 비율</td></tr><tr><td>평균 파세이브율</td><td>경기별 파세이브율의 평균(GIR 실패 홀이 있는 경기)</td></tr><tr><td>평균 퍼트</td><td>위 경기 중 퍼트를 입력한 경기의 경기당 퍼트 수 평균</td></tr><tr><td>한 경기 평균 홀 결과</td><td>위 경기들에서 버디(이글 이상 포함)·파·보기·더블이하가 한 경기에 평균 몇 개인지. 홀별 점수가 있는 기록만 계산하고 경기 수를 같이 표시한다.</td></tr><tr><td>산포 (평균 ±1σ)</td><td>평균 타수 ± 표본 표준편차 σ 범위를 주 값으로 크게 표시하고, 옆에 σ 값을 작게 표시한다 (2경기 이상)</td></tr></table><ul><li>GIR은 (홀 타수 − 퍼트)가 파−2 이하인 홀이다(파3은 1, 파4는 2, 파5는 3 이하). 파세이브율 = (GIR 실패 홀 중 파 이상으로 막은 홀 ÷ GIR 실패 홀) × 100%.</li><li>통계·평균 타수·게임 수·내정보 핸디는 18홀 기록만 계산한다(18홀 미만은 이력에만 저장, 통계 제외). 퍼트가 "없음"인 기록은 퍼트가 필요한 통계에서 빠지고 스코어 통계에는 들어간다. 값 옆에 계산한 경기 수 (N경기)를 붙인다.</li><li>가상 선수 점수는 기록과 통계에 들어가지 않는다.</li></ul>`],
['4. 라운딩 정보',`<p>날짜·구장만 있으면 확정할 수 있고, 나머지는 기본값이 있는 선택 항목이다. 첫 화면을 짧게 하려고 카드 제목 오른쪽에 필드/스크린 버튼을 두고, 처음에는 날짜와 구장명만 보인다. 구장명을 입력하면(입력 칸을 벗어나거나 CC/GC를 고르면) 나머지 항목과 "✔ 입력" 버튼이 펼쳐진다. 접힌 칸의 값은 그대로 유지된다. 확정(✔ 입력)하면 다시 접히고 날짜·구장명과 한 줄 요약(경기 방식·인원·파·명단)과 "✏️ 수정" 버튼만 보인다.</p><table class="rqt"><tr><th>항목</th><th>요구</th></tr><tr><td>날짜</td><td>필수. 비면 "날짜를 입력해 주세요"라고 안내한다.</td></tr><tr><td>구장명</td><td>필수. 이름만 쓰고 오른쪽에서 CC / GC / 붙이지 않음을 고른다. 중복해서 붙이지 않고, 저장될 구장명을 미리 보여 주며, 이전에 쓴 구장을 추천한다.</td></tr><tr><td>전반·후반 코스 이름</td><td>선택. 구장명 아래에 전반 코스·후반 코스 이름(예: 레이크, 힐)을 넣는다. 9홀×2를 체크하면 칸이 하나만 나온다.</td></tr><tr><td>경기 방식</td><td>필드(기본) / 스크린. 기록과 통계가 따로 쌓인다.</td></tr><tr><td>코스 파</td><td>파71 / 파72(기본) / 파73 선택 후 파3·파5(파73은 파6 포함) 홀 수를 각각 독립적으로 조정하고 파4는 18−(나머지)로 자동 계산한다(입력칸 없음). 초기값 파71=5/9/4, 파72=4/10/4, 파73=4/9/5/0. 조정 즉시 합계 홀 수와 코스 파 합계를 계산해 보여 주며 계산된 코스 파가 선택한 파와 다르면 합계 줄을 빨강으로 바꾸고, 홀 수 합계가 18이 아니면 경고하며 게임 시작을 막는다. 가상 선수 점수 계산에 쓴다.</td></tr><tr><td>9홀×2</td><td>체크박스(기본 해제). 같은 9홀을 두 번 돌 때 체크한다(7번 참고).</td></tr><tr><td>인원수</td><td>2·3·4인(기본 4인). 3인이면 팀 게임에서 가상 선수가 들어간다.</td></tr><tr><td>명단</td><td>앱을 열 때마다 빈칸으로 시작하고 모든 칸을 직접 입력한다(인원수와 사용자 이름은 유지). 이름은 10자까지다.</td></tr></table><ul><li>자동입력: 구장명 글자 오른쪽의 "자동입력" 옆 "📷 촬영"·"🖼 업로드" 버튼으로 스코어카드를 찍거나 그림 파일을 올리면 구장명·전/후반 코스명·홀별 파(9 또는 18개, 각 3~6)·명단(최대 4명, 인원수 자동 설정)을 읽어 채운다. 읽은 파는 코스별로 기억된다. 사진 분석을 쓸 수 없는 환경(Claude 앱 밖 등)이거나 분석에 실패하면 "자동입력이 불가능하니 직접 입력해 달라"는 빨간 안내를 띄우고 아무것도 바꾸지 않는다. 일부만 읽히면 읽은 항목만 채우고 나머지는 직접 입력하라고 안내한다(Claude 앱에서만).</li><li>확정(입력)을 누르면 모든 칸이 잠기고 "수정"으로 다시 푼다. 명단은 게임 화면에 그대로 쓰이며 게임 화면에서는 이름이 읽기 전용이다.</li></ul>`],
['5. 코스 홀별 파 기억',`<ul><li>점수를 저장하면(홀별 입력 게임, 사진으로 읽은 스코어카드, 내 스코어 모두) 그 코스의 홀별 파를 기억하고, 다음에 같은 코스를 고르면 점수 입력 화면에 홀별 파가 처음 값으로 들어간다.</li><li>코스 이름을 넣으면 구장 + 코스 이름별로 9홀씩 기억한다. 전반은 전반 코스의 파, 후반은 후반 코스의 파가 들어가고 순서를 바꿔 가도 맞는다. 이름이 없거나 그 코스의 기억이 없으면 구장 전체(18홀) 기억을 쓴다.</li><li>모든 홀이 파4인 기록은 기억하지 않는다. 9홀 기록이 18홀 기억을 덮어쓰지 않는다. 같은 코스를 다시 저장하면 최근 파로 바뀐다.</li><li>코스 이름은 CC·GC·골프장·'코스' 같은 끝말이 달라도 같은 코스로 본다.</li><li>라운딩 정보의 코스 카드에서 "기억 지우기"로 지운다. 기억한 파는 백업 저장·복원에 들어간다.</li></ul>`],
['6. 내 스코어 (내기 없이 점수만 기록)',`<p>내기 없이 점수를 기록해 이력과 통계에 쌓는 기능이며 라운딩 정보 바로 아래의 고정 카드다. 버튼 아래에 "게임 진행 시 점수가 자동 입력되므로 별도 입력 불필요" 안내가 있다.</p><ul><li>시작 조건: 사용자 이름이 있고 라운딩 정보가 확정되어 있어야 한다. 저장 후 시작 화면으로 돌아와 "저장했어요"를 잠시 보여 준다.</li></ul><h4>입력 방법 세 가지</h4><ol><li>사진 분석(Claude 앱에서만): 스코어카드를 촬영하거나 올리면 점수를 읽어 온다. 표에서 확인·수정 후 저장한다.</li><li>직접 입력 ① 총 타수만: 홀 수(18/9), 내 총 타수, 코스 파 합계(기본 72)를 넣는다. 홀별 정보가 없어 퍼트·그린적중 통계에는 들어가지 않는다.</li><li>직접 입력 ② 홀별: 홀마다 파·타수·퍼트·멀리건을 입력한다.</li></ol><h4>홀별 입력 화면</h4><ul><li>홀 번호를 누르면 그 홀이 진한 초록 바탕으로 활성화되고, 활성화된 홀에만 − / + 가 나온다. 홀의 숫자나 체크를 건드려도 활성화된다.</li><li>파는 3~6(처음 4), 타수는 1 이상(처음에는 파와 같고, 파를 바꿀 때 건드리지 않았다면 같이 바뀐다).</li><li>퍼트는 처음부터 모든 홀이 퍼트 2인 입력중 상태다. 입력하고 싶지 않으면 표 맨 위(스코어카드형은 표 위)의 "퍼트"를 눌러 없음으로 바꾸고, 다시 누르면 모든 홀이 퍼트 2로 시작한다.</li><li>입력 화면 모양은 "목록형"(기본, 홀마다 − / +)과 "스코어카드형"(전반·후반 표에서 칸을 누르면 팝업창이 열려 목록형과 같은 − / + 와 멀리건 체크로 입력하고, "입력"을 누르면 표로 돌아온다. 팝업에서 ◀ ▶ 로 앞뒤 홀로 옮길 수 있다) 중 고른다. 고른 모양은 이 폰에 저장되어 바꾸기 전까지 유지된다.</li><li>멀리건: 홀마다 OB(+2) 또는 해저드(+1) 중 하나만 체크한다. 멀리건을 쓴 뒤의 타수를 입력하고 체크하면 점수에 더해지고 퍼트는 그대로다.</li><li>버디 이하는 초록, 더블보기 이상은 빨강. 18홀이면 9번 홀 아래에 전반 합계, 맨 아래에 합계를 보여 준다.</li></ul><h4>저장과 확정</h4><ul><li>"저장 (스코어카드 확인)"을 누르면 전반·후반 스코어카드(퍼트·그린적중 ●○, 멀리건 줄)가 나온다. 틀린 칸은 눌러서 고친다.</li><li>퍼트가 그 홀 타수보다 많으면 확정할 수 없다. "확정"을 누르면 기록에 저장되고 수정할 수 없다.</li></ul>`],
['7. 게임 선택과 설정',`<p>게임 선택 카드는 접지 않고 항상 펼쳐 둔다(팀로테이션 항목만 접는다). 팀별내기는 누르면 "총타수 / 업다운" 하위 항목이 나오고 그중 하나를 고른다. 개인대항과 팀별대항에서 각각 한 가지씩, 또는 하나만 고른다.</p><table class="rqt"><tr><th>구분</th><th>게임</th><th>한 줄 설명</th></tr><tr><td>개인대항</td><td>개인별순위</td><td>핸디를 뺀 총 타수로 순위를 매기고 순위별 상·벌을 정한다</td></tr><tr><td>개인대항</td><td>타당내기</td><td>1타당 금액으로 두 사람씩 타수 차이만큼 돈을 주고받는다</td></tr><tr><td>팀별대항</td><td>팀로테이션 · 벌금게임</td><td>2홀씩 팀을 바꿔 겨루고 진 팀이 벌금을 낸다</td></tr><tr><td>팀별대항</td><td>팀로테이션 · 벌점게임</td><td>진 팀이 벌점을 받고 벌점 순으로 총액을 나눠 낸다</td></tr><tr><td>팀별대항</td><td>팀로테이션 · 빼먹기게임</td><td>미리 모은 상금을 홀마다 이긴 팀이 가져간다</td></tr><tr><td>팀별대항</td><td>팀별내기</td><td>A팀과 B팀의 합산 타수로 승부하고 상·벌을 정한다</td></tr></table><h4>게임별 입력</h4><ul><li>공통: 시작·종료 홀 입력칸 없음(기본 모든 홀 포함). 18홀 종료 후 "게임홀지정"에서 스코어카드 체크로 구간 지정.</li><li>개인별순위: 선수별 핸디, 순위별 상·벌. 타당내기: 1타당 금액과 화폐 단위, 선수별 핸디.</li><li>벌금게임: 진 팀 벌금, 비겼을 때 벌금. 벌점게임: 벌금 총액(1,000원 단위)과 최대폭.</li><li>빼먹기게임: 총상금, 매홀 인당 상금액, 선수별 핸디(8번).</li><li>팀별내기: 명단에서 A조·B조를 고르고(인원을 맞춘다) 이긴 팀 상과 진 팀 벌.</li></ul><ul><li>팀 게임은 3~4명일 때만 선택할 수 있다. 2명이면 팀별대항은 선택할 수 없다. 3명이면 가상 선수가 들어간다(9번).</li><li>시작 버튼은 "게임 시작 (홀별 입력)"이고, 경기 후 사진으로 입력하는 "일괄입력(스코어카드)" 버튼은 홀별 입력 화면 안에만 있다(설정 화면에는 없음. 타당내기·빼먹기게임은 이 버튼이 없다. batchBtn()이 S.mode가 tap·prize면 빈 문자열).</li><li>시작할 때 막는 조건: 게임 선택, 사용자 이름, 라운딩 정보 확정, 인원수만큼의 명단, 명단에 내 이름 포함, 이름 중복 없음, 팀별내기 A·B조 인원 일치, 게임별 필수 칸 입력. 빠진 칸은 빨간 테두리와 안내로 알린다.</li></ul>`],
['8. 게임 진행 (홀별 입력)',`<h4>홀 입력 화면</h4><ul><li>모든 게임의 홀별 입력은 내 스코어와 같은 구성이다. 상단에서 "목록형 / 스코어카드형"을 고르고(선택은 내 스코어와 공유·유지), 동반자 전원의 타수를 함께 입력한다. 목록형은 홀 줄을 눌러 펼친 곳에서, 스코어카드형은 표의 칸을 눌러 열리는 팝업(◀ ▶ 홀 이동, 파·선수별 타수 − / +, 퍼트·멀리건)에서 입력하고 "입력"을 누르면 다음 홀로 넘어간다. 현재 홀은 초록으로 표시하고, 이미 친 홀을 눌러 고칠 수 있다.</li><li>퍼트 입력은 기본 켜짐(기본값 2)이며 끌 수 있다. 위쪽에 큰 "N번 홀"과 이전·다음 홀 화살표(◀ ▶)가 있고 지난 홀을 열어 고칠 수 있다.</li><li>기본 파 버튼은 파3·파4·파5·파6(처음 파4). 9홀×2이면 10번 홀부터 전반 같은 홀의 파가 미리 선택된다. 기억된 코스 파가 있으면 처음 값으로 들어간다.</li><li>선수마다 − / + 로 타수를 맞추고 처음 값은 파다. "다음 홀로"를 누르면 저장하고 넘어간다.</li><li>멀리건: 사용자 줄 아래(퍼트 옆)에 OB멀리건 +2, 해저드멀리건 +1 체크가 같은 줄에 있고 한 홀에 하나만 체크된다. 멀리건 사용 후 타수를 입력하고 체크하면 점수에 더해지며 퍼트는 그대로다. 지난 홀에서도 쓸 수 있고 기록 보기의 "멀리건 사용"에 나온다.</li></ul><h4>퍼트 입력 (사용자 본인 줄만)</h4><ul><li>"퍼트 없음" 버튼을 눌러야 입력되고 퍼트 2로 시작해 − / + 로 바꾼다. 그 홀의 내 타수보다 많을 수 없고 다음 홀은 다시 2로 시작한다.</li><li>게임 도중 처음 누르면 지난 홀 퍼트는 기본값 2로 채워진다. 입력 중에 누르면 "한 번 더 누르면 전체 없음"으로 바뀌고 한 번 더 누르면 모두 지워진다.</li></ul><h4>게임홀지정, 배판</h4><ul><li>게임 시작 때 betAuto()로 1번 홀부터 자동 계산(시작 전 설정은 모두 18홀 기준)(내기시작·내기종료 버튼 없음). 18홀 종료 후 결과 화면 "🎯 게임홀지정"(bn)에서 시작·종료 홀을 하나씩 체크해 구간을 바꾼다(미지정이면 전체 홀). 선택은 결산 집계에만 쓰고 핸디 배분 등 시작 전 설정은 항상 18홀 기준.</li><li>중간에 "⏹ 게임 종료"를 누르면 "입력한 N홀로 결과 보기"(endNow)로 점수 없는 홀을 버리고 입력된 홀 안에서만 구간을 지정한다. 결과 없이 닫으면 "중도 종료"(기록 제외).</li><li>벌금·벌점 게임은 구간의 홀 수가 홀수이면 마지막 홀은 계산에서 뺀다.</li><li>배판: 내기 중인 홀마다 단판 / 2배판 / 3배판 / 4배판을 고르고 그 홀 금액에 곱한다(다음 홀은 단판). 벌금·벌점 게임은 2홀 라운드 중 높은 배수를 쓴다.</li><li>빼먹기게임: 홀마다 팀 편성 방식(뽑기·좌타우타·전홀순위·전홀팀유지)을 고른다. 비기면 상금이 이월되고 상금이 떨어지면 추가할지 묻는다.</li></ul><h4>빼먹기게임 핸디</h4><ul><li>가상 선수 포함 제일 잘 치는 사람의 핸디는 0이고 나머지는 핸디 수(타)를 입력한다.</li><li>핸디는 게임 시작 때 18홀 전체에 무작위로 미리 나눈다(게임홀지정으로 구간을 바꿔도 배분은 그대로, 결산 집계만 바뀐다). 한 홀에 2타 이상은 없고, 핸디가 남은 홀보다 많으면 남은 홀 수만큼만 적용한다.</li><li>그 홀의 입력 타수에서 1타를 빼서 승패를 계산한다. 기록에는 입력한 타수가 그대로 남는다. 홀을 시작할 때 그 홀의 핸디 적용 선수를 안내한다.</li></ul><h4>중간 결과, 중단과 복귀</h4><ul><li>벌금·벌점 게임은 2홀 라운드가 끝날 때마다 라운드 결과를 보여 준다. 타당내기는 18홀 연속에서 9번 홀이 끝나면 전반 정산 화면이 나온다.</li><li>9홀×2이면 9번 홀 뒤 구간 결산이 나온다(정산 확인용, 게임은 계속). 끝난 구간은 "구간 결산"과 최종 결과의 구간별 결산에서 다시 본다. 벌금·벌점 게임은 9번 홀이 10번 홀과 한 라운드가 되어 다음 구간 결산에 들어간다.</li><li>진행 중인 게임은 앱을 껐다 켜도 이어지고 날짜가 바뀌면 사라진다. "게임 종료" → "중도 종료"한 게임은 기록에 포함되지 않는다.</li></ul>`],
['9. 게임별 규칙과 정산',`<p>정산은 게임홀지정으로 정한 시작 홀부터 종료 홀까지(기본 전체 홀)에만 적용하고 구간 밖 홀은 점수만 기록한다.</p><p><b>팀별내기 · 업다운</b>: A팀·B팀(각 2명, 3인이면 가상 선수 포함)이 홀마다 겨룬다. 홀 승패 기준은 시작 전에 "팀 합산 타수" 또는 "베스트볼(팀 내 낮은 타수)" 중 고른다. 낮은 팀이 홀을 이기고(+1업) 같으면 비기며, 홀마다 누적 업다운(예: A2업, AS)을 보여 준다. 정산은 ① 최종 업 수 × 1홀당 금액을 진 팀이 각자 낸다 ② 홀마다 각 팀이 진 홀 수 × 금액을 각자 내고 주고받은 차액도 보여 준다 ③ 돈 없이 승패만 보고 이긴 팀 상·진 팀 벌을 안내한다(시작 전 입력). 팀 핸디는 없다.</p><table class="rqt"><tr><th>게임</th><th>승패·순위 규칙</th><th>정산</th></tr><tr><td>개인별순위</td><td>(총 타수 − 핸디)가 낮은 순. 같으면 동순위</td><td>순위별 상·벌 문구(금액 계산 없음)</td></tr><tr><td>타당내기</td><td>두 사람씩 홀별 타수에 배판을 곱해 합산 타수 차이로 겨룸</td><td>차이 × 1타당 금액을 주고받음. 화폐 단위는 ₩ ¥ 元 $ € A$ HK$ 중 선택. 핸디는 시작 전에 정산한 것으로 보고 뺌</td></tr><tr><td>벌금게임</td><td>2홀씩 팀을 바꿔 겨룸. 팀 합산 타수에서 팀 핸디를 뺀 값이 낮은 팀 승</td><td>진 팀 인당 정해 둔 벌금, 비기면 비겼을 때 벌금. 배판은 라운드 안의 높은 배수</td></tr><tr><td>벌점게임</td><td>벌금게임과 같은 방식</td><td>진 팀이 벌점(비기면 0.5점), 벌점 순으로 총액을 최대폭 안에서 1,000원 단위로 나눠 냄</td></tr><tr><td>빼먹기게임</td><td>홀마다 팀을 짜서 핸디 적용 후 합산 타수가 낮은 팀 승</td><td>이긴 팀이 인당 매홀 상금액을 받음. 비기면 이월</td></tr><tr><td>팀별내기</td><td>A·B조 합산 타수에서 팀 핸디를 뺀 값이 낮은 팀 승</td><td>이긴 팀 상, 진 팀 벌 문구(비기면 무승부)</td></tr></table><ul><li>벌금·벌점 게임은 진행 중에도 "벌금·핸디·게임방식 변경"에서 설정을 바꿀 수 있다.</li><li>팀 핸디: 벌금·벌점 게임은 팀 조합마다, 팀별내기는 A·B팀마다 합산 타수에서 빼는 값이고 기본 0이다.</li><li>3인 게임에서 가상 선수는 벌금·벌점·상금 계산에서 제외한다.</li></ul>`],
['10. 가상 선수 (3인 게임)',`<p>3명이 치는 팀 게임의 4번째 자리를 채우는 가상 선수는 홀별 승패 판정에만 쓰이고, 돈과 기록에는 영향을 주지 않는다.</p><ul><li>팀로테이션(벌금·벌점·빼먹기)과 팀별내기에서 들어가고 개인별순위·타당내기는 3명 그대로 계산한다. 팀은 3명 + 가상 선수가 2명씩이며 팀로테이션은 2홀마다 짝이 바뀐다.</li><li>동수, 동우, 동미 중 한 명을 고른다. 홀 입력 화면에서는 이름 옆에 로봇 표시가 붙는다.</li></ul><table class="rqt"><tr><th>이름</th><th>기본 평균</th><th>조정 범위</th><th>홀별 구성 제한</th></tr><tr><td>동수</td><td>82타</td><td>78~86</td><td>버디 최대 2, 더블보기 최대 2, 트리플보기 최대 1, 나머지 파·보기</td></tr><tr><td>동우</td><td>90타</td><td>86~94</td><td>버디 최대 1, 더블보기 최대 4, 트리플보기 최대 2, 나머지 파·보기</td></tr><tr><td>동미</td><td>98타</td><td>94~102</td><td>버디는 평균 4게임에 1개꼴, 양파 최대 3, 나머지 파·보기·더블보기</td></tr></table><ul><li>평균 타수는 − / + 로 기본값에서 위아래 4타까지 바꾸고, 바꾼 값은 저장된다.</li><li>점수는 게임을 시작할 때 새로 만든다. 파3·파4·파5 홀 종류별로 버디·파·보기·더블 개수를 확률로 미리 나눠 순서를 섞고, 홀마다 입력자가 파 버튼을 누르면 그 종류의 점수를 순서대로 꺼내 넣는다. 18홀 합계는 평균 타수와 같고 9홀은 비례해 줄인다.</li><li>점수는 미리 정해지므로 진행 중에는 고칠 수 없다(− / + 버튼이 나오지 않는다).</li><li>정산표·결과 화면·공유 이미지에서 가상 선수 줄은 빠지고 "승패 판정에만 쓰인다"는 안내가 붙는다. 점수는 기록·평균 타수·통계에 들어가지 않는다.</li></ul>`],
['11. 결과 · 저장 · 기록 보기',`<ul><li>종료 홀까지 입력하면 결과 화면(게임별 정산과 스코어카드)이 나오고 "게임 종료 · 결과 저장" → "저장·종료"로 저장한다.</li><li>저장 기록에는 날짜, 구장, 총 타수와 파 대비, 홀 수, 필드/스크린 구분, 퍼트 입력 시 홀별 퍼트, 멀리건 사용 홀이 들어간다.</li><li>"일괄입력(스코어카드)"은 사진을 읽은 점수를 확인·수정하고 "스코어 최종 확정"(확인창 후)으로 저장과 확정을 한 번에 한다.</li><li>기록 상세(이력의 "보기"): 게임별 정산, 스코어카드, 구간별 결산, 퍼트·그린적중 표, "이 경기 파세이브율", 멀리건 사용.</li><li>결과 이미지 복사로 카톡에 붙여 넣는다. Claude 앱 안에서는 복사가 막힐 수 있어 이미지를 길게 눌러 공유한다.</li><li>결과 관리(확정 전): 스코어카드 수정하기(정산이 바로 다시 계산됨), 스코어카드 사진으로 대조(Claude 앱), 결과 확정하기(확인창 후 잠금, 이후 수정 불가).</li></ul>`],
['12. 단체전 (운영자 · 참가자)',`<p>위쪽 "단체전" 탭의 별도 화면이다. 날짜·구장·경기 방식을 정하는 카드가 있고 사용자 이름이 없으면 입력 칸이 나온다. 이어서 "운영자"인지 "참가자"인지 고른다.</p><h4>운영자: 대회 설정</h4><ul><li>운영자: 내 사용자 이름으로 자동 설정(입력칸 없음). 모임·명단 관리: 모임명(주최·모임명으로도 사용), 모임별 명단·개인별 핸디 추가/삭제, 카톡방 명단 캡처 업로드 시 이름 자동 추가(사진 분석 가능한 환경에서만), 조에 넣은 이름·핸디 자동 저장, 동명이인은 이름 뒤 번호(홍길동1). 조 개수(1~16). 대회 요강: 대회명, 작성일, 일시·장소, 이동(출발 시간, 이동 시간 5분 단위), 비용(화폐단위, 그린피, 카트피·캐디피(한 조), 인당 결재금액 자동 계산), 중식 장소, 자유 행.</li><li>조 카드: 코스, 티오프 시간, 인원(2~4명), 이름 입력(이름 칸을 누르면 기억된 이름이 가나다순 창으로 나와 선택하거나 직접 입력, 명단 확정 시 이름과 핸디를 주최·모임명별로 묶어 기억하며(이름 팝업은 해당 모임 명단 우선, 전체 전환 가능) "목록 정리"로 삭제 가능), 조장(조마다 1명), 차량운행자(탑승자·캐디백 메모), 성별 M/F 체크(기억된 이름·저장된 조별 명단 불러오면 자동 체크, 안내문의 이름 옆에 (M)/(F) 표시), 핸디 체크(체크한 사람만 평균 핸디 입력칸을 열고 기억된 핸디를 처음 값으로 채운다, 처음 85, 체크 안 하면 기본 85로 계산).</li><li>비고, 대회 규정(기본 규정 편집·추가·삭제·기본값 복원). "안내문출력"으로 저장하고 안내문 이미지를 만든다.</li></ul><h4>운영자: 안내문</h4><ul><li>문서 형태 이미지: 녹색 머리글, 날짜·주최, 01 대회 요강, 02 티오프 시간 및 조편성(조장은 성별 옆 "·조장" 글씨, 차량운행자는 이름 앞 ★), 03 비고, 04 대회 규정. 글 버전도 함께 만든다.</li><li>공유는 이미지를 길게 눌러 하거나 "이미지 복사"·"글 복사". 고쳐서 다시 출력하면 "(수정 N차)"가 붙는다.</li></ul><h4>운영자: 경기 후 결과</h4><ul><li>조별 스코어카드나 골프장 전체 인원 결과서를 올려 읽는다(Claude 앱에서만). 결과서가 조별 카드보다 우선이고 표에서 고칠 수 있다. 명단에 없는 선수는 "명단 외"(핸디 85).</li><li>결산결과: 순위(타수 / 핸디 감안 / 신페리오 정렬), 버디·파·보기·더블 이상 개수, 홀인원·이글·알바트로스. 시상은 자동으로 정하고 칸을 눌러 고친다("한 사람 한 상" 옵션).</li></ul><table class="rqt"><tr><th>시상</th><th>기준</th></tr><tr><td>참피온</td><td>최저 타수</td></tr><tr><td>신페리오 우승</td><td>신페리오 점수 최저(동점이면 신페리오 핸디 낮은 쪽)</td></tr><tr><td>핸디우승</td><td>타수 − 핸디 최저(동점이면 핸디 낮은 쪽)</td></tr><tr><td>다 버디·다 파·다 보기·다 더블상</td><td>각 항목 개수가 가장 많은 사람</td></tr><tr><td>매구상</td><td>타수 − 핸디의 절대값이 가장 작은 사람</td></tr><tr><td>진보상</td><td>타수 − 핸디가 음수인 사람 중 가장 낮은 사람</td></tr><tr><td>격려상</td><td>최고 타수</td></tr></table><ul><li>신페리오: 숨겨 둔 12개 홀(전·후반 각 6홀: 파4 4개, 파3 1개, 파5 1개) 점수 합에서 파 합을 뺀 값 × 1.2를 그날 핸디로 쓴다(0~24.0). 신페리오 점수 = 총 타수 − 그날 핸디.</li><li>"시상결과출력"은 QR 코드가 든 이미지를 만든다(수정 시 "(수정 N차)"). 운영자 이름이 내 사용자 이름과 같고 내가 선수로 있으면 전체 인원 결과가 내 이력에 자동 저장된다.</li></ul><h4>참가자</h4><ul><li>우리 조 명단(첫 칸은 "나", 2~4명)을 입력하고 스코어카드를 올리면 이미지를 길게 눌러 단톡방에 보내고 읽은 점수를 이력에 저장한다.</li><li>사진 분석이 안 되면 "점수 직접 입력"으로 총 타수, 코스 파 합계, 홀 수를 넣어 저장한다.</li><li>운영자가 공유한 시상결과 이미지를 올리면 QR을 읽어 내 이력에 저장한다(어느 브라우저에서도 됨). 수정본이면 이전 기록을 갱신한다.</li><li>진행 중인 개인·팀 게임이 있으면 참가자의 사진 분석은 막고 안내한다.</li></ul>`],
['13. 사용 방법(도움말) · 업데이트 내역',`<ul><li>앱 안의 "사용 방법"은 현재 동작과 항상 일치해야 한다. 기능이 바뀌면 해당 항목과 아래 업데이트 내역도 같이 고친다.</li><li>항목 순서는 사용 흐름을 따른다: Claude와 크롬 비교표, Claude로 쓰는 방법, 크롬으로 쓰는 방법, 앱 열기·홈 화면 추가, 내 이름 입력, 게임 시작 전 입력, 게임 종류, 3인 게임, 홀별 입력·게임홀지정, 배판과 정산, 결과 저장과 공유, 코스 파·9홀×2·구간 결산, 코스 홀별 파 기억, 일괄 입력·내 스코어, 스코어 직접 입력·퍼트·통계, 단체전, 자주 묻는 질문, 업데이트 내역.</li><li>맨 아래 "업데이트 내역"에는 바뀐 기능을 최신순으로 적는다.</li><li>비교표에는 두 환경에서 되는 기능과 안 되는 기능을 적는다. 사진 분석과 단체전 카드·결과서 읽기만 환경에 따라 다르다.</li></ul>`],
['14. 요구사항 화면 (이 화면)',`<ul><li>사용자 이름이 "한진욱"일 때만 "사용 방법" 화면 맨 위에 "요구사항 정리서" 버튼이 보이고 화면이 열린다. 다른 이름이거나 이름이 없으면 버튼도 화면도 없다. (이름 기준의 간단한 제한이며 암호 보호는 아니다.)</li><li>내용은 앱 코드 안에 들어 있고 기능이 바뀔 때마다 함께 고친다. 맨 위에 마지막 수정일을 보여 준다.</li><li>"PDF로 출력"은 브라우저의 인쇄 창을 열고 "PDF로 저장"을 고르면 된다. 인쇄 창이 막힌 환경(예: Claude 화면 안)에서는 크롬에서 연 앱에서 쓴다.</li></ul>`],
['15. 배포 · 운영',`<ul><li>배포 파일은 golf.html 하나다. 제목은 "한골프-HanGolf", 홈 화면 이름은 "한골프", 아이콘은 스윙하는 골퍼다. 옛 서비스 워커와 캐시는 열 때 지운다.</li><li>GitHub Pages 주소는 sikerman6148.github.io/GG/golf.html이다. 같은 이름으로 올려 교체한다. 홈 화면 바로가기는 이름·아이콘이 바뀌면 다시 추가해야 새 모양이 된다.</li><li>사진 분석이 필요한 운영자는 Claude 앱 링크, 동반자는 GitHub 링크(크롬, 아이폰은 Safari)를 쓴다. 두 링크의 기록은 따로이므로 옮길 때는 백업 저장 후 복원을 쓴다.</li></ul>`],
['16. 안드로이드 앱(APK) 배포',`<p>안드로이드 사용자에게 설치형 앱을 나눠 주고 앱이 스스로 새 버전을 알려 주는 구조다.</p><ul><li>앱은 golf.html 을 그대로 담은 WebView 앱이다(패키지 kr.hangolf.app, 안드로이드 10 이상). 인터넷 없이도 열린다.</li><li>Claude 전용 기능(스코어카드 사진 분석 등)은 앱에서는 쓸 수 없다.</li><li>GitHub 저장소에서 golf.html 을 올리면 Actions 가 APK 를 서명해 빌드하고 Releases 에 올린 뒤 version.json(versionCode, versionName, apkUrl)을 갱신한다. versionCode 는 빌드 번호로 자동 증가한다. 서명 키(Keystore)는 저장소 비밀값(Secrets)에만 둔다.</li><li>앱은 시작할 때 version.json(없으면 최신 Release)을 확인해 새 버전이면 안내창 → 내려받기 → 설치 화면을 연다. 설치 버튼은 사용자가 한 번 눌러야 한다. 내려받는 주소는 이 저장소의 Releases 로 제한한다.</li><li>사용 방법의 "안드로이드 앱(APK) 설치·업데이트" 항목과 업데이트 내역에 같은 내용을 적는다.</li></ul>`]
];
const reqBody=()=>REQ.map(([t,b])=>`<h3>${t}</h3>${b}`).join('');
const reqScreen=()=>`<div class="card"><h2>📋 요구사항 정리서</h2><div class="sub">한진욱 전용 화면이에요 · 마지막 수정 ${REQ_UPD}<br>기능이 바뀔 때마다 이 내용도 함께 고쳐요.</div><button onclick="reqPrint()" style="margin-top:10px">🖨 PDF로 출력</button><div id="rqmsg" class="sub" style="margin-top:6px"></div></div>`+REQ.map(([t,b],i)=>`<div class="card" style="padding:0"><details><summary style="padding:14px 16px;font-weight:800;font-size:16px">${t}</summary><div class="rq" style="padding:0 16px 14px;line-height:1.7;font-size:15px">${b}</div></details></div>`).join('')+`<button class="g" onclick="closeReq()">← 돌아가기</button>`;
function openReq(){if(!isOwner())return;snap();tmSnap();S.help=false;S.req=true;draw();window.scrollTo(0,0)}
function closeReq(){S.req=false;const x=document.getElementById('rqprint');if(x)x.remove();draw(true)}
function reqPrint(){if(!isOwner())return;const m=document.getElementById('rqmsg');
 try{let d=document.getElementById('rqprint');if(d)d.remove();d=document.createElement('div');d.id='rqprint';d.className='rq';
  d.innerHTML=`<h1>한골프(HanGolf) 요구사항 정리서</h1><div class="rqd">${REQ_UPD} 기준 · 한진욱 전용</div>${reqBody()}`;document.body.appendChild(d);
  if(m)m.textContent='인쇄 창에서 "PDF로 저장"을 고르세요.';window.print()}
 catch(e){const x=document.getElementById('rqprint');if(x)x.remove();if(m)m.textContent='이 화면에서는 인쇄를 열 수 없어요. 크롬에서 연 앱에서 눌러 주세요.'}}

function openHelp(){snap();tmSnap();S.help=true;S.req=false;draw();window.scrollTo(0,0)}
function closeHelp(){S.help=false;draw(true)}
const helpScreen=()=>`<div class="card"><h2>📖 사용 방법</h2><div class="sub">궁금한 항목을 눌러 펼쳐 보세요.</div>${isOwner()?`<button class="g" onclick="openReq()" style="margin-top:10px">📋 요구사항 정리서 (한진욱 전용)</button>`:''}</div>`+HELP.map(([t,b],i)=>`<div class="card" style="padding:0"><details><summary style="padding:14px 16px;font-weight:800;font-size:16px">${t}</summary><div style="padding:0 16px 14px;line-height:1.7;font-size:15px">${b}</div></details></div>`).join('')+`<button class="g" onclick="closeHelp()">← 돌아가기</button>`;
/* 홀 구성: 9+9(다른 9홀 두 개) · 6+6+6(다른 6홀 세 개) · 9x2(같은 9홀 두 번). 구간이 끝날 때마다 그 구간 결산을 볼 수 있음(게임은 계속) */
